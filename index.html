  {id:"1.2", title:"Board setup and programming basics", minutes:180,
   objectives:["Describe what a microcontroller is and compare the four course boards.","Set up the tools and upload a program to your board (U1-O2).","Identify the structure of an Arduino sketch and a MicroPython script (U1-O2).","Use variables, data types, operators, conditionals, loops, and functions (U1-O2).","Classify and fix syntax, runtime, and logic errors."],
   sections:[
    {id:"mcu", title:"What is a microcontroller?", html:`
     <p>Your aircon remote, an electric fan with a timer, a washing machine, and a rice cooker all contain a small computer called a <b>microcontroller</b>. None of them has a screen or keyboard, yet each follows instructions exactly, thousands of times per second.</p>
     <p>A microcontroller is a complete small computer on one chip. It has three essential parts:</p>
     ${fig(`<svg class="mcu" viewBox="0 0 640 230" role="img" aria-label="Microcontroller anatomy"><rect x="220" y="40" width="200" height="150" rx="14" fill="#1F3A5F"/><text x="320" y="70" text-anchor="middle" fill="#fff" font-weight="700">Microcontroller</text>
      <rect x="240" y="85" width="75" height="40" rx="6" fill="#2A9D8F"/><text x="277" y="110" text-anchor="middle" fill="#fff" font-size="12">Processor</text><rect x="325" y="85" width="75" height="40" rx="6" fill="#E76F51"/><text x="362" y="110" text-anchor="middle" fill="#fff" font-size="12">Memory</text>
      <rect x="240" y="135" width="160" height="40" rx="6" fill="#C9A227"/><text x="320" y="160" text-anchor="middle" fill="#fff" font-size="11">I/O pins (GPIO, ADC)</text>
      <g class="io"><line x1="150" y1="88" x2="220" y2="100"/><line x1="150" y1="152" x2="220" y2="150"/><line x1="420" y1="100" x2="490" y2="88"/><line x1="420" y1="150" x2="490" y2="152"/></g>
      <text x="142" y="92" text-anchor="end" font-size="13" fill="currentColor">Sensors (input)</text><text x="142" y="156" text-anchor="end" font-size="13" fill="currentColor">Button (input)</text><text x="498" y="92" font-size="13" fill="currentColor">LED (output)</text><text x="498" y="156" font-size="13" fill="currentColor">Wi-Fi radio</text></svg>`, "Figure 2.1. A microcontroller's processor runs your program, memory stores it, and pins connect it to the world.")}
     <ul><li>The <b>processor</b> carries out your instructions one at a time, very quickly.</li><li><b>Memory</b> stores your program (flash memory, kept when power is off) and working values (RAM, cleared at power-off).</li><li><b>Input/output pins</b> connect to the world. <b>GPIO</b> (general-purpose input/output) pins can read a signal (a button) or send one (an LED). The <b>ADC</b> turns a sensor's voltage into a number (Module 1.3).</li></ul>
     <p>Unlike a laptop, a microcontroller usually runs <b>one program</b>, starts it instantly at power-up, uses very little energy, and reacts to the physical world in real time.</p>
     <h3>The four course boards</h3>
     <div class="boards">${["uno","esp32","esp8266","pico"].map(boardArt).join("")}</div><p class="illus">Simplified illustrations. See the official product pages for photos and pinout diagrams.</p>
     <table class="t"><tr><th>Board</th><th>Processor</th><th>Language here</th><th>Official page</th></tr>
     <tr><td>Arduino Uno R4 WiFi</td><td>Renesas RA4M1 (Arm Cortex-M4, 48 MHz) + ESP32-S3 for Wi-Fi</td><td>Arduino C++</td><td><a href="${REF.arduinoR4[1]}" target="_blank" rel="noopener">Arduino docs</a></td></tr>
     <tr><td>ESP32 DevKit</td><td>Dual-core Xtensa up to 240 MHz, built-in Wi-Fi</td><td>Arduino C++</td><td><a href="${REF.espressif[1]}" target="_blank" rel="noopener">Espressif</a></td></tr>
     <tr><td>ESP8266 NodeMCU</td><td>Tensilica L106 at 80/160 MHz, built-in Wi-Fi</td><td>Arduino C++</td><td><a href="${REF.esp8266[1]}" target="_blank" rel="noopener">ESP8266 core docs</a></td></tr>
     <tr><td>Raspberry Pi Pico W</td><td>RP2040, dual Cortex-M0+ up to 133 MHz, CYW43439 Wi-Fi</td><td>MicroPython</td><td><a href="${REF.pico[1]}" target="_blank" rel="noopener">Raspberry Pi docs</a></td></tr></table>
     <p><b>Arduino C++</b> is <i>compiled</i>: your computer translates the whole program into machine code first, then uploads it. <b>MicroPython</b> is <i>interpreted</i> on the board: the Pico W reads and runs your Python lines directly, so you can also type single commands and see the result instantly.</p>`},
    {id:"setup", title:"Setting up your tools", html:`
     <h3>Option A: Arduino IDE 2 (Uno R4 WiFi, ESP32, ESP8266)</h3>
     <ol><li>Install <b>Arduino IDE 2</b> from the official Arduino website and open it.</li>
     <li><b>ESP32 and ESP8266 only:</b> open <b>File \u2192 Preferences</b> and paste these into <i>Additional boards manager URLs</i> (one per line):</li></ol>
     ${code("text", "https://espressif.github.io/arduino-esp32/package_esp32_index.json\nhttps://arduino.esp8266.com/stable/package_esp8266com_index.json", "Boards manager URLs")}
     <ol start="3"><li>Open <b>Tools \u2192 Board \u2192 Boards Manager</b> and install <i>Arduino UNO R4 Boards</i>, <i>esp32 by Espressif Systems</i>, or <i>esp8266 by ESP8266 Community</i>.</li>
     <li>Plug in the board with a <b>data</b> USB cable. Choose your board in <b>Tools \u2192 Board</b> and its port in <b>Tools \u2192 Port</b>.</li><li>Open <b>Tools \u2192 Serial Monitor</b> and set it to <b>115200 baud</b>.</li></ol>
     ${ideMock("arduino")}
     <h3>Option B: Thonny with MicroPython (Pico W)</h3>
     <ol><li>Install <b>Thonny</b>.</li><li>Hold the <b>BOOTSEL</b> button on the Pico W while plugging it in; it appears as a USB drive.</li><li>In Thonny: <b>Tools \u2192 Options \u2192 Interpreter \u2192 MicroPython (Raspberry Pi Pico)</b>, and install the MicroPython firmware for the Pico W.</li><li>Type <code>print("hello")</code> in the Shell and press Enter. If it prints <code>hello</code>, you are ready.</li></ol>
     ${ideMock("thonny")}
     ${mis(`<p>"No port appears." Most often the USB cable is <b>charge-only</b>. Try another cable before assuming the board is broken.</p>`)}
     ${tip("No hardware or using an iPad?", `<p>Use the coding sandbox later in this module, or the <a href="${REF.wokwi[1]}" target="_blank" rel="noopener">Wokwi simulator</a> for ESP32 and Pico W projects.</p>`)}
     ${srcs([["Arduino IDE 2", REF.arduinoIDE[1]],["Arduino-ESP32", REF.espArduino[1]],["ESP8266 core", REF.esp8266[1]],["Thonny", REF.thonny[1]],["MicroPython RP2", REF.micropython[1]]])}`},
    {id:"structure", title:"Program structure and your first program (P1)", html:`
     <p>Every Arduino program (called a <b>sketch</b>) has the same skeleton:</p>
     ${fig(`<svg class="flowsk" viewBox="0 0 640 250" role="img" aria-label="Program structure"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B6B7F"/></marker><marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#E76F51"/></marker></defs>
      <rect x="20" y="30" width="170" height="56" rx="10" fill="#5B6B7F"/><text x="105" y="63" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">Power on / reset</text>
      <path d="M192 58 H236" class="arr" marker-end="url(#ah)"/>
      <rect x="240" y="30" width="160" height="56" rx="10" fill="#2A9D8F"/><text x="320" y="54" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">setup()</text><text x="320" y="73" text-anchor="middle" fill="#fff" font-size="11">runs ONCE</text>
      <path d="M402 58 H446" class="arr" marker-end="url(#ah)"/>
      <rect x="450" y="30" width="160" height="56" rx="10" fill="#1F3A5F"/><text x="530" y="54" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">loop()</text><text x="530" y="73" text-anchor="middle" fill="#fff" font-size="11">runs FOREVER</text>
      <path d="M580 88 V120 H480 V92" class="arr loopback" marker-end="url(#ah2)"/>
      <text x="530" y="142" text-anchor="middle" font-size="12" fill="currentColor">repeat: after the last line of loop(),</text><text x="530" y="158" text-anchor="middle" font-size="12" fill="currentColor">it starts again at the top</text>
      <line x1="20" y1="186" x2="620" y2="186" stroke="var(--line)"/>
      <text x="20" y="212" font-size="12.5" fill="currentColor">MicroPython has no setup() or loop(): lines at the top of the file run once,</text><text x="20" y="230" font-size="12.5" fill="currentColor">then a  while True:  block repeats forever (it does the job of loop()).</text></svg>`, "Figure 2.2. setup() runs once at power-up or reset; loop() repeats forever.")}
     <p>Before the code, four pieces of <b>syntax</b> (the grammar rules of a programming language):</p>
     <table class="t"><tr><th>Syntax</th><th>Meaning</th><th>Example</th></tr>
     <tr><td><code>;</code> semicolon</td><td>Ends each statement in C++ (like a period ends a sentence)</td><td><code>delay(500);</code></td></tr>
     <tr><td><code>{ }</code> curly braces</td><td>Mark where a block of code starts and ends</td><td><code>void loop() { ... }</code></td></tr>
     <tr><td><code>( )</code> parentheses</td><td>Hold a function's <b>parameters</b>: the information you give it</td><td><code>pinMode(LED_PIN, OUTPUT)</code></td></tr>
     <tr><td><code>//</code> or <code>#</code></td><td>A <b>comment</b>: a note for humans that the computer ignores</td><td><code>// wait half a second</code></td></tr></table>
     <p>C++ is <b>case-sensitive</b>: <code>Serial</code> and <code>serial</code> are different names. Python uses <b>indentation</b> (4 spaces) instead of braces to show which lines belong inside a block.</p>
     ${anat("P1 Hello, Board (Arduino C++)", [
      ["// P1 - Hello, Board!", "A comment. The compiler ignores everything after //. Use comments to explain your thinking."],
      ["const int LED_PIN = LED_BUILTIN;", "Creates a constant named LED_PIN. <code>const</code> = it never changes; <code>int</code> = whole number; <code>LED_BUILTIN</code> is the board's onboard LED (on most ESP32 DevKits use <code>2</code>). Giving pins names makes code readable and easy to change in one place."],
      ["int count = 0;", "Creates a <b>variable</b> (a named box that holds a value) starting at 0. It is outside any function, so it keeps its value between runs of loop()."],
      ["", ""],
      ["void setup() {", "Starts the setup() function. <code>void</code> means it returns no value; the empty <code>()</code> means it takes no parameters; <code>{</code> opens its block."],
      ["  Serial.begin(115200);", "Opens the USB text connection to your computer at 115200 bits per second (the <b>baud rate</b>). The Serial Monitor must be set to the same speed or you will see garbled symbols."],
      ["  pinMode(LED_PIN, OUTPUT);", "Tells the board this pin will <b>send</b> signals (OUTPUT) rather than read them (INPUT). Two parameters: which pin, and which mode."],
      ["  Serial.println(\"Hello from my board!\");", "Prints text plus a new line. Text inside double quotes is called a <b>string</b>."],
      ["}", "Closes setup(). Every { needs a matching }."],
      ["", ""],
      ["void loop() {", "Starts loop(), which the board repeats forever after setup() finishes."],
      ["  digitalWrite(LED_PIN, HIGH);", "Sets the pin HIGH (about 3.3 V or 5 V), so the LED turns on. LOW (0 V) turns it off."],
      ["  delay(500);", "Pauses the whole program for 500 milliseconds (0.5 s). During a delay the board can do nothing else (Module 1.3 fixes this)."],
      ["  digitalWrite(LED_PIN, LOW);", "LED off."],
      ["  delay(500);", "Another 0.5 s, so one complete blink takes 1 second."],
      ["  count = count + 1;", "Read count, add 1, store the result back in count. Here <code>=</code> means <b>assign</b> (store), not \u201cequals.\u201d"],
      ["  Serial.print(\"Blink #\");", "Prints text <b>without</b> starting a new line\u2026"],
      ["  Serial.println(count);", "\u2026then prints the number and starts a new line, giving \u201cBlink #1\u201d, \u201cBlink #2\u201d\u2026"],
      ["}", "End of loop(). The board jumps back to the first line of loop() and repeats."]])}
     ${serialMock(["Hello from my board!","Blink #1","Blink #2","Blink #3","Blink #4"], "What you should see in the Serial Monitor")}
     ${anat("P1 Hello, Board (MicroPython, Pico W)", [
      ["from machine import Pin", "Loads the <code>Pin</code> tool from MicroPython's <code>machine</code> module, which controls the chip's hardware."],
      ["import time", "Loads the <code>time</code> module for pauses and clocks."],
      ["", ""],
      ["led = Pin(\"LED\", Pin.OUT)", "Creates a Pin object for the Pico W's onboard LED. <code>\"LED\"</code> is its name; <code>Pin.OUT</code> makes it an output."],
      ["count = 0", "Creates a variable. Python works out the type (whole number) automatically; no semicolon needed."],
      ["print(\"Hello from Pico W!\")", "Prints to the Thonny Shell."],
      ["", ""],
      ["while True:", "An endless loop: the condition <code>True</code> never becomes false. The colon <code>:</code> starts the block."],
      ["    led.toggle()", "Indented 4 spaces, so it belongs inside the loop. <code>toggle()</code> flips the LED on\u2194off."],
      ["    time.sleep(0.5)", "Pause 0.5 seconds. Python's sleep uses <b>seconds</b>; Arduino's delay uses <b>milliseconds</b>."],
      ["    count += 1", "Short for <code>count = count + 1</code>."],
      ["    print(\"Toggle #\", count)", "Prints both values with a space between them."]])}
     <p>Step through P1 below and watch which line runs, what the LED does, and what the Serial Monitor prints.</p>`, interactive:"tracer"},
    {id:"vars", title:"Variables and constants: giving names to values", html:`
     <p>Look at the first line of P1: <code>const int LED_PIN = 2;</code>. What is <code>LED_PIN</code>, and why not just write <code>2</code>? This section answers that.</p>
     <h3>What is a variable?</h3>
     <p>A <b>variable</b> is a <b>named storage box</b> in the board's memory. The name lets you find the box; the value is what is inside. You can look inside (use the value) or put a new value in (change it). Think of a labeled jar: the label is the name (<code>count</code>), the contents are the value (<code>3</code>).</p>
     <p>Every variable goes through three actions:</p>
     <table class="t"><tr><th>Action</th><th>Meaning</th><th>C++</th><th>Python</th></tr>
     <tr><td><b>Create</b> (declare)</td><td>Make a new box with a name (and, in C++, a type)</td><td><code>int count = 0;</code></td><td><code>count = 0</code></td></tr>
     <tr><td><b>Change</b> (assign)</td><td>Put a new value in the box</td><td><code>count = count + 1;</code></td><td><code>count = count + 1</code></td></tr>
     <tr><td><b>Use</b> (read)</td><td>Take a copy of the value to use somewhere</td><td><code>Serial.println(count);</code></td><td><code>print(count)</code></td></tr></table>
     <h3>Creating variables in C++</h3>
     <p>C++ needs three parts: the <b>type</b> (what kind of value), the <b>name</b>, and usually a starting <b>value</b>.</p>
     ${anat("Anatomy of a C++ variable", [["int count = 0;", "<code>int</code> = type (a whole number) \u2022 <code>count</code> = name \u2022 <code>=</code> = store \u2022 <code>0</code> = starting value \u2022 <code>;</code> = end of statement."],["float temp = 29.4;", "<code>float</code> stores decimal numbers, such as temperatures."],["bool isDark = false;", "<code>bool</code> stores only <code>true</code> or <code>false</code>."],["String deviceId = \"team3\";", "<code>String</code> stores text, written inside double quotes."],["unsigned long lastRead = 0;", "<code>unsigned long</code> stores large whole numbers that are never negative, like time in milliseconds."]])}
     <h3>Creating variables in Python</h3>
     <p>Python is simpler: write the name, <code>=</code>, and the value. Python works out the type from the value, and no semicolon is needed.</p>
     ${code("python", "count = 0          # a whole number (int)\ntemp = 29.4        # a decimal number (float)\nis_dark = False    # True or False (bool), capital T/F in Python\ndevice_id = \"team3\" # text (str)", "Variables in Python")}
     <h3>Constants: values that never change</h3>
     <p>Some values should <b>never</b> change while the program runs, such as the pin your LED is wired to. These are <b>constants</b>.</p>
     <ul><li><b>C++:</b> add <code>const</code> in front: <code>const int LED_PIN = 2;</code>. If any later line tries to change it, the compiler stops with an error, which protects you from accidents.</li>
     <li><b>Python:</b> there is no <code>const</code> keyword. Programmers use a <b>convention</b>: names in ALL CAPITALS mean \u201cdo not change this”: <code>LED_PIN = 25</code>.</li></ul>
     ${ex("why name the pin instead of writing 2?", `<p>Imagine a program that uses pin 2 in five places: <code>pinMode(2, OUTPUT)</code>, <code>digitalWrite(2, HIGH)</code>, and so on. Now you move the LED to pin 25. Without a constant you must find and change all five 2s (and not miss one!). With <code>const int LED_PIN = 2;</code> you change <b>one line</b> to <code>25</code>, and every use updates automatically. Names also make code readable: <code>digitalWrite(LED_PIN, HIGH)</code> says what it does; <code>digitalWrite(2, HIGH)</code> does not. A bare number with no explanation is sometimes called a \u201cmagic number.\u201d</p>`)}
     <h3>Naming rules and good habits</h3>
     <table class="t"><tr><th>Rule</th><th>OK</th><th>Not OK</th></tr><tr><td>Letters, digits, underscores only</td><td><code>light_pct</code></td><td><code>light-pct</code>, <code>light pct</code></td></tr><tr><td>Cannot start with a digit</td><td><code>sensor2</code></td><td><code>2sensor</code></td></tr><tr><td>Case-sensitive</td><td><code>count</code> and <code>Count</code> are <i>different</i> boxes</td><td>\u2014</td></tr><tr><td>Not a reserved word</td><td><code>myLoop</code></td><td><code>int</code>, <code>for</code>, <code>while</code></td></tr></table>
     <p><b>Style conventions:</b> Arduino code often uses <code>camelCase</code> (<code>lightPct</code>), Python uses <code>snake_case</code> (<code>light_pct</code>), and constants use <code>UPPER_CASE</code> (<code>LED_PIN</code>) in both.</p>
     <h3>Where you create a variable matters (scope)</h3>
     <p>A variable created <b>outside</b> all functions (at the top of the sketch) is <b>global</b>: it exists the whole time and keeps its value. A variable created <b>inside</b> <code>loop()</code> is <b>local</b>: it is created fresh, with its starting value, every time loop() runs.</p>
     ${mis(`<p>Putting a counter inside <code>loop()</code>:</p><pre class="code">void loop() {\n  int count = 0;      // re-created as 0 on EVERY pass\n  count = count + 1;  // so count is always 1\n  Serial.println(count);\n}</pre><p>It prints 1, 1, 1\u2026 forever. Move <code>int count = 0;</code> above <code>setup()</code> so it is created once and keeps counting.</p>`)}
     ${mis(`<p><b>= is not \u201cequals.\u201d</b> <code>count = count + 1</code> means \u201ctake the value in count, add 1, and store the result back in count.\u201d To <i>compare</i> two values, use <code>==</code> (next section).</p>`)}
     <p>Step through the program below and watch the memory boxes change.</p>
     ${srcs([["Arduino: const", REF.arduinoConst[1]],["Arduino language reference", REF.arduinoRef[1]],["Python tutorial", REF.pyTutorial[1]]])}`, interactive:"vartrace:vars"},
    {id:"varsdrill", title:"Drill: variables and constants", html:`<p>Check your understanding before moving on. Each answer explains why.</p>`, interactive:"drill:vars"},
    {id:"ifelse", title:"Making decisions: if, else if, and else", html:`
     <p>Programs often need to choose: <i>if it is dark, turn the LED on; otherwise, turn it off</i>. That is an <b>if statement</b>.</p>
     ${anat("Anatomy of an if / else (C++)", [["if (light < 30) {", "<code>if</code> + a <b>condition</b> in parentheses. A condition is a question whose answer is true or false. <code>{</code> starts the block that runs when it is true."],["  digitalWrite(LED_PIN, HIGH);", "Runs only when light &lt; 30 is true. Indenting the inside lines makes the structure easy to see."],["} else {", "<code>else</code> = \u201cotherwise.\u201d Its block runs only when the condition is false."],["  digitalWrite(LED_PIN, LOW);", ""],["}", "Closes the else block. Exactly one of the two blocks runs every time."]])}
     ${code("python", "if light < 30:\n    led.on()       # runs when the condition is True\nelse:\n    led.off()      # runs when it is False", "The same decision in Python: a colon, then an indented block")}
     <h3>Comparison operators</h3>
     <table class="t"><tr><th>Operator</th><th>Question</th><th>Example (light = 25)</th><th>Result</th></tr><tr><td><code>&lt;</code></td><td>less than?</td><td><code>light &lt; 30</code></td><td>true</td></tr><tr><td><code>&gt;</code></td><td>greater than?</td><td><code>light &gt; 30</code></td><td>false</td></tr><tr><td><code>&lt;=</code></td><td>less than or equal?</td><td><code>light &lt;= 25</code></td><td>true</td></tr><tr><td><code>&gt;=</code></td><td>greater than or equal?</td><td><code>light &gt;= 30</code></td><td>false</td></tr><tr><td><code>==</code></td><td>equal?</td><td><code>light == 25</code></td><td>true</td></tr><tr><td><code>!=</code></td><td>not equal?</td><td><code>light != 25</code></td><td>false</td></tr></table>
     <h3>More than two choices: else if</h3>
     <p>Conditions are checked <b>from top to bottom</b>, and only the <b>first</b> true one runs. Order matters.</p>
     ${code("cpp", "if (light < 30) {\n  Serial.println(\"Dark\");\n} else if (light < 70) {   // only checked if light is NOT < 30\n  Serial.println(\"Dim\");\n} else {\n  Serial.println(\"Bright\");\n}", "Three choices (Python writes else if as elif)")}
     <h3>Combining conditions</h3>
     <p>Use <b>AND</b> when both must be true and <b>OR</b> when either is enough. C++: <code>&amp;&amp;</code> and <code>||</code>; Python: <code>and</code> and <code>or</code>. Example: <code>if (temp &gt; 31 &amp;&amp; light &gt; 50)</code> \u2192 hot <i>and</i> bright.</p>
     ${mis(`<ul><li><code>if (light = 30)</code> uses <b>=</b> (store) instead of <b>==</b> (compare). Use <code>==</code>.</li><li>Missing <code>else</code>: the LED turns on in the dark but never turns off again.</li><li>Python: forgetting the colon <code>:</code> or the indentation after <code>if</code>.</li><li>Not testing <b>boundary values</b>: with <code>light &lt; 30</code>, what happens at exactly 30? (It counts as not dark.)</li></ul>`)}
     <p>Try it: move the light slider and watch which branch runs.</p>
     ${srcs([["Arduino: if", REF.arduinoIf[1]],["Python tutorial: control flow", REF.pyControl[1]]])}`, interactive:"condlab"},
    {id:"ifdrill", title:"Drill: decisions", html:`<p>Predict which branch runs, then check.</p>`, interactive:"drill:ifelse"},
    {id:"loops", title:"Loops: making code repeat", html:`
     <p>Microcontrollers repeat jobs constantly: read, decide, act, again. A <b>loop</b> repeats a block of code so you do not have to write it many times.</p>
     <h3>Loop 1: the main loop you already know</h3>
     <p><code>loop()</code> in Arduino and <code>while True:</code> in MicroPython repeat <b>forever</b> while the board has power. Everything inside runs, then starts again from the top.</p>
     <h3>Loop 2: while \u2014 repeat while a condition is true</h3>
     <p>A <b>while loop</b> checks its condition <b>before</b> each repeat. If true, the block runs; if false, the loop ends and the program continues below it.</p>
     ${code("cpp", "int n = 3;\nwhile (n > 0) {          // keep going while n is above 0\n  Serial.println(n);\n  n = n - 1;              // n gets smaller each time, so the loop ends\n}\nSerial.println(\"Go!\");    // prints 3, 2, 1, Go!", "while loop in C++ (Python: while n > 0:)")}
     <p><code>while (true)</code> (Python: <code>while True:</code>) never ends. That is exactly what we want for the main loop, but inside <code>setup()</code> or before your main code it would freeze the program forever.</p>
     <h3>Loop 3: for \u2014 repeat a set number of times</h3>
     <p>Use a <b>for loop</b> when you know how many times to repeat, like \u201cblink 3 times.\u201d In C++ it has three parts, separated by semicolons:</p>
     ${anat("Anatomy of a C++ for loop", [["for (int i = 0; i < 3; i++) {", "<b>Start:</b> <code>int i = 0</code> creates a counter named i (runs once). <b>Condition:</b> <code>i &lt; 3</code> is checked before each repeat. <b>Step:</b> <code>i++</code> adds 1 to i after each repeat (same as <code>i = i + 1</code>)."],["  digitalWrite(LED_PIN, HIGH);", "The <b>body</b>: runs once per repeat."],["  delay(150);", ""],["  digitalWrite(LED_PIN, LOW);", ""],["  delay(150);", ""],["}", "Back to the step, then the condition. When i reaches 3, <code>3 &lt; 3</code> is false and the loop ends."]])}
     <table class="t"><tr><th>Pass</th><th>i at the start</th><th>i &lt; 3?</th><th>What happens</th></tr><tr><td>1</td><td>0</td><td>yes</td><td>blink, then i becomes 1</td></tr><tr><td>2</td><td>1</td><td>yes</td><td>blink, then i becomes 2</td></tr><tr><td>3</td><td>2</td><td>yes</td><td>blink, then i becomes 3</td></tr><tr><td>\u2014</td><td>3</td><td>no</td><td>loop ends: exactly 3 blinks</td></tr></table>
     <h3>for loops in Python: range()</h3>
     <p>Python's for loop walks through a sequence of numbers made by <code>range()</code>. The <b>stop</b> value is <b>not included</b>.</p>
     <table class="t"><tr><th>Python</th><th>Values of i</th><th>C++ equivalent</th></tr><tr><td><code>for i in range(3):</code></td><td>0, 1, 2</td><td><code>for (int i = 0; i &lt; 3; i++)</code></td></tr><tr><td><code>for i in range(1, 6):</code></td><td>1, 2, 3, 4, 5</td><td><code>for (int i = 1; i &lt; 6; i++)</code></td></tr><tr><td><code>for i in range(10, 0, -2):</code></td><td>10, 8, 6, 4, 2</td><td><code>for (int i = 10; i &gt; 0; i -= 2)</code></td></tr></table>
     <h3>A loop inside a loop</h3>
     <p>The Core challenge puts a for loop <b>inside</b> the main loop. Each time the main loop runs once, the for loop runs all 3 of its repeats, then the pause happens, then the main loop starts again. Where you put a line (inside or outside the for loop's braces or indentation) decides how often it runs.</p>
     <table class="t"><tr><th>Use\u2026</th><th>When\u2026</th><th>Example</th></tr><tr><td><code>loop()</code> / <code>while True</code></td><td>the job repeats as long as the board is on</td><td>reading sensors every 2 s</td></tr><tr><td><code>for</code></td><td>you know how many times</td><td>blink 3 times; read 10 samples</td></tr><tr><td><code>while (condition)</code></td><td>you repeat until something changes</td><td>wait until Wi-Fi connects (Unit 2)</td></tr></table>
     ${mis(`<ul><li><b>Off by one:</b> <code>i &lt;= 3</code> starting at 0 runs 4 times (0, 1, 2, 3). Count the values to check.</li><li><b>A semicolon after the for line:</b> <code>for (int i = 0; i &lt; 3; i++);</code> makes an empty loop; the block below then runs only once.</li><li><b>A while loop that never ends:</b> nothing inside changes the condition (forgetting <code>n = n - 1</code>).</li><li><b>Python indentation:</b> lines meant to be inside the loop must be indented further than the <code>for</code> line.</li></ul>`)}
     <p>Build your own for loop below and watch the counter, then trace the Core challenge pattern.</p>
     ${srcs([["Arduino: for", REF.arduinoFor[1]],["Arduino: while", REF.arduinoWhile[1]],["Python tutorial: control flow", REF.pyControl[1]]])}`, interactive:"loopmachine"},
    {id:"looptrace", title:"Trace it: the Core challenge loop", html:`<p>Step through the nested loop and watch <code>i</code>, the LED, and the clock. Notice when the 2-second pause happens.</p>`, interactive:"vartrace:loop"},
    {id:"loopdrill", title:"Drill: loops", html:`<p>Includes a Parsons puzzle: put the lines of code in the right order.</p>`, interactive:"drill:loops"},
    {id:"delay", title:"Waiting: delay() and sleep()", html:`
     <p>A microcontroller runs millions of instructions per second. Without a pause, an LED would switch on and off so fast that it would look permanently on. <code>delay()</code> tells the board to <b>wait</b>.</p>
     <h3>How it works</h3>
     <table class="t"><tr><th>Language</th><th>Command</th><th>Unit</th><th>Half a second</th></tr><tr><td>Arduino C++</td><td><code>delay(ms)</code></td><td>milliseconds (1 s = 1000 ms)</td><td><code>delay(500);</code></td></tr><tr><td>MicroPython</td><td><code>time.sleep(s)</code></td><td>seconds (decimals allowed)</td><td><code>time.sleep(0.5)</code></td></tr><tr><td>MicroPython</td><td><code>time.sleep_ms(ms)</code></td><td>milliseconds</td><td><code>time.sleep_ms(500)</code></td></tr></table>
     ${ex("calculating a blink", `<p>LED on with <code>delay(300)</code>, off with <code>delay(700)</code>. One blink = 300 + 700 = <b>1000 ms = 1 s</b>, so it blinks <b>once per second</b> (1 Hz). In 10 seconds: 10 blinks. The LED is on 300 \u00f7 1000 = 30 % of the time.</p>`)}
     <h3>delay() blocks everything</h3>
     <p>During <code>delay(2000)</code> the board does <b>nothing else</b> for 2 seconds: it cannot read a sensor, check a button, or update an LED. This is called <b>blocking</b>. It is fine for simple jobs, but not when the board must react quickly.</p>
     <table class="t"><tr><th>delay() is fine for\u2026</th><th>Avoid delay() when\u2026</th></tr><tr><td>a simple blink (P1)</td><td>the board must react to changes, like a light alarm</td></tr><tr><td>a short pause in setup()</td><td>you do several jobs at different speeds</td></tr><tr><td>practice programs</td><td>long waits (seconds) in a sensor program</td></tr></table>
     <p>In Module 1.3 you will learn the professional alternative, <code>millis()</code>, which checks the clock instead of waiting.</p>
     ${mis(`<ul><li><code>delay(0.5)</code> in C++ is not half a second: delay takes <b>whole milliseconds</b>, so it waits about 0 ms. Write <code>delay(500)</code>.</li><li><code>time.sleep(500)</code> in Python waits <b>500 seconds</b> (over 8 minutes)! Write <code>time.sleep(0.5)</code> or <code>time.sleep_ms(500)</code>.</li><li>Forgetting the delay after turning the LED off: <code>loop()</code> immediately turns it on again, so it looks always on.</li></ul>`)}
     <p>Change the on and off times below and watch the timeline, the code, and the board's \u201cbusy\u201d time.</p>
     ${srcs([["Arduino: delay()", REF.arduinoDelay[1]],["MicroPython: time", REF.mpTime[1]]])}`, interactive:"delaylab"},
    {id:"delaydrill", title:"Drill: delay and timing", html:`<p>Calculate and predict, then check.</p>`, interactive:"drill:delay"},
    {id:"print", title:"Printing to the Serial Monitor", html:`
     <p>The board has no screen. To see values, it sends text over the USB cable to your computer's <b>Serial Monitor</b> (Arduino IDE) or <b>Shell</b> (Thonny). Printing is how you check that your program works, and in Module 1.3 it is how you create your dataset.</p>
     <h3>In C++: Serial.begin, print, and println</h3>
     <table class="t"><tr><th>Command</th><th>What it does</th></tr><tr><td><code>Serial.begin(115200);</code></td><td>Opens the connection once, in <code>setup()</code>. 115200 is the speed (baud); the Serial Monitor must match.</td></tr><tr><td><code>Serial.print(x);</code></td><td>Prints x and <b>stays on the same line</b>.</td></tr><tr><td><code>Serial.println(x);</code></td><td>Prints x, then <b>starts a new line</b> (\u201cprint line\u201d).</td></tr><tr><td><code>Serial.print(t, 1);</code></td><td>Prints a decimal number with <b>1 decimal place</b>. Without the second value, floats print with 2 decimals.</td></tr></table>
     ${ex("building one line from pieces", `<pre class="code">Serial.print("Temp: ");      // Temp: \nSerial.print(29.45, 1);      // Temp: 29.5   (rounded to 1 decimal)\nSerial.println(" C");        // Temp: 29.5 C   then a new line</pre><p>Three print commands make one line, because only the last one is <code>println</code>.</p>`)}
     <h3>In Python: print()</h3>
     <p>Python's <code>print()</code> always starts a new line at the end. Give it several values separated by commas and it puts a <b>space</b> between them.</p>
     ${code("python", "t = 29.45\nprint(\"Temp:\", t)               # Temp: 29.45\nprint(\"Temp:\", round(t, 1), \"C\")  # Temp: 29.5 C\nprint(\"a\", \"b\", sep=\",\")          # a,b      (sep changes the space to a comma)\nprint(\"{:.1f}\".format(t))          # 29.5     (format with 1 decimal place)", "print() in MicroPython")}
     <h3>Printing CSV</h3>
     <p>A CSV row is values separated by <b>commas</b> with a new line at the end. In C++: print each value, print a comma between them, and use <code>println</code> on the last value. In Python, <code>format</code> builds the whole row in one go: each <code>{}</code> is filled with the next value, and <code>{:.1f}</code> means one decimal.</p>
     ${code("cpp", "Serial.print(now);     Serial.print(',');\nSerial.print(t, 1);    Serial.print(',');\nSerial.println(h, 1);  // 4002,29.4,70.9", "One CSV row in C++ (Python: print(\"{},{:.1f},{:.1f}\".format(now, t, h)))")}
     ${mis(`<ul><li>Garbled symbols: the Serial Monitor speed is not 115200.</li><li>Everything on one endless line: the row never ends with <code>println</code>.</li><li><code>Serial.print("count")</code> prints the <i>word</i> count; <code>Serial.print(count)</code> prints the <i>value</i> of the variable. Quotes make text.</li><li>Printing a header inside <code>loop()</code> repeats it every time.</li></ul>`)}
     <p>Experiment with print and println below.</p>
     ${srcs([["Arduino: Serial.print()", REF.arduinoPrint[1]],["Python: input and output", REF.pyIO[1]]])}`, interactive:"printlab"},
    {id:"printdrill", title:"Drill: printing", html:`<p>Predict exactly what appears in the Serial Monitor.</p>`, interactive:"drill:print"},
    {id:"blocks", title:"Math and functions", html:`
     <h3>Arithmetic operators</h3>
     <table class="t"><tr><th>Operator</th><th>Meaning</th><th>Example \u2192 result</th></tr><tr><td><code>+ - *</code></td><td>add, subtract, multiply</td><td><code>3 * 4</code> \u2192 12</td></tr><tr><td><code>/</code></td><td>divide</td><td><code>7.0 / 2</code> \u2192 3.5</td></tr><tr><td><code>%</code></td><td>remainder</td><td><code>7 % 2</code> \u2192 1</td></tr></table>
     ${mis(`<p><b>Integer division.</b> In C++, <code>7 / 2</code> gives <b>3</b> because both numbers are whole numbers, so the decimal is thrown away. Write <code>7.0 / 2</code> to get 3.5. This matters for light %: <code>raw / 4095 * 100</code> gives 0 for almost every reading, but <code>raw / 4095.0 * 100</code> works. In Python, <code>7 / 2</code> gives 3.5 and <code>7 // 2</code> gives 3.</p>`)}
     <h3>Functions</h3>
     <p>A <b>function</b> packages a job under a name so you can reuse it. It can take <b>parameters</b> (inputs) and <b>return</b> a value (output).</p>
     ${anat("A function with a parameter and a return value", [["float cToF(float c) {", "<code>float</code> before the name = the type of value it returns. <code>cToF</code> = its name. <code>(float c)</code> = one parameter named c."],["  return c * 9.0 / 5.0 + 32.0;", "<code>return</code> sends the answer back to whoever called the function."],["}", ""],["Serial.println(cToF(30.0));", "Calling the function with 30.0. It returns 86.0, which println prints as 86.00."]])}
     <p>Now practice predicting before running:</p>`, interactive:"primm"},
    {id:"solve", title:"How to solve a challenge: the engineering design process", html:`
     <p>Every challenge in this course, from blinking an LED to your final capstone, is a problem to solve. Beginners often jump straight to typing code, get stuck, and feel lost. Engineers use a <b>process</b> instead. This course uses NASA's <b>Engineering Design Process (EDP)</b>, an iterative cycle used in NASA's education programs: engineers <b>ask</b> questions, <b>imagine</b> solutions, <b>plan</b> designs, <b>create</b> and <b>test</b> models, <b>improve</b> them, and <b>share</b> their ideas.</p>
     <table class="t"><tr><th>Step</th><th>Engineers ask…</th><th>In a coding challenge you…</th></tr>
     <tr><td><b>1. Ask</b></td><td>What is the problem? What are the requirements and limits?</td><td>Restate the task in your own words. List what the program must do, how it will be checked, and any rules (e.g., “no delay()”).</td></tr>
     <tr><td><b>2. Imagine</b></td><td>What are some possible solutions? What have others done?</td><td>Think of two ways to solve it. Look at similar code you have seen (P1, the drills) and pick the approach that best meets the requirements.</td></tr>
     <tr><td><b>3. Plan</b></td><td>Which idea is best? Can I draw it?</td><td>Break the problem into small steps and write <b>pseudocode</b> (steps in plain words) or draw a timeline or flowchart.</td></tr>
     <tr><td><b>4. Create</b></td><td>Build a prototype that meets the requirements.</td><td>Translate one pseudocode step at a time into code.</td></tr>
     <tr><td><b>5. Test</b></td><td>Does it work? What does the data show?</td><td><b>Predict</b> what should happen, run it, and compare. Read error messages and check results.</td></tr>
     <tr><td><b>6. Improve</b></td><td>What failed, and why? What should change?</td><td>Fix <b>one thing at a time</b>, then test again. Repeat until every check passes.</td></tr>
     <tr><td><b>7. Share</b></td><td>How do we communicate the design?</td><td>Explain your code to a partner line by line; record what you learned.</td></tr></table>
     <p>The process is a <b>cycle</b>, not a straight line: testing often sends you back to planning. That is normal, not failure.</p>
     <h3>Thinking tools for the Plan step</h3>
     <ul><li><b>Decomposition:</b> break a big problem into small jobs you can solve one by one (“print a header,” “make a timer,” “read sensors,” “print a row”).</li><li><b>Pattern recognition:</b> spot what repeats (“on, wait, off, wait” three times) so you can use a loop.</li><li><b>Pseudocode:</b> write the steps in plain words first. If the plan is right, the code is just translation.</li></ul>
     <p>These thinking skills are part of <b>computational thinking</b>. The mathematician George Pólya described the same core idea for any problem in four steps: <i>understand the problem, devise a plan, carry out the plan, and look back</i>.</p>
     ${ex("using the process on the Core challenge", `<p><b>Ask:</b> “3 quick blinks (150 ms on/off), then a 2 s pause, forever, with a for loop.” <b>Imagine:</b> copy the blink lines 3 times, or use a for loop; the loop is shorter and required. <b>Plan:</b></p><pre class="code">repeat forever:
    repeat 3 times:  LED on, wait 150; LED off, wait 150
    wait 2000</pre><p><b>Create:</b> type the for loop, then the pause after it. <b>Test:</b> predict 4 rounds in 13 s; run and count the groups. <b>Improve:</b> if a group has 4 blinks, check <code>i &lt; 3</code>. <b>Share:</b> explain why the pause is outside the loop.</p>`)}
     <h3>How the sandbox supports the process</h3>
     <ol><li>Open <b>Plan before you code</b> in each challenge and answer its questions.</li><li>You have <b>5 tries</b>. Each ✗ message tells you what to change; use <b>Hint</b> if you are stuck.</li><li>After 5 tries, choose <b>5 more tries</b> or the <b>explained solution</b>, which walks through Ask, Plan, Create, Test, and Improve step by step.</li><li>After you pass, open the explained solution anyway to compare it with your own approach.</li></ol>
     ${tip("Where AI fits", `<p>Follow the human-in-the-loop rule <b>attempt first</b>: go through Ask and Plan yourself before asking Sensi. Then ask for a hint about one step, not the whole answer.</p>`)}
     ${srcs([["NASA eClips: Engineering design process guide", REF.nasaEDP[1]],["NASA JPL: EDP flow chart", REF.jplEDP[1]],["Wing, 2006 (computational thinking)", REF.wing[1]]])}`, interactive:"solvecycle"},
    {id:"errors", title:"Three kinds of errors", html:`
     <p>Errors are a normal part of programming, not a sign of failure. Knowing which <b>kind</b> of error you have tells you where to look.</p>
     <table class="t"><tr><th>Kind</th><th>What happens</th><th>Example</th><th>How to find it</th></tr>
     <tr><td>Syntax</td><td>Will not upload or run</td><td>Missing <code>;</code>, <code>serial</code> instead of <code>Serial</code>, wrong indentation in Python</td><td>Read the <b>first</b> error message and its line number</td></tr>
     <tr><td>Runtime</td><td>Uploads, then crashes</td><td>Python: dividing by zero; using a variable before creating it</td><td>Read the Shell message; check values just before the crash</td></tr>
     <tr><td>Logic</td><td>Runs without errors but does the wrong thing</td><td>LED never turns off because both lines use HIGH</td><td>Predict what each line should do, then compare</td></tr></table>
     <div class="mockwin err"><div class="mockbar"><i></i><i></i><i></i><span>Output (compiler error)</span></div><pre class="serial static">sketch.ino: In function 'void setup()':
sketch.ino:5:3: error: 'serial' was not declared in this scope
    5 |   serial.begin(115200);
      |   ^~~~~~
note: suggested alternative: 'Serial'</pre></div>
     <p><b>Reading that message:</b> <code>sketch.ino:5:3</code> means file, <b>line 5</b>, column 3. \u201cNot declared\u201d means the compiler does not know that name, almost always a spelling or capital-letter mistake. The note even suggests the fix.</p>
     ${tip("Debugging routine", `<ol><li>Read the first error only, and go to its line.</li><li>Check spelling and capitals, semicolons, and matching braces or indentation.</li><li>Add <code>Serial.println()</code> lines to see values while the program runs.</li><li>Change one thing at a time, then test again.</li></ol>`)}
     <h3>Practice in the coding sandbox</h3>
     <p>Write your program below. The sandbox runs it on a virtual board, animates the LED and Serial Monitor, and checks it against the challenge. If a check fails, it explains why. Start with the warm-up, then try the <b>Core challenge</b>: blink 3 times quickly (0.15 s on, 0.15 s off), then pause 2 s, forever, using a <code>for</code> loop.</p>`, interactive:"sandbox:sb_blink,sb_pattern"}
   ],
   quiz:[
    {q:"Which function runs only once when the board starts?", o:["loop()","setup()","delay()","Serial.print()"], a:1, e:"setup() runs once after power-up or reset, to prepare pins and connections.", w:["loop() runs again and again forever after setup() finishes.","","delay() pauses the program; it is not part of the program's structure.","Serial.print() sends text; it can be used anywhere and runs every time it is reached."]},
    {q:"What does 115200 in Serial.begin(115200) set?", o:["The pin number","The baud rate, which must match the Serial Monitor","The delay in milliseconds","The LED brightness"], a:1, e:"It is the serial speed in bits per second; the Serial Monitor must use the same value.", w:["Pins are set with pinMode() and digitalWrite(), not Serial.begin().","","Delays are set with delay(); Serial.begin() does not pause anything.","LED brightness is not controlled by Serial at all."]},
    {q:"int x = 9; int y = 4; Serial.println(x / y); prints:", o:["2.25","2","3","2.0"], a:1, e:"Both values are int, so C++ does integer division and drops the decimal part: 9 / 4 = 2.", w:["2.25 would need at least one float, e.g., 9.0 / 4.","","Integer division drops the decimal; it does not round up to 3.","2.0 is a float format; an int prints without decimals."]},
    {q:"In MicroPython, what shows which lines are inside a loop?", o:["Curly braces","Semicolons","Indentation","Comments"], a:2, e:"Python uses indentation (4 spaces) to define blocks.", w:["Curly braces define blocks in C++, not Python.","Semicolons end statements in C++; Python does not need them.","","Comments are ignored by the computer and never define blocks."]},
    {q:"A program runs, but the LED never turns off. What kind of error is this?", o:["Syntax","Runtime","Logic","Network"], a:2, e:"It runs without any message but does the wrong thing: a logic error (e.g., both digitalWrite lines use HIGH).", w:["A syntax error would stop the program from uploading at all.","A runtime error would crash or stop the program with a message.","","No network is involved in blinking an LED."]}
   ],
