  ,{id:"1.3", title:"Reading sensors", minutes:240,
   objectives:["Distinguish analog and digital signals and explain the voltage divider.","Explain how an ADC turns voltage into numbers and calculate readings for your board.","Wire an LDR and a DHT22 and convert raw readings to calibrated units (U1-O3).","Implement non-blocking timing and justify it over delay() (U1-O4).","Use a structured AI prompt and verify each claim against documentation (U1-O7)."],
   sections:[
    {id:"signals", title:"Analog and digital signals", html:`
     <p>Sensors talk to the board with electrical signals. There are two kinds:</p>
     ${fig(`<svg class="sig" viewBox="0 0 640 200" role="img" aria-label="Analog vs digital signals"><text x="20" y="20" font-weight="700" fill="currentColor">Analog</text><path class="wave" d="M20 120 C70 40 120 40 160 100 S250 170 300 90" fill="none" stroke="#2A9D8F" stroke-width="4"/><text x="20" y="190" font-size="12" fill="currentColor">any value in a range (LDR voltage)</text>
      <text x="340" y="20" font-weight="700" fill="currentColor">Digital</text><path class="wave" d="M340 150 H380 V60 H430 V150 H470 V60 H540 V150 H620" fill="none" stroke="#E76F51" stroke-width="4"/><text x="340" y="190" font-size="12" fill="currentColor">only HIGH or LOW (DHT22 data line, LED pin)</text></svg>`, "Figure 3.1. Analog signals vary smoothly; digital signals jump between two levels.")}
     <ul><li>An <b>analog</b> signal can be any value in a range, like a dimmer switch. Our <b>LDR</b> (light sensor) gives an analog voltage.</li><li>A <b>digital</b> signal has only two levels, HIGH and LOW, like a light switch. The <b>DHT22</b> contains its own tiny chip that measures the air and sends the result as a coded pattern of HIGH/LOW pulses.</li></ul>
     ${ex("which is which?", `<p>A push button gives a digital signal (pressed or not). A potentiometer (a turning knob) gives an analog voltage. A thermometer chip that sends numbers over a wire is digital, even though temperature itself varies smoothly.</p>`)}`},
    {id:"ldr", title:"Meet the LDR: a light-dependent resistor", html:`
     <p>The <b>LDR</b> (light-dependent resistor), also called a <b>photoresistor</b>, <b>photocell</b>, or <b>photoconductive cell</b>, is a resistor whose resistance changes with light. It is one of the simplest and cheapest light sensors, used in automatic street lights, night lights, and old camera light meters.</p>
     <h3>What it looks like</h3>
     ${fig(`<svg class="ldrart" viewBox="0 0 520 200" role="img" aria-label="LDR top view and side view"><g transform="translate(110,100)"><circle r="72" fill="#F1E3C1" stroke="#9A7B4F" stroke-width="3"/><rect x="-56" y="-48" width="10" height="96" rx="3" fill="#B8BDC6"/><rect x="46" y="-48" width="10" height="96" rx="3" fill="#B8BDC6"/><path d="M-46 -40 H36 V-24 H-36 V-8 H36 V8 H-36 V24 H36 V40 H-46" fill="none" stroke="#C2410C" stroke-width="7" stroke-linejoin="round"/><text y="94" text-anchor="middle" font-size="12" fill="currentColor">top view: zig-zag CdS track</text></g>
      <g transform="translate(360,30)"><path d="M-36 40 a36 22 0 0 1 72 0 v18 h-72z" fill="#F1E3C1" stroke="#9A7B4F" stroke-width="2"/><line x1="-14" y1="58" x2="-14" y2="150" stroke="#9CA3AF" stroke-width="5"/><line x1="14" y1="58" x2="14" y2="150" stroke="#9CA3AF" stroke-width="5"/><text x="0" y="168" text-anchor="middle" font-size="12" fill="currentColor">side view: 2 legs, no polarity</text>${[[-50,0],[-20,-8],[10,-6],[40,2]].map(p=>`<path d="M${p[0]} ${p[1]-20} l8 14" stroke="#EAB308" stroke-width="3" marker-end="url(#ray)"/>`).join("")}</g>
      <defs><marker id="ray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#EAB308"/></marker></defs></svg>`, "Figure 3.1a. A typical 5 mm LDR (simplified illustration). The orange zig-zag is the light-sensitive cadmium sulfide (CdS) track between two metal electrodes.", "Original illustration based on manufacturer descriptions.")}
     <p>A common LDR is a small disc about 5 mm across with <b>two legs</b>. Through its clear coating you can see a <b>zig-zag track</b>. The track is a light-sensitive material, usually <b>cadmium sulfide (CdS)</b>, laid between two metal electrodes (the silver areas). The zig-zag shape makes the track long and narrow so that the area touching the electrodes is large, which makes the sensor more responsive.</p>
     <h3>How it senses light: photoconductivity</h3>
     <ol><li>In the <b>dark</b>, almost all electrons in the cadmium sulfide are held tightly in place. With very few free charge carriers, little current can flow, so resistance is <b>very high</b> (about 1 M\u03a9 or more).</li>
     <li>When <b>light</b> hits the track, each light particle (<b>photon</b>) with enough energy can knock an electron free. Freed electrons (and the \u201choles\u201d they leave behind) can carry current.</li>
     <li><b>More light</b> \u2192 more freed charge carriers \u2192 current flows more easily \u2192 <b>lower resistance</b> (a few k\u03a9 in bright light).</li></ol>
     <p>This effect is called <b>photoconductivity</b>: the material conducts better when light falls on it. Unlike a solar cell, an LDR does not <i>produce</i> electricity; it only changes how easily current passes through it. That is why we put it in a voltage divider (next section) to turn its changing resistance into a voltage the board can read.</p>
     <h3>Key specifications (GL5528, a common 5 mm LDR)</h3>
     <table class="t"><tr><th>Property</th><th>Typical value</th><th>What it means for you</th></tr>
     <tr><td>Resistance at 10 lux (dim room)</td><td>8\u201320 k\u03a9</td><td>That is why we pair it with a 10 k\u03a9 fixed resistor</td></tr>
     <tr><td>Dark resistance</td><td>1 M\u03a9 or more</td><td>Covered by a hand, V<sub>out</sub> drops close to 0 V</td></tr>
     <tr><td>Peak sensitivity</td><td>540 nm (green light)</td><td>Similar to the human eye, so it reacts to visible light</td></tr>
     <tr><td>Response time</td><td>tens of milliseconds</td><td>Fast enough for room light, too slow for very fast flickers</td></tr>
     <tr><td>Gamma (\u03b3)</td><td>about 0.6\u20130.7</td><td>Resistance changes on a <b>logarithmic</b> scale, not a straight line</td></tr>
     <tr><td>Polarity</td><td>none</td><td>Either leg can go either way</td></tr></table>
     <p>Each LDR is slightly different (the datasheet allows 8 to 20 k\u03a9 for the same model), which is another reason we <b>calibrate</b> every sensor.</p>
     <h3>Bare LDR vs. LDR module</h3>
     <div class="two"><div><b>Bare LDR (2 legs)</b><p>What we use. It needs a fixed resistor to form a voltage divider and gives a smooth <b>analog</b> reading of how bright it is.</p></div>
     <div><b>LDR module (3 or 4 pins)</b><p>The LDR on a small board with a comparator chip (often an LM393), a <b>sensitivity knob</b>, and pins labeled <b>VCC</b>, <b>GND</b>, <b>AO</b> (analog out) and/or <b>DO</b> (digital out). DO only says bright or dark, switching at the level set by the knob; on many modules DO goes LOW in bright light. Always check your module's labels.</p></div></div>
     ${tip("Strengths and limits", `<ul><li><b>Strengths:</b> very cheap, simple, robust, and works with any analog pin.</li><li><b>Limits:</b> not precise enough to measure light in exact lux without careful calibration; slow compared with photodiodes; readings drift with temperature.</li><li><b>Environment:</b> cadmium is a toxic heavy metal. Do not break LDRs open, and dispose of them as electronic waste. Some regions restrict CdS parts in new products.</li></ul>`)}
     <p>Explore the inside of the LDR below, then watch the recommended videos.</p>
     <div class="video2"><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/XwJQJnY6iUs" title="Recommended video 1 about LDRs" allowfullscreen loading="lazy"></iframe></div><div class="video"><iframe src="https://www.youtube-nocookie.com/embed/u9Riurh4y9U?start=2" title="Recommended video 2 about LDRs" allowfullscreen loading="lazy"></iframe></div></div>
     <p class="explain">Videos recommended by the course author. If they do not load on your school network, use the written explanation above.</p>
     ${srcs([["GL5528 datasheet", REF.gl5528[1]],["Handson Technology: GL55 series guide", REF.handson[1]],["Electronics Notes: LDR", REF.enotes[1]],["Origin-IC: photoresistor explained", REF.originic[1]]])}`, interactive:"ldrlab"},
    {id:"divider", title:"From light to voltage: the voltage divider", html:`
     <p>As you just saw, the LDR\u2019s resistance is <b>high in the dark</b> and <b>low in bright light</b>. (The values below are rounded examples to keep the math simple.) The board cannot measure resistance, but it can measure <b>voltage</b>. So we connect the LDR in series with a fixed 10 k\u03a9 resistor between 3.3 V and ground. The voltage at the middle point depends on the ratio of the two resistances:</p>
     <div class="formula">V<sub>out</sub> = V<sub>in</sub> \u00d7 R<sub>fixed</sub> \u00f7 (R<sub>LDR</sub> + R<sub>fixed</sub>)</div>
     <p>Think of it as sharing 3.3 V between two resistors: the bigger resistor gets the bigger share. When light hits the LDR, its resistance falls, so the fixed resistor gets a bigger share and V<sub>out</sub> rises.</p>
     ${ex("three light conditions", `<table class="t"><tr><th>Condition</th><th>R<sub>LDR</sub></th><th>Calculation</th><th>V<sub>out</sub></th></tr><tr><td>Dark</td><td>100 k\u03a9</td><td>3.3 \u00d7 10 \u00f7 (100 + 10)</td><td><b>0.30 V</b></td></tr><tr><td>Room light</td><td>10 k\u03a9</td><td>3.3 \u00d7 10 \u00f7 (10 + 10)</td><td><b>1.65 V</b></td></tr><tr><td>Flashlight</td><td>1 k\u03a9</td><td>3.3 \u00d7 10 \u00f7 (1 + 10)</td><td><b>3.00 V</b></td></tr></table><p>Real LDRs vary from part to part, which is one reason we calibrate later.</p>`)}
     <p>Drag the light slider or tap the buttons: watch the current, the voltmeter, and the raw number change.</p>`, interactive:"divider"},
    {id:"adc", title:"From voltage to numbers: the ADC", html:`
     <p>A microcontroller works with numbers, not voltages. Its <b>analog-to-digital converter (ADC)</b> measures the voltage on a pin and turns it into a whole number. The <b>resolution</b>, in bits, decides how many different numbers are possible: an <i>n</i>-bit ADC has 2<sup>n</sup> levels.</p>
     <table class="t"><tr><th>Bits</th><th>Levels (2<sup>n</sup>)</th><th>Range</th><th>Step at 3.3 V</th></tr><tr><td>8</td><td>256</td><td>0\u2013255</td><td>12.9 mV</td></tr><tr><td>10</td><td>1,024</td><td>0\u20131023</td><td>3.2 mV</td></tr><tr><td>12</td><td>4,096</td><td>0\u20134095</td><td>0.8 mV</td></tr></table>
     <div class="formula">raw \u2248 (V<sub>in</sub> \u00f7 V<sub>ref</sub>) \u00d7 max value &nbsp;&nbsp;\u2022&nbsp;&nbsp; V<sub>in</sub> \u2248 (raw \u00f7 max value) \u00d7 V<sub>ref</sub></div>
     <table class="t"><tr><th>Board</th><th>Default range</th><th>Note</th></tr>
     <tr><td>Uno R4 WiFi</td><td>0\u20131023 (10-bit; up to 14-bit)</td><td>5 V reference, so a 3.3 V sensor tops out near (3.3 \u00f7 5) \u00d7 1023 \u2248 675</td></tr>
     <tr><td>ESP32</td><td>0\u20134095 (12-bit)</td><td>Use ADC1 pins such as GPIO 34; ADC2 cannot be read while Wi-Fi runs</td></tr>
     <tr><td>ESP8266</td><td>0\u20131023</td><td>Only one analog pin (A0)</td></tr>
     <tr><td>Pico W</td><td><code>read_u16()</code>: 0\u201365535</td><td>12-bit hardware scaled to 16-bit so code works on any MicroPython board</td></tr></table>
     ${ex("what number will my board show at 1.65 V?", `<p><b>ESP32:</b> (1.65 \u00f7 3.3) \u00d7 4095 \u2248 <b>2048</b> \u2022 <b>Uno R4:</b> (1.65 \u00f7 5) \u00d7 1023 \u2248 <b>338</b> \u2022 <b>Pico W:</b> (1.65 \u00f7 3.3) \u00d7 65535 \u2248 <b>32768</b>.</p><p>Reverse: an ESP32 reads raw = 1024. V \u2248 1024 \u00f7 4095 \u00d7 3.3 \u2248 <b>0.83 V</b>.</p>`)}`, interactive:"adc"},
    {id:"dht", title:"Meet the DHT22: a digital temperature and humidity sensor", html:`
     <p>The <b>DHT22</b> (also sold as the <b>AM2302</b>) measures two things at once: <b>air temperature</b> and <b>relative humidity</b>, the amount of water vapor in the air compared with the most the air could hold at that temperature. It is popular for weather stations, greenhouses, and classroom projects because it comes <b>factory-calibrated</b> and sends finished digital readings, so the board does not need an ADC to read it.</p>
     ${fig(`<div class="photo2"><img src="${IMG.dhtA}" alt="A blue DHT11 sensor next to a larger white DHT22 sensor, both with four pins"><img src="${IMG.dhtB}" alt="Close-up of a blue DHT11 and a white DHT22 showing the grilles that let air reach the sensing elements"></div>`, "Figure 3.3. The blue DHT11 (left) and the white DHT22 (right). Both have four pins and the same pinout. The grille lets air reach the sensing elements inside.", "Photos supplied by the course author.")}
     <h3>DHT22 or DHT11?</h3>
     <p>The two look alike and share the same pins, so you can swap one for the other without rewiring (only one line of code changes). The DHT22 costs more but is more accurate and covers a wider range:</p>
     <table class="t"><tr><th></th><th>DHT11 (blue)</th><th>DHT22 / AM2302 (white)</th></tr>
     <tr><td>Supply voltage</td><td>3 to 5 V</td><td>3 to 5 V</td></tr><tr><td>Current while measuring</td><td>2.5 mA max</td><td>2.5 mA max</td></tr>
     <tr><td>Humidity range / accuracy</td><td>20–80 % / ±5 %</td><td>0–100 % / ±2–5 %</td></tr>
     <tr><td>Temperature range / accuracy</td><td>0–50 °C / ±2 °C</td><td>−40 to 80 °C / ±0.5 °C</td></tr>
     <tr><td>New reading every</td><td>1 s (1 Hz)</td><td>2 s (0.5 Hz)</td></tr><tr><td>Best for</td><td>very low cost</td><td>accuracy (our course)</td></tr></table>
     <h3>How it works inside</h3>
     <p>Remove the white case and you find three parts:</p>
     <ol><li><b>A capacitive humidity element:</b> two metal electrodes with a moisture-absorbing layer between them. When the air is more humid, the layer absorbs more water vapor, which changes its electrical properties and therefore the <b>capacitance</b> between the electrodes. More humidity means a bigger change.</li>
     <li><b>An NTC thermistor:</b> a resistor whose resistance changes strongly with temperature. NTC means <i>negative temperature coefficient</i>: as temperature goes <b>up</b>, resistance goes <b>down</b>.</li>
     <li><b>A tiny chip (ASIC):</b> it measures both elements, applies the factory calibration, converts the results to numbers, and sends them to your board as a digital signal.</li></ol>
     <p>Move the sliders in the explorer below to see each element respond, then press <b>Send a reading</b> to watch the chip transmit it.</p>
     <h3>Pins: bare sensor (4 pins) vs. module (3 pins)</h3>
     <div class="two"><div><b>Bare sensor (4 pins, left to right with the grille facing you)</b><table class="t"><tr><th>Pin</th><th>Name</th><th>What it does</th></tr><tr><td>1</td><td>VCC</td><td>Power: 3.3 V in our course</td></tr><tr><td>2</td><td>DATA</td><td>Sends the digital readings; needs a <b>10 kΩ pull-up</b> resistor to VCC</td></tr><tr><td>3</td><td>NC</td><td>“Not connected”: leave it empty</td></tr><tr><td>4</td><td>GND</td><td>Ground (0 V)</td></tr></table></div>
     <div><b>Module / breakout board (3 pins)</b><table class="t"><tr><th>Label</th><th>What it does</th></tr><tr><td>+ or VCC</td><td>Power: 3.3 V</td></tr><tr><td>OUT, S, or DATA</td><td>Digital readings (the pull-up is already on the board)</td></tr><tr><td>− or GND</td><td>Ground</td></tr></table><p class="explain">The module is the same DHT22 soldered onto a small board that adds the 10 kΩ pull-up resistor, usually a small filter capacitor, and sometimes a power LED. It drops the unused NC pin.</p></div></div>
     ${mis(`<p><b>Pin order on modules is not standard.</b> Some modules are <code>+ OUT −</code>, others <code>− + OUT</code> or <code>OUT + −</code>. Always read the labels printed on <i>your</i> module before wiring. Swapping VCC and GND can destroy the sensor.</p>`)}
     <h3>Why does the DATA pin need a pull-up resistor?</h3>
     <p>The DATA line is shared: sometimes the board talks, sometimes the sensor talks. Each side only ever pulls the line <b>down</b> to LOW; nobody actively drives it HIGH. The <b>pull-up resistor</b> gently connects DATA to VCC so that when nobody is pulling it down, the line rests at HIGH instead of floating at a random voltage. Without it, readings fail or return NaN. Bare sensors need you to add the 10 kΩ resistor between DATA and VCC; modules already include it.</p>
     <h3>Why 3.3 V in this course?</h3>
     <p>The DHT22 works from 3 to 5 V, and its tutorials often use 5 V because it allows longer wires (up to about 20 m). We use <b>3.3 V</b> because the pull-up connects DATA to VCC: at 5 V, the DATA pin would send 5 V into an ESP32, ESP8266, or Pico W pin, which are designed for 3.3 V and can be damaged. At 3.3 V, keep the sensor wires <b>short (within about 1 m)</b>, because long wires at low voltage make readings unreliable.</p>
     <h3>How the reading travels: a 40-bit message</h3>
     <p>The DHT22 uses its own single-wire protocol. The board pulls DATA low for at least 1 ms to say “send me a reading.” The sensor answers and then sends <b>40 bits</b>: 16 bits of humidity, 16 bits of temperature, and an 8-bit <b>checksum</b> that lets the board detect a corrupted message. Each bit is a short HIGH pulse: about 26–28 µs means 0, about 70 µs means 1. The timing is so precise that we let the library do it.</p>
     ${ex("decoding a reading", `<p>Humidity 65.2 % is sent as the whole number <b>652</b> (the value × 10). Temperature 29.4 °C is sent as <b>294</b>. Split into bytes: 652 = 2 × 256 + 140 → bytes <b>2, 140</b>; 294 = 1 × 256 + 38 → bytes <b>1, 38</b>. Checksum = (2 + 140 + 1 + 38) = 181, keeping only the last 8 bits → <b>181</b>. If the board adds the four bytes and gets a different number, it knows the message was corrupted and the library returns NaN.</p>`)}
     ${tip("Good habits with the DHT22", `<ul><li>Read it no faster than once every 2 seconds.</li><li>Keep it away from the board's warm chip and out of direct sun, or it will read high (systematic error, Module 1.4).</li><li>Give it a few seconds after power-up before trusting the first reading.</li><li>Always check for NaN and skip failed readings.</li></ul>`)}
     ${srcs([["Last Minute Engineers: DHT11/DHT22 tutorial", REF.lme[1]],["AM2302 datasheet (Aosong, via Adafruit)", REF.am2302[1]],["Adafruit DHT guide", REF.adafruitDHT[1]]])}`, interactive:"dht"},
    {id:"calib", title:"Calibration: turning raw numbers into meaningful units", html:`
     <p>A raw reading of 330 means little by itself. <b>Calibration</b> links raw readings to a meaningful scale using known reference points. For the LDR we use <b>two-point calibration</b>: measure the raw value in full darkness (call it 0 %) and under a phone flashlight (100 %), then draw a straight line between them.</p>
     ${fig(`<svg class="cal" viewBox="0 0 640 230" role="img" aria-label="Two-point calibration line"><line x1="60" y1="190" x2="620" y2="190" class="ax"/><line x1="60" y1="20" x2="60" y2="190" class="ax"/><line x1="90" y1="190" x2="560" y2="30" class="calline"/><line x1="60" y1="190" x2="90" y2="190" class="clamp"/><line x1="560" y1="30" x2="620" y2="30" class="clamp"/><circle cx="90" cy="190" r="7" fill="#E76F51"/><circle cx="560" cy="30" r="7" fill="#E76F51"/><circle cx="325" cy="110" r="7" fill="#7C3AED"/>
      <text x="70" y="208" font-size="12" fill="currentColor">dark: raw 40 \u2192 0 %</text><text x="420" y="22" font-size="12" fill="currentColor">flashlight: raw 620 \u2192 100 %</text><text x="352" y="134" font-size="12" fill="#7C3AED">raw 330 \u2192 50 %</text><text x="560" y="208" font-size="12" fill="currentColor" text-anchor="end">raw reading \u2192</text><text x="8" y="105" font-size="12" fill="currentColor">%</text></svg>`, "Figure 3.2. Two measured points define the calibration line; values beyond them are clamped to 0\u2013100 %.")}
     <div class="formula">light % = (raw \u2212 dark) \u00f7 (bright \u2212 dark) \u00d7 100, then clamp to 0\u2013100</div>
     ${ex("calibrating step by step", `<ol><li>Dark raw = 40, bright raw = 620, current raw = 330.</li><li>Distance from dark: 330 \u2212 40 = 290.</li><li>Full span: 620 \u2212 40 = 580.</li><li>Fraction: 290 \u00f7 580 = 0.5 \u2192 \u00d7 100 = <b>50 %</b>.</li><li>A raw value of 700 would give 113 %, so we <b>clamp</b> it to 100 %.</li></ol>`)}
     ${code("cpp", "const int DARK_RAW = 40;      // measured with the LDR covered\nconst int BRIGHT_RAW = 620;   // measured under a phone flashlight\nfloat lightPct = (raw - DARK_RAW) * 100.0 / (BRIGHT_RAW - DARK_RAW);\nlightPct = constrain(lightPct, 0, 100);   // keep it between 0 and 100", "Calibration in C++ (Python: max(0, min(100, light)))")}
     <p><b>Three words to keep apart:</b> <b>resolution</b> is the smallest step shown (the DHT22 shows 0.1 \u00b0C); <b>precision</b> is how close repeated readings are; <b>accuracy</b> is how close a reading is to the true value (DHT22: about \u00b10.5 \u00b0C). More decimal places does not mean more accurate.</p>
     
     ${srcs([["Arduino reference", REF.arduinoRef[1]]])}`},
    {id:"breadboard", title:"Breadboarding: building circuits without solder", html:`
     <p>A <b>breadboard</b> lets you build and change circuits quickly by pushing component legs and jumper wires into holes, with no soldering. Inside, rows of metal <b>spring clips</b> connect certain holes together. Knowing which holes are connected is the key to every wiring task in this course.</p>
     <h3>The parts of a breadboard</h3>
     <table class="t"><tr><th>Part</th><th>What it is</th><th>How it is connected</th></tr>
     <tr><td><b>Terminal strips</b></td><td>The main area of holes, with columns numbered (1, 2, 3…) and rows lettered (a–j)</td><td>The 5 holes <b>a–e</b> in one column are connected; the 5 holes <b>f–j</b> in the same column are a separate group</td></tr>
     <tr><td><b>Center channel</b> (ravine)</td><td>The groove down the middle</td><td><b>Nothing</b> crosses it, so the top and bottom halves are separate. Chips (ICs) straddle it so each pin gets its own strip</td></tr>
     <tr><td><b>Power rails</b> (bus strips)</td><td>The long rows along the edges, marked with a red <b>+</b> and blue <b>−</b> line</td><td>Every hole along one rail is connected, so you can bring 3.3 V and GND anywhere on the board</td></tr>
     <tr><td><b>Split rails</b> (on some boards)</td><td>A break in the red/blue line at the middle of long boards</td><td>The left and right halves of the rail are <b>not</b> connected; bridge them with a short wire if needed</td></tr></table>
     <p>Holes are spaced 0.1 inch (2.54 mm) apart, which matches the pins of sensors, chips, and modules.</p>
     <h3>How to use it</h3>
     <ol><li><b>Power first:</b> connect your board's 3.3 V to the red <b>+</b> rail and GND to the blue <b>−</b> rail.</li><li><b>One leg per strip:</b> put each leg of a component in a <i>different</i> column, then connect columns with wires or other parts.</li><li><b>Connect through the column:</b> anything plugged into the same 5-hole column is joined together.</li><li><b>Color-code wires:</b> red for power, black for ground, other colors for signals.</li><li><b>Wire with USB unplugged</b>, have a partner check, then power up.</li></ol>
     ${mis(`<ul><li><b>Both legs in the same column:</b> the legs are connected to each other, so current skips the component (an LED will not light; a resistor does nothing).</li><li><b>Assuming the two halves connect:</b> holes e5 and f5 are on opposite sides of the center channel and are <b>not</b> connected.</li><li><b>Split rails:</b> power on the left half of a rail does not reach the right half on boards with a break in the line.</li><li><b>Loose legs:</b> push components in firmly; a leg resting on top of a clip makes an intermittent connection.</li></ul>`)}
     <p>Explore the breadboard below. Tap any hole to see every hole it is connected to, turn on <b>X-ray</b> to see the metal clips, then test yourself.</p>
     ${srcs([["SparkFun: How to use a breadboard", REF.sparkfunBB[1]]])}`, interactive:"breadboard"},
    {id:"wiring", title:"Guided build: wire the sensors", html:`
     <p>Now use what you know about breadboards. Choose your board, then follow each step. Every wire is drawn for you, with the reason it is needed. <b>Wire only with USB unplugged</b>, and power every sensor from <b>3.3 V</b> (never 5 V on an ESP32, ESP8266, or Pico W pin).</p>`, interactive:"wiring:full"},
    {id:"timing", title:"Timing: why delay() is a trap", html:`
     <p>In Module 1.2, <code>delay(500)</code> paused the board. That was fine for blinking, but a paused board cannot check a button, update an LED, or read another sensor. Professional code uses <b>non-blocking timing</b>: check the clock on every pass through <code>loop()</code> and act only when enough time has passed.</p>
     <p>Think of two cooks. The first stands at the oven for 20 minutes waiting for the cake (<code>delay</code>). The second checks the clock now and then and keeps chopping vegetables in between (<code>millis</code>). Both cakes come out on time, but only the second cook gets anything else done.</p>
     ${anat("The non-blocking timer pattern", [["unsigned long lastRead = 0;", "Remembers WHEN we last acted. <code>unsigned long</code> holds large non-negative numbers, the same type millis() returns."],["const unsigned long INTERVAL_MS = 2000;", "How long to wait between actions: 2000 ms = 2 s (the DHT22's minimum)."],["", ""],["void loop() {", ""],["  unsigned long now = millis();", "<code>millis()</code> = milliseconds since the board started. Reading it takes almost no time; nothing waits."],["  if (now - lastRead >= INTERVAL_MS) {", "Has at least 2000 ms passed since last time? Subtraction stays correct even when millis() wraps to 0 after about 50 days."],["    lastRead = now;", "Restart the timer from now."],["    // read sensors and print", "The timed job runs here, once every 2 s."],["  }", ""],["  // check buttons, update the LED...", "This part runs thousands of times per second, so the board always responds instantly."],["}", ""]])}
     ${ex("tracing the timer", `<table class="t"><tr><th>now (ms)</th><th>lastRead</th><th>now \u2212 lastRead</th><th>\u2265 2000?</th><th>Action</th></tr><tr><td>1500</td><td>0</td><td>1500</td><td>no</td><td>skip, do other tasks</td></tr><tr><td>2001</td><td>0</td><td>2001</td><td>yes</td><td>read; lastRead = 2001</td></tr><tr><td>3000</td><td>2001</td><td>999</td><td>no</td><td>skip</td></tr><tr><td>4002</td><td>2001</td><td>2001</td><td>yes</td><td>read; lastRead = 4002</td></tr></table>`)}`, interactive:"timing"},
    {id:"objects", title:"Reading new code: libraries, objects, and methods", html:`
     <p>P2 uses some new-looking code: <code>#include &lt;DHT.h&gt;</code>, <code>DHT dht(DHT_PIN, DHT22);</code>, and <code>dht.readTemperature()</code>. Here is what these mean.</p>
     <table class="t"><tr><th>Idea</th><th>Meaning</th><th>Example</th></tr>
     <tr><td><b>Library</b></td><td>Ready-made code that someone else wrote and tested, which you add to your program</td><td>C++: <code>#include &lt;DHT.h&gt;</code> \u2022 Python: <code>import dht</code></td></tr>
     <tr><td><b>Object</b></td><td>A variable that represents a real thing (a sensor) and bundles its data and actions</td><td>C++: <code>DHT dht(DHT_PIN, DHT22);</code> \u2022 Python: <code>sensor = dht.DHT22(Pin(15))</code></td></tr>
     <tr><td><b>Method</b></td><td>An action that belongs to an object, called with a <b>dot</b>: <i>object.action()</i></td><td><code>dht.readTemperature()</code> \u2022 <code>sensor.measure()</code> \u2022 <code>led.on()</code></td></tr>
     <tr><td><b>Return value</b></td><td>The answer a method gives back, which you can store in a variable</td><td><code>float t = dht.readTemperature();</code></td></tr></table>
     ${ex("reading dot notation out loud", `<p><code>float t = dht.readTemperature();</code> reads as: <i>\u201cAsk the object named dht to read the temperature, and store the answer in a new decimal variable named t.\u201d</i> You already used this pattern: <code>Serial.println()</code> is the println method of the Serial object, and <code>led.toggle()</code> is the toggle method of the led object.</p>`)}
     ${mis(`<ul><li>Forgetting the parentheses: <code>dht.readTemperature</code> (no <code>()</code>) does not call the method.</li><li>Calling a method before creating the object, or before <code>dht.begin()</code>.</li><li>Python: forgetting <code>sensor.measure()</code> before <code>sensor.temperature()</code>; the values are only updated by measure().</li></ul>`)}
     ${srcs([["Adafruit DHT guide", REF.adafruitDHT[1]],["MicroPython quick reference (RP2)", REF.micropython[1]]])}`, interactive:"drill:objects"},
    {id:"p2", title:"Program P2: read and print CSV", html:`
     <p>P2 combines everything: a library, the non-blocking timer, error checking, and CSV output (comma-separated values that a spreadsheet can read). Read the annotated version, then practice in the sandbox.</p>
     ${anat("P2 Sensor reader (Arduino C++, ESP32 pins shown)", [
      ["#include <DHT.h>", "Brings in the DHT library so we can use the DHT type and its functions."],
      ["const int LDR_PIN = 34;   // Uno R4/ESP8266: A0", "Analog pin for the LDR. GPIO 34 is an ADC1 pin on the ESP32."],
      ["const int DHT_PIN = 4;    // Uno R4: 2, ESP8266: 14", "Data pin for the DHT22."],
      ["const float ADC_MAX = 4095.0;  // 1023.0 on Uno R4/ESP8266", "Largest raw value of your board's ADC. It is a float, so later division keeps decimals."],
      ["DHT dht(DHT_PIN, DHT22);", "Creates an <b>object</b> named dht: parameter 1 = data pin, parameter 2 = sensor model."],
      ["const unsigned long INTERVAL_MS = 2000;", "Read every 2 s."],
      ["unsigned long lastRead = 0;", ""],
      ["", ""],
      ["void setup() {", ""],
      ["  Serial.begin(115200);", ""],
      ["  dht.begin();", "Prepares the sensor. Must run once before reading."],
      ["  Serial.println(\"ms,temp_C,hum_pct,light_pct\");", "The CSV <b>header</b>: column names with units, printed once."],
      ["}", ""],
      ["", ""],
      ["void loop() {", ""],
      ["  unsigned long now = millis();", ""],
      ["  if (now - lastRead >= INTERVAL_MS) {", "The non-blocking timer from the previous section."],
      ["    lastRead = now;", ""],
      ["    float t = dht.readTemperature();", "Temperature in \u00b0C, or NaN if the read failed."],
      ["    float h = dht.readHumidity();", "Relative humidity in %."],
      ["    int raw = analogRead(LDR_PIN);", "Raw ADC number from 0 to ADC_MAX."],
      ["    float lightPct = raw / ADC_MAX * 100.0;", "Scale to 0\u2013100 %. (Replace with your calibration formula for the Extension.)"],
      ["    if (isnan(t) || isnan(h)) {", "<code>isnan()</code> = is it Not-a-Number? <code>||</code> means OR."],
      ["      Serial.println(\"# DHT read failed\");", "Lines starting with # are notes, easy to filter out later."],
      ["      return;", "Leave loop() early, so bad data is never printed."],
      ["    }", ""],
      ["    Serial.print(now); Serial.print(',');", "One CSV row: values separated by commas."],
      ["    Serial.print(t, 1); Serial.print(',');", "The second parameter, 1, = one decimal place."],
      ["    Serial.print(h, 1); Serial.print(',');", ""],
      ["    Serial.println(lightPct, 1);", "The last value uses println to end the row."],
      ["  }", ""],
      ["}", ""]])}
     ${serialMock(["ms,temp_C,hum_pct,light_pct","2001,29.4,70.8,52.3","4002,29.4,70.9,52.1","6003,29.5,70.8,12.4","8004,29.5,70.9,11.6","# DHT read failed","12006,29.6,71.0,95.7"], "Expected Serial Monitor output (the hand covers the LDR at 6 s)")}
     <p>The MicroPython version uses the same logic with <code>time.ticks_ms()</code>, <code>time.ticks_diff()</code>, and <code>try / except OSError</code> for failed readings.</p>
     <h3>Practice in the sandbox</h3>
     <p><b>Challenge 1:</b> print the CSV header and a row every 2 s. <b>Challenge 2 (Boss):</b> turn the LED on whenever light drops below 30 %, without any <code>delay()</code> over 1 s. The sandbox covers the light sensor with a "hand" from 4 to 7 s and shines a flashlight from 11 to 13 s.</p>`, interactive:"sandbox:sb_csv,sb_alarm"},
    {id:"csvuse", title:"Using your CSV output: save it for Module 1.4", html:`
     <p>When P2 runs on your board, the Serial Monitor (Arduino IDE) or Shell (Thonny) fills with CSV rows. This data is valuable: in <b>Module 1.4</b> you will analyze it in Google Sheets. So the question is: <b>how do we get it from the screen into a spreadsheet?</b></p>
     <div class="callout mis"><b>Do not type the numbers by hand</b><p>Ten minutes of readings every 2 s is about <b>300 rows × 4 values = 1,200 numbers</b>. Typing them would take hours and introduce mistakes. Instead you will <b>copy and paste</b> the whole output at once. In Unit 2 this step disappears completely: the board will send each reading straight to Google Sheets over Wi-Fi.</p></div>
     ${fig(`<svg class="dataflow" viewBox="0 0 640 140" role="img" aria-label="Where your data goes"><defs><marker id="ahd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#5B6B7F"/></marker></defs>${[["Module 1.3","Board prints CSV","#2A9D8F"],["You copy","Serial Monitor → copy","#5B6B7F"],["Module 1.4","Paste into Sheets","#C9A227"],["Unit 2","Sends to Sheets itself","#1F3A5F"]].map((b,i)=>`<rect x="${10+i*158}" y="30" width="140" height="64" rx="10" fill="${b[2]}"/><text x="${80+i*158}" y="56" text-anchor="middle" fill="#fff" font-weight="700" font-size="13">${b[0]}</text><text x="${80+i*158}" y="76" text-anchor="middle" fill="#fff" font-size="10">${b[1]}</text>${i<3?`<path d="M${152+i*158} 62 H${166+i*158}" stroke="#5B6B7F" stroke-width="2.5" marker-end="url(#ahd)"/>`:""}`).join("")}<text x="320" y="122" text-anchor="middle" font-size="11" fill="currentColor">Copying by hand is only needed in Unit 1. From Unit 2, logging is automatic.</text></svg>`, "Figure 3.4. Where your sensor data goes next.")}
     <h3>Before you start: plan a 10-minute recording</h3>
     <p>Your chart in Module 1.4 will be more interesting if something <b>happens</b> during the recording. Make three planned “events” and write down <b>when</b> you did each one, because you will label them on your chart later:</p>
     <table class="t"><tr><th>Event</th><th>What to do</th><th>Time (from the first row's ms ÷ 1000)</th></tr><tr><td>1</td><td>Cover the LDR with your hand for 20 s</td><td>about ___ s</td></tr><tr><td>2</td><td>Shine a phone flashlight on the LDR for 20 s</td><td>about ___ s</td></tr><tr><td>3</td><td>Breathe gently on the DHT22 for 5 s</td><td>about ___ s</td></tr></table>
     <h3>Option A: Arduino IDE 2 (Uno R4 WiFi, ESP32, ESP8266)</h3>
     <ol><li>Upload P2, then open <b>Tools → Serial Monitor</b> and set the speed (bottom-right) to <b>115200 baud</b>. If you see strange symbols, the speed is wrong.</li>
     <li>Press the board's <b>reset</b> button once so the output starts with the header line <code>ms,temp_C,hum_pct,light_pct</code>.</li>
     <li>Let it run for about <b>10 minutes</b> (about 300 rows) while you do your three events.</li>
     <li>Click inside the output area, press <b>Ctrl + A</b> (Mac: <b>Cmd + A</b>) to select everything, then <b>Ctrl + C</b> (Mac: <b>Cmd + C</b>) to copy. If select-all does not work, click at the start of the header and drag down to the last row.</li>
     <li>Copy right after your session ends. If the output is very long, the monitor may not keep every line from the start, so check that the header and first rows are included.</li></ol>
     <h3>Option B: Thonny (Pico W)</h3>
     <ol><li>Press <b>Run</b>. The CSV rows appear in the <b>Shell</b> at the bottom.</li><li>Record for about 10 minutes with your three events, then press <b>Stop</b>.</li><li>Click in the Shell, select from the header line to the last row (drag, or Ctrl/Cmd + A), and copy with <b>Ctrl/Cmd + C</b>.</li></ol>
     <h3>Option C: no hardware (sandbox)</h3>
     <p>Run the <b>CSV logger</b> challenge in the sandbox above. When it passes, press <b>Copy output</b>, or <b>Download as .csv</b> to save a file. It is a short practice dataset (6 rows), so use the sample dataset in Module 1.4 for the full analysis.</p>
     <h3>Save your data (do this right away)</h3>
     <ol><li>Open <b>Google Sheets</b> (sheets.google.com) and create a blank spreadsheet in your course folder in Google Drive.</li><li>Name it clearly, for example <code>Team3_ESP32_P2_2026-10-05</code> (team, board, program, date).</li><li>Click cell <b>A1</b> and paste with <b>Ctrl/Cmd + V</b>. Each line lands in its own row, all in column A. That is expected: you will split it into columns in Module 1.4.</li><li>Also paste your event times into a cell to the right (e.g., H1) so you do not lose them.</li></ol>
     <div class="callout tip"><b>Optional backup: a real .csv file</b><p>Paste the same text into Notepad (Windows) or TextEdit in plain-text mode (Mac), and save it as <code>Team3_P2_log.csv</code>. A .csv file opens in Google Sheets (<b>File → Import</b>), Excel, and Python, which you will use in Python Lab A.</p></div>
     <h3>Check before you leave</h3>
     <ul class="checklist"><li>☐ The first row is the header <code>ms,temp_C,hum_pct,light_pct</code>.</li><li>☐ There are roughly 300 data rows (10 minutes at one row per 2 s).</li><li>☐ Lines starting with <code>#</code> (failed readings) may appear; that is fine, you will remove them in Module 1.4.</li><li>☐ If the board was reset during recording, a second header may appear in the middle; note where.</li><li>☐ Your event times are written down.</li><li>☐ The Sheet is saved in your course Drive folder with a clear name.</li></ul>
     ${mis(`<p><b>Pasting into Excel or Sheets and getting one long line:</b> you probably copied from a place that removed line breaks. Copy directly from the Serial Monitor or Shell. <b>Garbled characters:</b> the baud rate is not 115200. <b>Only the last few hundred rows:</b> copy sooner, or shorten the recording.</p>`)}`},
    {id:"aiverify", title:"AI activity: AI explains, you verify", html:`
     <p>AI can explain code quickly, but it can also produce fluent explanations that are wrong. In this activity AI is your assistant and <b>you</b> are the fact-checker.</p>
     <h3>Step 1: write a PARTS prompt</h3>
     <table class="t"><tr><th>Element</th><th>Meaning</th><th>Example</th></tr><tr><td><b>P</b>ersona</td><td>The role the AI takes</td><td>You are an embedded systems instructor who teaches beginners.</td></tr><tr><td><b>A</b>ct</td><td>The task, with an action verb</td><td>Explain, line by line, what the P2 sketch does.</td></tr><tr><td><b>R</b>ecipient</td><td>Who the answer is for</td><td>A learner who knows loops but not millis().</td></tr><tr><td><b>T</b>heme</td><td>Topic and context</td><td>Reading a DHT22 and LDR every 2 s without delay().</td></tr><tr><td><b>S</b>tructure</td><td>Output format</td><td>A table (line, code, meaning), then 3 quiz questions.</td></tr></table>
     <p>Add a <b>Chain-of-Thought</b> instruction, "Think step by step and explain why the timer works before the table," so the AI shows its reasoning and you can check each step.</p>
     <h3>Step 2: verify at least 5 claims</h3><p>Check each claim against the annotated P2 above or official documentation, then record it below. Sensi (bottom-right) can be your AI here, or another approved tool.</p>
     ${srcs([["Wei et al., 2022 (Chain-of-Thought)", REF.wei[1]],["Arduino reference", REF.arduinoRef[1]],["MicroPython RP2", REF.micropython[1]]])}`, interactive:"aiverify"}
   ],
   quiz:[
    {q:"Which sensor gives an analog signal?", o:["DHT22","LDR in a voltage divider","Both","Neither"], a:1, e:"The LDR divider produces a smoothly varying voltage; the DHT22 sends digital pulses.", w:["The DHT22 has its own chip and sends digital pulses, even though it measures a smoothly varying quantity.","","Only the LDR is analog.","The LDR divider is analog."]},
    {q:"In our wiring, brighter light makes V out\u2026", o:["Lower","Higher","Unchanged","Negative"], a:1, e:"The LDR's resistance falls, so the fixed resistor gets a bigger share of the 3.3 V.", w:["That would be true if the LDR and resistor were swapped, but not in our wiring.","","V out depends on the LDR's resistance, which changes with light.","The divider only shares 3.3 V between 0 and 3.3 V; it can never go negative."]},
    {q:"How many values can a 12-bit ADC produce?", o:["1024","2048","4096","65536"], a:2, e:"2^12 = 4096 values (0 to 4095).", w:["1024 = 2^10, a 10-bit ADC.","2048 = 2^11.","","65536 = 2^16, the range of read_u16() on the Pico W."]},
    {q:"Dark raw 100, bright raw 900, raw 500. Calibrated light %?", o:["25%","50%","55.6%","62.5%"], a:1, e:"(500 \u2212 100) \u00f7 (900 \u2212 100) \u00d7 100 = 400 \u00f7 800 \u00d7 100 = 50 %.", w:["25 % would be raw 300.","","55.6 % = 500 \u00f7 900: you forgot to subtract the dark value.","62.5 % = 500 \u00f7 800: you subtracted the dark value only from the bottom."]},
    {q:"Why does P2 use if (now - lastRead >= INTERVAL_MS) instead of delay(2000)?", o:["It is shorter","The board stays free to do other tasks","delay() does not exist on ESP32","It makes readings more accurate"], a:1, e:"Non-blocking timing keeps the board responsive between readings.", w:["It is actually longer to write; the benefit is responsiveness.","","delay() works on every board; it just freezes the program.","Timing does not change the sensor's accuracy."]},
    {q:"You are wiring a bare 4-pin DHT22 (not a module). What must you add?", o:["A 220 \u03a9 resistor on GND","A 10 k\u03a9 pull-up resistor between DATA and VCC","A wire to the NC pin","Nothing; it works as is"], a:1, e:"The DATA line is only ever pulled LOW by the board or sensor; the 10 k\u03a9 pull-up keeps it HIGH when idle. Modules include it already.", w:["220 \u03a9 limits LED current; it is not used with the DHT22.","","NC means not connected: leave it empty.","Without a pull-up the DATA line floats and readings fail. Only modules can skip it, because the resistor is on the board."]},
    {q:"On a standard breadboard, which two holes are connected?", o:["e5 and f5","a5 and e5","c5 and c6","a5 and j5"], a:1, e:"Holes a\u2013e in the same column share one metal clip.", w:["e5 and f5 are on opposite sides of the center channel, which nothing crosses.","","c5 and c6 are in different columns, so they are separate strips.","a5 is in the top half and j5 in the bottom half; the center channel separates them."]}
   ],
   rating:["I can upload P2 and see readings, but cannot yet explain them.","I can explain the divider or the ADC and do the Core challenge with help.","I can explain light \u2192 % fully, do the Core alone, and justify millis().","I can complete the Boss Challenge and help a classmate debug."],
   checkpoint:{code:"U1-O3, U1-O4, U1-O7", task:"Show calibrated P2 output, complete the Boss Challenge (LED below 30% without delay()), and complete the AI verification table.", met:"5+ valid CSV rows; no delay() over 1 s; 5 AI claims checked with sources.", upload:"Upload a screenshot of your Serial Monitor output, your code, and your AI verification table."},
   refs:["gl5528","handson","enotes","originic","ytLdr1","ytLdr2","lme","am2302","adafruitDHT","sparkfunBB","horowitz","arduinoRef","espArduino","micropython","wei","wokwi"]
  },
  {id:"1.4", title:"Your first dataset in Google Sheets", minutes:120,
   objectives:["Describe a dataset using observation, variable, and value.","Classify variables by level of measurement (U1-O5).","Identify sources of measurement error and distinguish accuracy from precision (U1-O5).","Import sensor data into Google Sheets and summarize it with formulas and a chart.","Calculate the data volume of a sampling plan (U1-O6)."],
   sections:[
    {id:"anatomy", title:"The anatomy of a dataset", html:`
     <p>P2 prints <b>CSV</b>: each line is one record, and commas separate the values. The first line is the <b>header</b> with the column names. This simple format, described in RFC 4180, can be read by Google Sheets, Excel, Python, and almost every data tool.</p>
     ${fig(`<div class="csvflow"><pre class="serial static">ms,temp_C,hum_pct,light_pct\n2001,29.4,70.8,52.3\n4002,29.4,70.9,52.1</pre><span class="arrowbig">\u2192</span>${sheet({headers:["ms","temp_C","hum_pct","light_pct"], rows:[[2001,29.4,70.8,52.3],[4002,29.4,70.9,52.1]], sel:"B2", formula:"29.4"})}</div>`, "Figure 4.1. Each CSV line becomes a row; each comma marks a new column.")}
     <h3>Three words for every dataset</h3>
     <ul><li>An <b>observation</b> is one record: one <b>row</b> (all readings taken at 2001 ms).</li><li>A <b>variable</b> is one thing measured: one <b>column</b> (temp_C).</li><li>A <b>value</b> is one cell: one variable for one observation (29.4).</li></ul>
     <p>A dataset arranged this way is called <b>tidy</b>: each variable is a column, each observation is a row, and each value has its own cell. Tidy data is easy to sort, filter, chart, and analyze.</p>
     ${ex("tidy vs messy", `<div class="two"><div><b>Messy</b>${sheet({headers:["reading","info"], rows:[["1","29.4C / 70.8%"],["2","29.4C / 70.9%"]]})}<p class="explain">Two variables crammed into one cell, units mixed with numbers: you cannot average temperature.</p></div><div><b>Tidy</b>${sheet({headers:["ms","temp_C","hum_pct"], rows:[[2001,29.4,70.8],[4002,29.4,70.9]]})}<p class="explain">One variable per column, units in the column name, numbers only in cells.</p></div></div>`)}
     ${srcs([["RFC 4180 (CSV)", REF.rfc4180[1]],["Wickham, 2014 (tidy data)", REF.wickham[1]]])}`},
    {id:"levels", title:"Levels of measurement", html:`
     <p>Not all numbers behave the same. The <b>level of measurement</b> tells you which calculations make sense.</p>
     <table class="t"><tr><th>Level</th><th>What it is</th><th>Example</th><th>Makes sense</th><th>Does NOT make sense</th></tr>
     <tr><td>Nominal</td><td>Labels, no order</td><td>device_id, sensor name</td><td>count, most common</td><td>average, ordering</td></tr>
     <tr><td>Ordinal</td><td>Labels with an order</td><td>Dark &lt; Dim &lt; Bright</td><td>order, median</td><td>\u201cBright \u2212 Dim\u201d as a number</td></tr>
     <tr><td>Interval</td><td>Equal gaps, no true zero</td><td>temperature in \u00b0C</td><td>differences, average</td><td>ratios (30 \u00b0C is not \u201ctwice as hot\u201d as 15 \u00b0C)</td></tr>
     <tr><td>Ratio</td><td>Equal gaps and a true zero</td><td>seconds, humidity %, light %</td><td>everything, including ratios</td><td>\u2014</td></tr></table>
     ${ex("why 0 \u00b0C is not \u201cno heat\u201d", `<p>0 \u00b0C is just the freezing point of water, not the absence of heat, so Celsius has no <i>true</i> zero. That is why you can say \u201c30 \u00b0C is 15 degrees warmer than 15 \u00b0C\u201d (a difference) but not \u201ctwice as hot\u201d (a ratio). Time is different: 0 seconds really means no time, so 60 s <i>is</i> twice 30 s.</p>`)}`, interactive:"levels"},
    {id:"error", title:"Accuracy, precision, and error", html:`
     <p>No sensor is perfect. Every reading = <b>true value + error</b>. There are two kinds of error:</p>
     <ul><li><b>Systematic error (bias)</b> pushes readings consistently one way. Example: a DHT22 placed next to the warm board always reads about 1 \u00b0C high.</li><li><b>Random error</b> scatters readings unpredictably. Example: electrical noise makes the LDR jump by a few counts.</li></ul>
     ${fig(`<svg class="targets" viewBox="0 0 640 200" role="img" aria-label="Trueness, precision, and accuracy targets">${[["Accurate","(true and precise)",[[0,0],[4,-3],[-3,4],[2,3]]],["Precise, but biased","(not true \u2192 not accurate)",[[34,-30],[38,-27],[31,-26],[36,-33]]],["True on average,","but not precise",[[-26,18],[24,-20],[-18,-24],[22,22]]],["Neither true","nor precise",[[30,24],[-10,34],[40,-6],[18,40]]]].map((t,i)=>`<g transform="translate(${80+i*160},82)">${[50,34,18].map((r,k)=>`<circle r="${r}" fill="${k%2?'#fff':'#E2E8F0'}" stroke="#94A3B8"/>`).join("")}<circle r="5" fill="#1F3A5F"/>${t[2].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="#E76F51"/>`).join("")}<text y="76" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${t[0]}</text><text y="92" text-anchor="middle" font-size="11" fill="currentColor">${t[1]}</text></g>`).join("")}</svg>`, "Figure 4.2. The center is the true value; each dot is one repeated reading. Trueness = the average lands on the center. Precision = the dots are close together. Accuracy needs both.", "Based on the definitions in ISO 5725-1:2023 and JCGM 200:2012.")}
     <p>The international standards for measurement use three related words:</p>
     <table class="t"><tr><th>Term</th><th>Meaning</th><th>Linked to</th></tr><tr><td><b>Trueness</b></td><td>How close the <i>average</i> of many readings is to the true value</td><td>Systematic error (bias)</td></tr><tr><td><b>Precision</b></td><td>How close repeated readings are to <i>each other</i></td><td>Random error</td></tr><tr><td><b>Accuracy</b></td><td>How close a reading is to the true value; it needs <b>both</b> good trueness and good precision</td><td>Both kinds of error</td></tr></table>
     <p>So a sensor can be precise but biased (second target): its readings agree with each other but are all shifted, so it is not accurate. A sensor whose readings scatter around the true value (third target) is true on average, but any single reading may be far off, so it is not accurate either. In everyday speech people often say "accurate" when they mean "true on average," which is why the standards use the separate word <i>trueness</i>.</p>
     ${tryit(`<p><b>Side-by-side test:</b> place your DHT22 next to another team's for 5 minutes, away from sun and boards. Compare averages. If they differ by more than 1 \u00b0C (about twice the \u00b10.5 \u00b0C accuracy), record the offset and look for a cause such as heat from the board.</p>`)}
     ${srcs([["ISO 5725-1:2023", REF.iso5725[1]],["JCGM 200:2012 (VIM)", REF.jcgm[1]]])}`},
    {id:"volume", title:"How much data? Sampling and volume", html:`
     <p>The <b>sampling interval</b> is how often you take a reading. Shorter intervals capture fast changes but create much more data.</p>
     <div class="formula">rows per day = readings per send \u00d7 (86,400 \u00f7 interval in seconds)</div>
     <p>Why 86,400? There are 24 \u00d7 60 \u00d7 60 = 86,400 seconds in a day.</p>
     ${ex("a classroom plan", `<p>One device sends 3 readings (temp, humidity, light) every 30 s. Sends per day = 86,400 \u00f7 30 = 2,880. Rows per day = 3 \u00d7 2,880 = <b>8,640</b>. With 5 columns per row, that is 43,200 cells per day. A Google Sheet holds up to 10 million cells, so one device fills it in about 10,000,000 \u00f7 43,200 \u2248 <b>231 days</b>. Ten devices: about 23 days.</p>`)}
     ${mis(`<p>Choosing \u201cas fast as possible.\u201d Temperature in a room changes over minutes, so readings every second mostly repeat the same value, fill the Sheet quickly, and overload Apps Script when a whole class logs at once. Match the interval to how fast the thing you measure changes.</p>`)}
     ${srcs([["Google Drive file limits", REF.sheetsLimits[1]]])}`, interactive:"volume"},
    {id:"sheets", title:"Guided build: from Serial Monitor to Google Sheets", html:`
     <h3>Step 1: open the data you saved in Module 1.3</h3><p>Open the Google Sheet you created in Module 1.3, section “Using your CSV output” (for example <code>Team3_ESP32_P2_2026-10-05</code>). Your pasted output should be in column A, starting at A1. <b>No data yet?</b> Follow that section first to record 10 minutes of P2 output, or use the sample dataset at the end of this module.</p>
     ${sheet({headers:["ms,temp_C,hum_pct,light_pct"], rows:[["2001,29.4,70.8,52.3"],["4002,29.4,70.9,52.1"],["# DHT read failed"],["6003,29.5,70.8,12.4"]], sel:"A1", formula:"ms,temp_C,hum_pct,light_pct", note:"Right after pasting: each line sits in one cell of column A."})}
     <h3>Step 2: split into columns</h3><p>Select column A, then choose <b>Data \u2192 Split text to columns</b>. Google Sheets detects the commas and moves each value into its own column. Then delete any row that starts with <code>#</code> (failed readings).</p>
     ${sheet({headers:["ms","temp_C","hum_pct","light_pct"], rows:[[2001,29.4,70.8,52.3],[4002,29.4,70.9,52.1],[6003,29.5,70.8,12.4]], note:"After splitting and deleting the # row: tidy data."})}
     <h3>Step 3: understand formula syntax</h3>
     <p>Every formula starts with <code>=</code>. Then comes a <b>function</b> name, and in parentheses its <b>arguments</b>, usually a <b>range</b> of cells.</p>
     <div class="fanat"><span class="f-eq">=</span><span class="f-fn">AVERAGE</span><span class="f-p">(</span><span class="f-rg">B2:B15</span><span class="f-p">)</span></div>
     <table class="t"><tr><td><code>=</code></td><td>Tells Sheets \u201cthis is a formula, calculate it.\u201d</td></tr><tr><td><code>AVERAGE</code></td><td>The function: what to calculate.</td></tr><tr><td><code>B2:B15</code></td><td>The range: cells B2 through B15 (the colon means \u201cthrough\u201d). <code>B2:B</code> means B2 to the bottom of column B.</td></tr></table>
     <h3>Step 4: add time in seconds</h3><p>In E1 type <code>time_s</code>. In E2 type <code>=A2/1000</code> (milliseconds \u00f7 1000 = seconds), then drag the small square at the cell's corner down to copy the formula. Sheets adjusts it automatically: E3 becomes <code>=A3/1000</code>.</p>
     ${sheet({headers:["ms","temp_C","hum_pct","light_pct","time_s"], rows:[[2001,29.4,70.8,52.3,2.001],[4002,29.4,70.9,52.1,4.002],[6003,29.5,70.8,12.4,6.003]], sel:"E2", formula:"=A2/1000"})}
     <h3>Step 5: summarize</h3>
     <table class="t"><tr><th>Formula</th><th>What it does</th><th>Result with the sample data</th></tr>
     <tr><td><code>=COUNT(B2:B)</code></td><td>Counts cells that contain numbers</td><td>14 readings</td></tr>
     <tr><td><code>=MAX(B2:B)</code> / <code>=MIN(B2:B)</code></td><td>Highest / lowest value</td><td>30.2 / 29.4 \u00b0C</td></tr>
     <tr><td><code>=AVERAGE(B2:B)</code></td><td>Sum \u00f7 count</td><td>29.67 \u00b0C</td></tr>
     <tr><td><code>=IF(D2&gt;50,"Bright","Dark")</code></td><td>Tests a condition: if D2 &gt; 50 show \u201cBright\u201d, otherwise \u201cDark\u201d</td><td>a label per row</td></tr>
     <tr><td><code>=COUNTIF(F2:F,"Bright")</code></td><td>Counts cells that match a condition</td><td>11 bright, 3 dark</td></tr></table>
     ${sheet({headers:["ms","temp_C","hum_pct","light_pct","time_s","label"], rows:[[2001,29.4,70.8,52.3,2.001,"Bright"],[8004,29.5,70.9,12.4,8.004,"Dark"],["","","","","MAX temp",30.2],["","","","","AVG temp",29.67]], sel:"F2", formula:"=IF(D2>50,\"Bright\",\"Dark\")", note:"The IF formula in F2 labels each row; summary formulas sit below the data."})}
     ${mis(`<p><b>Typing results by hand</b> instead of formulas: if the data changes, hand-typed results are wrong. <b>Text that looks like numbers</b>: if a value is left-aligned, Sheets is treating it as text and AVERAGE will skip it. <b>Missing quotes</b>: text inside a formula needs double quotes, e.g., <code>"Bright"</code>.</p>`)}
     <h3>Step 6: chart it</h3><p>Select columns E (time_s) and D (light_pct), choose <b>Insert \u2192 Chart</b>, and pick a <b>line chart</b>. Give it a title and axis labels with units. Then write two sentences about the chart that each include a number, for example: \u201cLight dropped from 52 % to 12 % when the LDR was covered at 6 s.\u201d</p>
     <p>Check your formulas against the sample dataset:</p>
     ${srcs([["Google Sheets function list", REF.sheetsFn[1]]])}`, interactive:"sample"}
   ],
   quiz:[
    {q:"In a tidy dataset, a row is one\u2026", o:["Variable","Observation","Unit","Formula"], a:1, e:"Each row is one observation (one record); each column is a variable.", w:["Variables are columns, not rows.","","Units belong in column names, e.g., temp_C.","Formulas calculate values; they are not part of the dataset's structure."]},
    {q:"Temperature in \u00b0C is which level of measurement?", o:["Nominal","Ordinal","Interval","Ratio"], a:2, e:"Equal gaps between degrees but no true zero (0 \u00b0C is not \u201cno heat\u201d).", w:["Nominal values are labels without order, like device IDs.","Ordinal values are ordered labels without equal gaps, like Dark/Dim/Bright.","","Ratio needs a true zero; 0 \u00b0C is just water's freezing point, so ratios like \u201ctwice as hot\u201d do not work."]},
    {q:"A sensor next to a warm board always reads 1.2 \u00b0C high. This is\u2026", o:["Random error affecting precision","Systematic error affecting accuracy","No error","A logic error"], a:1, e:"A consistent one-direction error is bias (systematic error). It lowers trueness, so the readings are not accurate even if they are precise.", w:["Random error would scatter readings both up and down, not always 1.2 \u00b0C high.","","A consistent 1.2 \u00b0C difference from the true value is an error.","A logic error is a programming mistake; this is a measurement problem caused by placement."]},
    {q:"3 readings every 10 seconds produce how many rows per day?", o:["8,640","25,920","86,400","259,200"], a:1, e:"3 \u00d7 (86,400 \u00f7 10) = 3 \u00d7 8,640 = 25,920.", w:["8,640 is the number of sends per day; you forgot to multiply by 3 readings.","","86,400 is the number of seconds in a day.","259,200 = 3 \u00d7 86,400: you used 1-second intervals."]},
    {q:"Which formula counts cells in F2:F that say Bright?", o:["=COUNT(F2:F)","=SUM(F2:F,\"Bright\")","=COUNTIF(F2:F,\"Bright\")","=IF(F2:F=\"Bright\")"], a:2, e:"COUNTIF counts cells that match a condition.", w:["COUNT only counts cells containing numbers; text labels are ignored.","SUM adds numbers; it cannot count text matches.","","IF tests one condition and returns a value; it needs both a true and false result and does not count."]}

const TEST_ITEMS = [{"n": 1, "q": "A sketch uses `delay(2000)` inside `loop()` between sensor readings. What is the main problem?", "o": ["It uses too much memory.", "It works only on ESP32 boards.", "The board cannot do anything else during the 2-second wait.", "It makes each reading less accurate."], "part": "Physical computing", "c": "C1"}, {"n": 2, "q": "The ESP32's analog-to-digital converter is 12-bit. What is the largest raw value `analogRead()` can return?", "o": ["255", "1023", "65535", "4095"], "part": "Physical computing", "c": "C1"}, {"n": 3, "q": "An LDR on an Uno R4 WiFi gives a raw reading of 512 (10-bit, maximum 1023). Using raw ÷ 1023 × 100, the light level is about:", "o": ["50%", "25%", "51.2%", "100%"], "part": "Physical computing", "c": "C1"}, {"n": 4, "q": "This code runs inside `loop()`, which repeats about every 1 ms: `if (now - lastRead >= 2000) { lastRead = now; readSensor(); }`. How often is `readSensor()` called?", "o": ["Every 1 ms", "About every 2 seconds", "Only once", "Never"], "part": "Physical computing", "c": "C1"}, {"n": 5, "q": "Why does the course connect the ESP32's light sensor to GPIO 34 instead of an ADC2 pin?", "o": ["ADC2 pins are output-only.", "GPIO 34 has a higher resolution.", "ADC2 pins cannot be read while Wi-Fi is running.", "ADC2 pins use 5 V."], "part": "Physical computing", "c": "C1"}, {"n": 6, "q": "`dht.readTemperature()` returns `NaN`. What should the program do?", "o": ["Send 0 °C to the cloud.", "Restart the Wi-Fi connection.", "Reuse yesterday's value.", "Skip logging this reading and report the error."], "part": "Physical computing", "c": "C1"}, {"n": 7, "q": "In `.../exec?key=abc&device_id=team1&temp_C=29.4`, what does the part after `?` do?", "o": ["Passes named values to the server.", "Encrypts the data.", "Names the Wi-Fi network.", "Sets the serial baud rate."], "part": "IoT connectivity", "c": "C2"}, {"n": 8, "q": "A device receives the reply `ERR:key` from the Apps Script logger. What is the most likely cause?", "o": ["The Wi-Fi password is wrong.", "The DHT22 is disconnected.", "The API key in the device code does not match the key stored in the script.", "The Sheet is full."], "part": "IoT connectivity", "c": "C2"}, {"n": 9, "q": "After editing the Apps Script code, the device still gets the old behavior. Why?", "o": ["The Sheet needs refreshing.", "The deployment still points to the old version of the code.", "The device must use a new URL after every edit.", "The browser cache is full."], "part": "IoT connectivity", "c": "C2"}, {"n": 10, "q": "What does an HTTP status code of 302 mean?", "o": ["Success", "Unauthorized", "Server error", "The response is at another address (redirect)."], "part": "IoT connectivity", "c": "C2"}, {"n": 11, "q": "Why does the course add the timestamp on the server instead of on the device?", "o": ["The boards have no reliable clock, so server time makes all readings comparable.", "Timestamps make requests faster.", "Devices are not allowed to send dates.", "Google Sheets cannot store device times."], "part": "IoT connectivity", "c": "C2"}, {"n": 12, "q": "Which statement best describes the bronze (raw) layer of the course pipeline?", "o": ["It holds only hourly averages.", "It is deleted after each pipeline run.", "It keeps every reading exactly as received and is never edited by hand.", "It contains only rows that passed quality checks."], "part": "Data engineering", "c": "C3"}, {"n": 13, "q": "A device sends 3 readings every 30 seconds. How many rows does it add per day?", "o": ["2,880", "8,640", "86,400", "1,440"], "part": "Data engineering", "c": "C3"}, {"n": 14, "q": "The course stores raw data first and transforms it later with P10. This approach is called:", "o": ["ETL", "Streaming", "Batching", "ELT"], "part": "Data engineering", "c": "C3"}, {"n": 15, "q": "What is `LockService` used for in the logger?", "o": ["Preventing two simultaneous requests from overwriting each other's rows", "Encrypting the data", "Hiding the Sheet from viewers", "Speeding up Wi-Fi"], "part": "Data engineering", "c": "C3"}, {"n": 16, "q": "The `PipelineLog` quality percentage falls from 98% to 60% over two runs. What is the best first step?", "o": ["Delete the `Rejected` tab.", "Loosen the quality rules so more rows pass.", "Open the `Rejected` tab to see which reasons and devices increased.", "Ignore it, because quality always varies."], "part": "Data engineering", "c": "C3"}, {"n": 17, "q": "Two rows have the same timestamp, device, sensor, and value. This is a:", "o": ["missing value", "duplicate", "outlier", "unit mismatch"], "part": "Data cleaning", "c": "C4"}, {"n": 18, "q": "One reading is 85.3 with unit F among Celsius readings. The correct cleaned value is about:", "o": ["29.6 °C", "85.3 °C", "47.4 °C", "The row should be deleted."], "part": "Data cleaning", "c": "C4"}, {"n": 19, "q": "For a set of temperatures, Q1 = 28 °C and Q3 = 30 °C. Using the IQR rule, the upper fence is:", "o": ["31 °C", "32 °C", "36 °C", "33 °C"], "part": "Data cleaning", "c": "C4"}, {"n": 20, "q": "A temperature log has a single missing reading between 29.6 °C and 29.8 °C. Following the course rule, what is the best action?", "o": ["Replace it with 0.", "Delete the whole day's data.", "Interpolate it as about 29.7 °C and record the change in the cleaning log.", "Replace it with 999."], "part": "Data cleaning", "c": "C4"}, {"n": 21, "q": "Which practice follows the course's golden rule of cleaning?", "o": ["Edit the raw `Data` tab directly to save time.", "Clean in a copy or through the pipeline, and record every change in a cleaning log.", "Delete any value that looks unusual.", "Clean only the values that support the expected result."], "part": "Data cleaning", "c": "C4"}, {"n": 22, "q": "Which chart best shows how classroom temperature changes during one day?", "o": ["Line chart", "Pie chart", "Bar chart of devices", "A table only"], "part": "Analysis and communication", "c": "C5"}, {"n": 23, "q": "Temperature and humidity in a room have a correlation of r = 0.85. Which conclusion is valid?", "o": ["Temperature causes humidity to rise.", "85% of humidity is explained by temperature.", "There is a strong positive linear association, which does not prove cause.", "There is no relationship."], "part": "Analysis and communication", "c": "C5"}, {"n": 24, "q": "Increasing a moving-average window from 3 to 10 readings makes the line:", "o": ["noisier", "react faster to changes", "unchanged", "smoother but slower to react to real changes"], "part": "Analysis and communication", "c": "C5"}, {"n": 25, "q": "Which finding sentence meets the course's data story standard?", "o": ["\"The room is hot.\"", "\"The window side averaged 1.8 °C warmer than the door side over 45 minutes.\"", "\"We collected a lot of data.\"", "\"The sensors worked well.\""], "part": "Analysis and communication", "c": "C5"}, {"n": 26, "q": "A team's device ID (for example, `team3-esp32`) is which level of measurement?", "o": ["Nominal", "Ordinal", "Interval", "Ratio"], "part": "Analysis and communication", "c": "C5"}, {"n": 27, "q": "Why is a forecasting model compared with a baseline that predicts \"next value = current value\"?", "o": ["Baselines are always the best model.", "It makes the model train faster.", "A model is useful only if it beats the simplest reasonable prediction.", "It removes the need for test data."], "part": "Data science", "c": "C6"}, {"n": 28, "q": "How should time-series sensor data be split into training and test sets?", "o": ["Shuffle randomly, then split 70/30.", "Train on the earlier 70%, test on the later 30%.", "Use the same rows for training and testing.", "Train on the latest data and test on the earliest."], "part": "Data science", "c": "C6"}, {"n": 29, "q": "A feature is the rolling mean of the current and previous 4 readings, and the model predicts the current reading. What is the problem?", "o": ["Concept drift", "Underfitting", "Too few features", "Data leakage"], "part": "Data science", "c": "C6"}, {"n": 30, "q": "On the test set, a model's MAE is 0.35 °C and the baseline's MAE is 0.30 °C. What should the team conclude?", "o": ["The baseline is more accurate, so the model is not useful yet.", "The model is more accurate.", "They are equally accurate.", "MAE cannot compare them."], "part": "Data science", "c": "C6"}, {"n": 31, "q": "An anomaly detector flagged 12 readings: 5 were real events and 7 were false alarms. What is the main risk of keeping this setting?", "o": ["Data leakage", "Missing every real event", "Alert fatigue, so people start ignoring the flags", "Overfitting the training set"], "part": "Data science", "c": "C6"}, {"n": 32, "q": "In P8, why does the device itself sound the buzzer when it is too hot, instead of waiting for the cloud?", "o": ["Cloud decisions cost money.", "The safety action still works if Wi-Fi or the cloud is down.", "Apps Script cannot read thresholds.", "Buzzers cannot be controlled remotely."], "part": "Automation and control", "c": "C7"}, {"n": 33, "q": "What is the purpose of the 30-minute cooldown in `checkAlerts()`?", "o": ["To save battery", "To make alerts faster", "To delete old data", "To avoid repeated alerts that people learn to ignore"], "part": "Automation and control", "c": "C7"}, {"n": 34, "q": "The published dashboard's page source contains the same API key the devices use to log data. What is the main risk, and the fix?", "o": ["Anyone could write fake readings; use a separate read-only key for the dashboard.", "The page will load slowly; shorten the key.", "There is no risk, because the page is on GitHub.", "The chart will break; remove the chart."], "part": "Automation and control", "c": "C7"}, {"n": 35, "q": "In Google's PARTS prompting framework, the letters stand for:", "o": ["Purpose, Audience, Rules, Tone, Summary", "Persona, Answer, Review, Test, Submit", "Persona, Act, Recipient, Theme, Structure", "Plan, Ask, Revise, Test, Share"], "part": "Human-centered AI", "c": "C8"}, {"n": 36, "q": "A team must choose among three possible cleaning strategies. Which prompting technique fits best?", "o": ["Chain-of-Thought only", "Tree-of-Thought", "A one-word prompt", "No prompt; let the AI decide"], "part": "Human-centered AI", "c": "C8"}, {"n": 37, "q": "Chain-of-Thought prompting is most useful in this course when you need to:", "o": ["generate many creative options", "avoid explaining reasoning", "make the AI respond faster", "debug or explain code through visible steps you can check"], "part": "Human-centered AI", "c": "C8"}, {"n": 38, "q": "An AI gives you code that compiles. According to the human-in-the-loop rules, what must happen before you use it?", "o": ["You can explain every line, have tested it with edge cases, and have checked unfamiliar functions in official documentation.", "Submit it, because it compiles.", "Ask a second AI to approve it.", "Rename the variables so it looks original."], "part": "Human-centered AI", "c": "C8"}, {"n": 39, "q": "An AI wrote this line for an ESP32, where `raw` is an `int`: `float pct = raw / 4095 * 100;`. What is wrong?", "o": ["Nothing; it is correct.", "4095 should be 1023.", "Integer division makes the result 0 for almost every reading; use `4095.0`.", "A `float` cannot store percentages."], "part": "Human-centered AI", "c": "C8"}, {"n": 40, "q": "Which of these should never be pasted into an AI tool?", "o": ["A public error message", "The device's API key or Wi-Fi password", "A question about `millis()`", "The course pin map"], "part": "Human-centered AI", "c": "C8"}];

<script>
/* ============ INTERACTIVES v4: lively, touch-friendly explainers ============ */
const EASE = [.22, 1, .36, 1];
const anim = (el, kf, opt) => (typeof A === "function" ? A(el, kf, opt) : null);
const alive = el => document.body.contains(el);
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function loopSteps(lang){ const st = []; let t = 0; const L = (line, vars, note) => st.push({line, vars, note});
  for (let i = 0; i < 3; i++){ L(1, {i, LED:"OFF", "time (ms)":t}, lang === "cpp" ? `Check i < 3: ${i} < 3 is true, so run the body.` : `range(3) gives the next value: i = ${i}.`);
    L(2, {i, LED:"ON", "time (ms)":t}, "LED on."); t += 150; L(3, {i, LED:"ON", "time (ms)":t}, "Wait 150 ms (the board does nothing else)."); L(4, {i, LED:"OFF", "time (ms)":t}, "LED off."); t += 150; L(5, {i, LED:"OFF", "time (ms)":t}, `Wait 150 ms. Blink ${i + 1} of 3 done.`); }
  L(1, {i:3, LED:"OFF", "time (ms)":t}, lang === "cpp" ? "i++ makes i = 3. Check 3 < 3: false, so the for loop ends." : "range(3) has no more values, so the for loop ends."); t += 2000;
  L(7, {i:3, LED:"OFF", "time (ms)":t}, "The pause runs once, after all 3 blinks: 2000 ms."); L(0, {i:"\u2014", LED:"OFF", "time (ms)":t}, "End of the main loop: start again from the top. One round took 2900 ms."); return st; }

  const t = document.createElement("div"); t.className = "t-item " + (kind || "ok"); t.textContent = msg; box.appendChild(t);
  A(t, {opacity:[0,1], y:[24,0], scale:[.96,1]}, SPRING);
  setTimeout(() => { const a = A(t, {opacity:0, x:40}, {duration:.3}); setTimeout(() => t.remove(), a ? 320 : 0); }, 3000);
};

/* confetti burst */
function confetti(){
  if (reduceMotion()) return;
  let cv = $("#confetti"); if (!cv){ cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv); }
  const g = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#2A9D8F","#E9C46A","#E76F51","#1F3A5F","#9CC3E8"];
  const P = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-0.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+3, c:cols[Math.random()*5|0], a:Math.random()*6, va:(Math.random()-0.5)*0.3}));
  const t0 = performance.now();
  (function f(now){ const dt = (now - t0)/1000; g.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle = p.c; g.globalAlpha = Math.max(0, 1 - dt/2.2); g.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); g.restore(); });
    if (dt < 2.2) requestAnimationFrame(f); else g.clearRect(0,0,cv.width,cv.height); })(t0);
}

/* spotlight + tilt cards */
function spotify(root){
  root.querySelectorAll(".spot").forEach(el => {
    el.addEventListener("pointermove", e => {
      const r = el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      el.style.setProperty("--mx", x + "px"); el.style.setProperty("--my", y + "px");
      if (e.pointerType === "mouse" && !reduceMotion()){ el.style.transition = "transform .08s"; el.style.transform = `perspective(900px) rotateX(${(0.5 - y/r.height)*5}deg) rotateY(${(x/r.width - 0.5)*6}deg)`; }
    });
    el.addEventListener("pointerleave", () => { el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1)"; el.style.transform = ""; });
  });
}

/* reveal on scroll */
function reveal(nodes, opts){
  const list = [...nodes]; if (!canAnim() || !("IntersectionObserver" in window)) return;
  list.forEach(n => { n.style.opacity = 0; n.style.transform = "translateY(24px)"; });
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (!en.isIntersecting) return; io.unobserve(en.target);
    const a = A(en.target, {opacity:1, y:[24,0]}, Object.assign({duration:.6, ease:[.22,1,.36,1]}, opts||{}));
    if (!a){ en.target.style.opacity = ""; en.target.style.transform = ""; } }), {threshold:0.08});
  list.forEach(n => io.observe(n));
}

function ring(pct, size){ size = size || 24; const r = size*0.375, c = 2*Math.PI*r, sw = size/8;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle class="ring-fg" data-c="${c}" data-p="${pct}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/></svg>`; }
function animateRings(root){ root.querySelectorAll(".ring-fg").forEach(c => { const C = +c.dataset.c, p = +c.dataset.p; if (!p) return; A(c, {strokeDashoffset:[C, C*(1-p)]}, {duration:1.1, ease:[.22,1,.36,1]}); }); }
function modulePct(m){ if (!m.sections) return 0; const total = m.sections.length + 1; let d = m.sections.filter(s => prog.done[m.id+":"+s.id]).length; if (prog.rating[m.id]) d++; return d/total; }

function startScope(){
  const cv = $("#scope"); if (!cv) return; const g = cv.getContext("2d"); const W = cv.width, H = cv.height;
  const pts = Array.from({length:180}, () => 52 + (Math.random()-0.5)*1.6); let shadow = 0, target = 0;
  const setT = ev => { const r = cv.getBoundingClientRect(); const cx = (ev.clientX - r.left)/r.width; target = cx > 0 && cx < 1 ? 1 : 0; };
  cv.addEventListener("pointermove", setT); cv.addEventListener("pointerdown", setT); cv.addEventListener("pointerleave", () => target = 0);
  function frame(){ if (!document.body.contains(cv)) return; shadow += (target - shadow) * 0.12;
   const v = 52 - 40*shadow + (Math.random()-0.5)*1.6; pts.push(v); if (pts.length > 180) pts.shift();
   g.clearRect(0,0,W,H); g.strokeStyle = "rgba(143,179,214,.16)"; g.lineWidth = 1; for (let k=1;k<4;k++){ g.beginPath(); g.moveTo(0,H*k/4); g.lineTo(W,H*k/4); g.stroke(); }
   const grad = g.createLinearGradient(0,0,W,0); grad.addColorStop(0,"rgba(233,196,106,.15)"); grad.addColorStop(1,"#E9C46A");
   g.strokeStyle = grad; g.lineWidth = 3; g.beginPath(); pts.forEach((p,i) => { const x = W - (pts.length-1-i)*(W/179), y = H - p/100*H; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
   const lx = W, ly = H - pts[pts.length-1]/100*H; g.fillStyle = "#E9C46A"; g.beginPath(); g.arc(lx-4, ly, 6, 0, Math.PI*2); g.fill();
   const lab = $("#scopeVal"); if (lab) lab.textContent = v.toFixed(1)+" %";
   reduceMotion() ? setTimeout(() => requestAnimationFrame(frame), 250) : requestAnimationFrame(frame); }
  frame();
}

let device = "laptop";
function detectDevice(){
  const w = innerWidth, ua = navigator.userAgent, coarse = matchMedia("(pointer: coarse)").matches;
  const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const androidTablet = /Android/.test(ua) && !/Mobile/.test(ua);
  if (w < 600) return "phone";
  if (iPad || androidTablet) return "tablet";
  if (/iPhone|iPod|Android.+Mobile/.test(ua) && w < 950) return "phone";
  if (coarse && w <= 1366) return "tablet";
  return w < 1440 ? "laptop" : "desktop";
}
function applyDevice(){
  const d = detectDevice(), root = document.documentElement;
  root.dataset.orient = innerWidth > innerHeight ? "landscape" : "portrait";
  if (d === device && root.dataset.device) return;
  device = d; root.dataset.device = d;
  if (d !== "desktop") document.body.classList.remove("ai-docked");
  else if (aiOpen) document.body.classList.add("ai-docked");
}
addEventListener("resize", () => { clearTimeout(applyDevice.t); applyDevice.t = setTimeout(applyDevice, 150); });
