<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Sensor to Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/motion@13/dist/motion.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --navy:#1F3A5F; --teal:#2A9D8F; --signal:#E76F51; --amber:#E9C46A;
  --bg:#F6F8FA; --surface:#FFFFFF; --line:#D7DEE6; --muted:#5B6B7F; --dot:#C9D3DE;
  --ok:#2A9D8F; --bad:#C2410C; --fs:1.0625rem;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --ink:#E6EDF5; --navy:#9CC3E8; --bg:#0F1B2D; --surface:#16263D; --line:#2A3D57; --muted:#9FB0C4; --dot:#2A3D57;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#E6EDF5; --navy:#9CC3E8; --bg:#0F1B2D; --surface:#16263D; --line:#2A3D57; --muted:#9FB0C4; --dot:#2A3D57;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--teal)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.88em}
h1,h2,h3{line-height:1.25;color:var(--ink)}
h1{font-size:2rem;margin:.2em 0 .4em}
h2{font-size:1.4rem;margin:1.8em 0 .5em}
h3{font-size:1.12rem;margin:1.4em 0 .4em}
p,li{max-width:72ch}

/* layout */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.topbar .spacer{flex:1}
.who{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 58px)}
#map{border-right:1px solid var(--line);background:var(--surface);padding:16px 14px;overflow:auto}
#view{padding:28px clamp(16px,4vw,56px) 80px;min-width:0}
.btn.menu-btn{display:none}
.shell.noside{grid-template-columns:1fr}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  #map{position:fixed;inset:58px 0 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s}
  #map.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  body.guest .btn.menu-btn{display:none}
  .who{display:none}
}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1B2D}
.btn.small{padding:5px 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* course map */
.unit{margin-bottom:14px}
.unit-title{font-weight:700;font-size:.95rem;margin:10px 4px 6px;color:var(--ink)}
.unit-sub{font-size:.82rem;color:var(--muted);margin:-4px 4px 6px}
.mod-link{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
.mod-link:hover{background:var(--bg)}
.mod-link.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--teal)}
.mod-link.locked{color:var(--muted);pointer-events:none}
.ring{flex:none}
.map-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:6px}

/* hero / welcome */
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start;max-width:1150px}
@media (max-width:980px){.welcome{grid-template-columns:1fr}}
.welcome>*{min-width:0}
.scope{background:#0F1B2D;border-radius:14px;padding:18px 18px 12px;color:#CFE3F7;position:relative;overflow:hidden}
.scope canvas{width:100%;height:220px;display:block;touch-action:none;cursor:crosshair}
.scope .readout{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:.85rem;color:#8FB3D6;margin-top:6px}
.scope .hint{font-size:.9rem;color:#9FB0C4;margin:8px 0 0}
.hero-title{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05;margin:18px 0 10px;letter-spacing:-.01em}
.hero-lede{font-size:1.15rem;color:var(--muted);max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.95rem}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.field input,.field select{width:100%;min-width:0}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.consent{font-size:.9rem;color:var(--muted);display:flex;gap:10px;align-items:flex-start;margin:6px 0 16px}
.consent input{margin-top:5px}
.err{color:var(--bad);font-size:.92rem;min-height:1.2em}

/* module */
.crumb{color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem;margin-bottom:10px}
.objectives{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 20px;margin:14px 0}
.objectives li{margin:4px 0}
.section{border-top:1px solid var(--line);padding-top:6px;margin-top:26px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{margin:.9em 0 .4em;flex:1;min-width:60%}
.sec-actions{display:flex;gap:8px}
.done-mark{color:var(--ok);font-weight:700;font-size:.92rem}
.note{border-left:4px solid var(--teal);background:var(--surface);padding:10px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.note.warm{border-color:var(--signal)}
.formula{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;margin:12px 0;font-weight:700}
table.t{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--navy);color:#fff}
:root[data-theme="dark"] table.t th{color:#0F1B2D}
pre.code{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:12px 14px;overflow-x:auto;line-height:1.45}

/* bench = interactive panel with breadboard dot grid */
.bench{margin:18px 0;border:1px solid var(--line);border-radius:12px;padding:16px;
  background-color:var(--surface);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.bench-title{font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.bench-title svg{flex:none}
.bench .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.bench svg{max-width:100%;height:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.controls label{font-size:.95rem}
input[type=range]{accent-color:var(--teal);flex:1 1 160px;max-width:320px;min-width:0}
.controls select{max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.4em;font-weight:700;margin-top:8px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv b{font-family:"JetBrains Mono",monospace}
.tracer{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:760px){.tracer{grid-template-columns:1fr}}
.tracer .lines div{font-family:"JetBrains Mono",monospace;font-size:.82rem;padding:1px 8px;border-radius:4px;white-space:pre}
.tracer .lines div.hl{background:var(--amber);color:#14213D}
.led{width:28px;height:28px;border-radius:50%;background:#55606E;display:inline-block;vertical-align:middle;transition:background .1s}
.led.on{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.serial{font-family:"JetBrains Mono",monospace;font-size:.82rem;background:#0F1B2D;color:#BFE3D9;border-radius:6px;padding:8px;height:120px;overflow:auto}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);width:0}

/* quiz, rating, upload */
.q{margin:14px 0 18px}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.explain{font-size:.95rem;color:var(--muted);margin-top:6px}
.rating{display:flex;flex-direction:column;gap:8px}
.rating label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--teal)}
.drop input[type=file]{max-width:100%}
.uplist{font-size:.92rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.stat{font-size:2rem;font-weight:700;color:var(--navy)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:420px;width:92vw}
dialog::backdrop{background:rgba(15,27,45,.5)}
.banner{background:var(--amber);color:#14213D;padding:8px 18px;font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
/* ===== v2: motion & component layer ===== */
.scrollbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--signal));transform-origin:0 50%;transform:scaleX(0);z-index:60}
.topbar{backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.kbd{font-family:"JetBrains Mono",monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
.search-btn{color:var(--muted);min-width:200px;justify-content:space-between}
@media (max-width:860px){.search-btn{min-width:0}.search-btn .lbl,.search-btn .kbd{display:none}}
@media (max-width:520px){.brand{font-size:.95rem;gap:6px}.brand svg{width:26px}.topbar{gap:8px;padding:10px 12px}body:not(.guest) .brand span{display:none}}

/* hero band */
.hero{position:relative;margin:-28px calc(-1*clamp(16px,4vw,56px)) 0;padding:56px clamp(16px,4vw,56px) 64px;
  background:#0E1A2B;color:#E6EDF5;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(156,195,232,.22) 1.2px,transparent 1.3px);background-size:22px 22px;z-index:-2;
  mask-image:radial-gradient(ellipse 80% 70% at 60% 40%,#000 40%,transparent 100%)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;max-width:1240px;margin:0 auto}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero-grid>*{min-width:0}
.beams{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.beams path{fill:none;stroke:rgba(156,195,232,.16);stroke-width:1.5}
.beams .pulse{stroke:url(#beamGrad);stroke-width:2.5;stroke-dasharray:60 900;animation:beam 5.5s linear infinite}
.beams .pulse:nth-of-type(2n){animation-duration:7s;animation-delay:-2s}
.beams .pulse:nth-of-type(3n){animation-duration:6.2s;animation-delay:-4s}
@keyframes beam{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
.hero h1{color:#fff;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.hero h1 .w{display:inline-block;will-change:transform}
.hero .lede{color:#B9CADD;font-size:1.18rem;max-width:50ch;margin:0 0 26px}
.tickers{display:flex;flex-wrap:wrap;gap:12px 30px;margin:0 0 30px}
.ticker b{display:block;font-size:2.1rem;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.ticker span{color:#9FB0C4;font-size:.92rem}
.board-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.board-chip{border:1px solid rgba(156,195,232,.3);color:#CFE3F7;border-radius:999px;padding:5px 12px;font-size:.88rem;background:rgba(255,255,255,.03)}
.hero .scope{background:#08121F;border:1px solid rgba(156,195,232,.18);box-shadow:0 30px 80px -30px rgba(42,157,143,.45)}

/* shimmer button */
.shimmer{position:relative;isolation:isolate;overflow:hidden;border:0!important;background:var(--teal)!important;color:#08121F!important;font-weight:700;
  padding:12px 22px!important;border-radius:999px!important}
.shimmer::before{content:"";position:absolute;inset:-2px;z-index:-1;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(255,255,255,.85) 80%,transparent 90%);animation:spin 3s linear infinite}
.shimmer::after{content:"";position:absolute;inset:2px;border-radius:999px;background:var(--teal);z-index:-1}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}

/* registration section */
.reg-wrap{max-width:1240px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:start}
@media (max-width:980px){.reg-wrap{grid-template-columns:1fr}}
.reg-wrap>*{min-width:0}
.how{display:flex;flex-direction:column;gap:14px}
.how-step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.how-step i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-style:normal;font-weight:700;color:var(--teal)}

/* spotlight + tilt cards (bento) */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:18px 0 8px}
.bento .span2{grid-column:span 2}.bento .span3{grid-column:span 3}.bento .span4{grid-column:span 4}.bento .span6{grid-column:span 6}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.bento>*{grid-column:span 2!important}}
.spot{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;transform-style:preserve-3d;will-change:transform}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--teal) 16%,transparent),transparent 45%)}
.spot:hover::before{opacity:1}
.spot .big{font-size:2.4rem;font-weight:700;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums}
.spot .lbl{color:var(--muted)}
a.spot{display:block;color:inherit;text-decoration:none}
.mod-card h3{margin:.3em 0 .2em}
.mod-card .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.mod-card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber))}
.mod-card .num{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.85rem}
.continue{background:var(--navy);color:#fff;border-color:var(--navy)}
.continue .lbl,.continue h3{color:#fff}
:root[data-theme="dark"] .continue{background:#1D3A5C}

/* course map active pill */
@media (min-width:861px){#map{position:sticky;top:58px;height:calc(100vh - 58px);align-self:start}}
.pill{position:absolute;left:14px;right:14px;height:0;border-radius:8px;background:var(--bg);box-shadow:inset 3px 0 0 var(--teal);z-index:0;pointer-events:none}
.mod-link{position:relative;z-index:1}
.mod-link.active{background:transparent;box-shadow:none}

/* module layout with toc */
.mod-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px}
.mod-layout>*{min-width:0}
.tracer>*{min-width:0}
.tracer .lines{overflow-x:auto}
@media (max-width:1240px){.mod-layout{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:84px;align-self:start;font-size:.9rem;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0;transition:color .2s}
.toc a.on{color:var(--teal);font-weight:700}
.mod-hero{position:relative;padding:22px 24px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-bottom:8px}
.mod-hero h1{margin:.1em 0 .2em}
.mod-hero .ring-big{position:absolute;right:20px;top:20px}
@media (max-width:600px){.mod-hero .ring-big{display:none}}
.section{will-change:transform}
.done-btn.done{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok);font-weight:700}

/* quiz feedback motion hooks */
.opt{transition:border-color .2s,background .2s}

/* rating cards */
.rating label{transition:border-color .2s,transform .2s}
.rating label:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}

/* upload */
.drop{position:relative;overflow:hidden}
.drop .prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,transparent,var(--teal),transparent);background-size:50% 100%;background-repeat:no-repeat;opacity:0}
.drop.busy .prog{opacity:1;animation:slide 1.1s linear infinite}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}

/* toast stack */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 36px))}
.t-item{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center}
:root[data-theme="dark"] .t-item{background:#24476E}
.t-item.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.t-item.warn{background:var(--signal)}

/* command palette */
#palette{padding:0;max-width:560px;top:12vh;margin:0 auto;position:fixed}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1.05rem;background:transparent;color:var(--ink);outline:none}
#palList{max-height:50vh;overflow:auto;padding:6px}
#palList a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none}
#palList a.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--teal)}
#palList small{color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
/* ===== v3: sign-up, devices, AI assistant ===== */
[hidden]{display:none!important}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px}
.seg button,.seg label{flex:1;text-align:center;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-sm{margin:4px 0 0}
.seg label{position:relative}.seg label input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg label:has(input:focus-visible){outline:3px solid var(--amber)}
fieldset.field{border:0;padding:0;margin:0 0 12px}
fieldset legend{font-weight:700;font-size:.95rem;padding:0;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex}.chk input{position:absolute;opacity:0;pointer-events:none}
.chk span{border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;background:var(--surface);font-size:.92rem;user-select:none}
.chk input:checked+span{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 14%,var(--surface));color:var(--ink);font-weight:700}
.chk input:focus-visible+span{outline:3px solid var(--amber)}
.privacy{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px 14px;background:var(--bg);font-size:.88rem;margin:6px 0 10px}
.privacy h3{font-size:1rem;margin:.6em 0 .4em}.privacy p{margin:.45em 0}
.btn.big{width:100%;justify-content:center;padding:12px 16px;font-size:1.02rem}

/* AI assistant */
.ai-fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;
  padding:12px 18px;background:var(--navy);color:#fff;font-weight:700;box-shadow:0 14px 30px -10px rgba(31,58,95,.6);cursor:pointer}
:root[data-theme="dark"] .ai-fab{background:#2A9D8F;color:#08121F}
.ai{position:fixed;z-index:68;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.ai[hidden]{display:none}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ai-head b{flex:1}
.ai-note{font-size:.8rem;color:var(--muted);padding:6px 14px;border-bottom:1px solid var(--line);margin:0}
#aiMsgs{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 12px;border-radius:12px;font-size:.95rem;line-height:1.5;overflow-wrap:anywhere}
.msg p{margin:.3em 0}.msg ul,.msg ol{margin:.3em 0;padding-left:1.2em}.msg pre.code{font-size:.8rem;margin:.4em 0;max-width:100%}
.msg.user{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
:root[data-theme="dark"] .msg.user{background:#24476E}
.msg.bot{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.sys{align-self:center;background:color-mix(in srgb,var(--amber) 22%,var(--surface));color:var(--ink);font-size:.9rem;text-align:center}
.msg-tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:.8rem;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:.8rem}
.chip.small{padding:3px 9px;font-size:.78rem}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bob 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
#aiChips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}
#aiChips .chip{white-space:nowrap;font-size:.85rem}
#aiForm{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px))}
#aiInput{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px;max-height:120px}

/* laptop: floating panel */
.ai{right:20px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:400px;height:min(620px,calc(100vh - 140px));border-radius:16px}
/* desktop: docked side panel */
:root[data-device="desktop"] .ai{top:58px;right:0;bottom:0;height:auto;width:400px;border-radius:0;border-width:0 0 0 1px;box-shadow:none}
body.ai-docked .shell{margin-right:400px}
body.ai-docked .ai-fab{display:none}
/* tablet: side sheet, larger touch targets */
:root[data-device="tablet"] .ai{top:58px;right:0;bottom:0;height:auto;width:min(440px,92vw);border-radius:0}
:root[data-device="tablet"] .btn,:root[data-device="phone"] .btn{min-height:44px}
:root[data-device="tablet"] .opt,:root[data-device="phone"] .opt{padding:12px 14px}
:root[data-device="tablet"] .mod-link,:root[data-device="phone"] .mod-link{padding:11px 8px}
/* phone: bottom navigation and full-screen assistant */
.bottom-nav{display:none}
:root[data-device="phone"] .bottom-nav:not([hidden]){display:flex;position:fixed;left:0;right:0;bottom:0;z-index:66;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
:root[data-device="phone"] .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--muted);font-size:.72rem;padding:6px 0;min-height:48px;cursor:pointer}
:root[data-device="phone"] .bottom-nav button svg{width:22px;height:22px}
:root[data-device="phone"] .bottom-nav button.on{color:var(--teal);font-weight:700}
:root[data-device="phone"] body:not(.guest){padding-bottom:calc(68px + env(safe-area-inset-bottom,0px))}
:root[data-device="phone"] .ai-fab,:root[data-device="phone"] #searchBtn,:root[data-device="phone"] #menuBtn{display:none!important}
:root[data-device="phone"] .ai{inset:0;width:auto;height:auto;border-radius:0;border:0;z-index:75}
:root[data-device="phone"] #toasts{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
:root[data-device="phone"] #view{padding:20px 16px 40px}
:root[data-device="phone"] .hero{margin:-20px -16px 0;padding:40px 16px 48px}
:root[data-device="phone"] .bench{padding:12px}
:root[data-device="phone"] input,:root[data-device="phone"] select,:root[data-device="phone"] textarea{font-size:16px}
@media (max-width:420px){.chk span{padding:6px 10px}}
:root[data-device="phone"] #map{padding-bottom:96px}
</style>
</head>
<body>
<div class="scrollbar" id="scrollbar"></div>
<div id="banner"></div>
<header class="topbar">
  <button class="btn small menu-btn" id="menuBtn" aria-label="Open course map">Menu</button>
  <a class="brand" href="#/home">
    <svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><path d="M1 15 L7 15 L10 4 L14 19 L18 9 L21 13 L33 13" fill="none" stroke="#2A9D8F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>From Sensor to Insight</span>
  </a>
  <span class="spacer"></span>
  <button class="btn small search-btn" id="searchBtn" aria-label="Search modules and sections"><span>Search</span><span class="kbd">Ctrl K</span></button>
  <span class="who" id="who"></span>
  <button class="btn small" id="settingsBtn">Settings</button>
</header>

  <nav id="map" aria-label="Course map"></nav>
  <main id="view" tabindex="-1"></main>
</div>
<dialog id="palette" aria-label="Search the course"><input id="palInput" placeholder="Search modules and sections…" aria-label="Search"><div id="palList"></div></dialog>
<dialog id="settings">
  <h2 style="margin-top:.2em">Settings</h2>
  <div class="field"><label for="setTheme">Theme</label>
    <select id="setTheme"><option value="auto">Match my device</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
  <div class="field"><label for="setSize">Text size</label>
    <select id="setSize"><option value="1">Standard</option><option value="1.15">Large</option><option value="1.3">Extra large</option></select></div>
  <div class="field"><label for="setMotion">Animations</label>
    <select id="setMotion"><option value="full">On</option><option value="reduce">Reduced</option></select></div>

</dialog>
<button class="ai-fab" id="aiFab" hidden aria-label="Ask Sensi, the AI learning assistant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v3M5.6 5.6l2.1 2.1M3 12h3M18.4 5.6l-2.1 2.1M21 12h-3"/><circle cx="12" cy="14" r="5"/></svg><span>Ask Sensi</span></button>

  <div class="ai-head"><b>Sensi • AI learning assistant</b><button class="btn small" id="aiClose" aria-label="Close assistant">Close</button></div>
  <p class="ai-note">You are chatting with an AI, not a person. It can make mistakes, so check important answers. Your teacher can review these chats.</p>
  <div id="aiMsgs" aria-live="polite"></div>

  <form id="aiForm"><textarea id="aiInput" rows="1" placeholder="Ask about this module…" aria-label="Your question"></textarea><button class="btn primary" id="aiSend" type="submit">Send</button></form>
</aside>

  <button data-nav="modules"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>Modules</button>

  <button data-nav="ask"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/><path d="M9 10h6"/></svg>Ask Sensi</button>
  <button data-nav="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</nav>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbz2UHq4LJScfjOKPIyygvtdF4sgerboY5WfYtGFrx0DnP9JdaogMXwOysUoDO5ERtYp/exec",   // ends with /exec
  HEARTBEAT_SECONDS: 60,
  IDLE_MINUTES: 5,
  MAX_UPLOAD_MB: 10,
  AI_MIN_AGE: 0           // 0 = no age limit; keep the same as AI_MIN_AGE in Code.gs
};

/* ============ STORAGE (safe) ============ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let user = store.get("sti_user", null);
const pkey = () => "sti_prog_" + (user ? user.email : "guest");
let prog = store.get(pkey(), {done:{}, quiz:{}, rating:{}, uploads:[], minutes:0});
function saveProg(){ store.set(pkey(), prog); }
const sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ============ API with offline queue ============ */
const apiReady = () => /^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);
async function api(action, data, queueIfFail = true){
  if (!user || !apiReady()) return {ok:false, offline:true};
  const body = JSON.stringify(Object.assign({action, email:user.email, sessionId}, data));
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
    return await r.json();
  }catch(e){
    if (queueIfFail && action !== "upload"){ const q = store.get("sti_queue", []); q.push(body); store.set("sti_queue", q.slice(-200)); }
    return {ok:false, error:"network"};
  }
}
async function flushQueue(){
  if (!apiReady()) return;
  const q = store.get("sti_queue", []); if (!q.length) return;
  store.set("sti_queue", []);
  for (const body of q){
    try{ await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body}); }
    catch(e){ const r = store.get("sti_queue", []); r.push(body); store.set("sti_queue", r); }
  }
}
let evBuffer = [];
function logEvent(moduleId, itemId, type, value){
  evBuffer.push({ts:Date.now(), moduleId, itemId, type, value});
  clearTimeout(logEvent.t); logEvent.t = setTimeout(sendEvents, 1500);
}
function sendEvents(){ if (!evBuffer.length) return; const events = evBuffer; evBuffer = []; api("event", {events}); }

/* ============ ACTIVE-TIME TRACKER ============ */
let lastActive = Date.now(), currentModule = "";
["pointerdown","keydown","scroll","touchstart"].forEach(ev => addEventListener(ev, () => lastActive = Date.now(), {passive:true}));
setInterval(() => {
  if (!user || document.visibilityState !== "visible") return;
  if (Date.now() - lastActive > CONFIG.IDLE_MINUTES * 60000) return;
  const m = CONFIG.HEARTBEAT_SECONDS / 60;
  prog.minutes = (prog.minutes || 0) + m; saveProg();
  api("heartbeat", {minutes:m, moduleId:currentModule});
}, CONFIG.HEARTBEAT_SECONDS * 1000);
setInterval(flushQueue, 120000);
addEventListener("online", flushQueue);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") sendEvents(); });

/* ============ HELPERS ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, kind){ if (window.toastStack) return window.toastStack(msg, kind); }
function speak(text){
  if (!("speechSynthesis" in window)) { toast("Read-aloud is not supported on this browser."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = Number(store.get("sti_voice", 1)); u.lang = "en-US";
  speechSynthesis.speak(u);
}
const reduceMotion = () => store.get("sti_motion","full") === "reduce" || matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="5" r="1.6" fill="#2A9D8F"/><circle cx="13" cy="5" r="1.6" fill="#2A9D8F"/><circle cx="5" cy="13" r="1.6" fill="#2A9D8F"/><circle cx="13" cy="13" r="1.6" fill="#E76F51"/><path d="M5 5 H13 V13" stroke="#2A9D8F" stroke-width="1.4" fill="none"/></svg>`;
function bench(title, inner){ return `<div class="bench"><p class="bench-title">${ICON}${esc(title)}</p>${inner}</div>`; }
</script>
<script>
/* ============ COURSE CONTENT (Unit 1) ============ */
const COURSE = [
 {id:"u1", title:"Unit 1: Sensors and programming foundations", sub:"Days 1\u20132", modules:[
  {id:"1.1", title:"Launch and the IoT data lifecycle", minutes:90,
   objectives:["Define the Internet of Things and identify its layers in our course system.",
     "Explain the six stages of the IoT data lifecycle using a classroom example (U1-O1).",
     "Distinguish the four types of analytics and classify questions by type (U1-O1).",
     "Write a data question your sensors can actually answer.",
     "Describe the human role when AI can write code."],
   sections:[
    {id:"hook", title:"Which spot in this room is best for studying?", html:`
     <p>Look around the room. Where would you sit to study for two hours: near the window, near the door, or in the middle? Write your guess and one reason before reading on.</p>
     <p>Most people answer from feeling. Feelings matter, but they are hard to compare and easy to argue about. In this course you will answer questions like this with <b>evidence</b>: measurements you collect, clean, analyze, and present yourself.</p>
     <div class="note warm">In April 2024, extreme heat led about 7,000 Philippine schools to suspend face-to-face classes in a single week, affecting more than a million students. PAGASA classifies a heat index of 42\u201351 \u00b0C as <i>danger</i>. Decisions like these depend on good data.</div>`},
    {id:"iot", title:"What is the Internet of Things?", html:`
     <p>The <b>Internet of Things (IoT)</b> is a network of physical objects that sense, process, and exchange data over the internet. In everyday terms: a thing measures something, sends the data somewhere useful, and something or someone acts on it.</p>
     <p>IoT systems are usually described in <b>layers</b>. A <b>sensor</b> turns a physical quantity into an electrical signal; an <b>actuator</b> does the opposite, turning a signal into action, such as lighting an LED or sounding a buzzer.</p>`, interactive:"iotflow"},
    {id:"lifecycle", title:"The IoT data lifecycle", html:`
     <p>Collecting numbers is only the beginning. Data becomes useful when it moves through a full cycle, from a question to an action. This course uses six stages. The cycle loops: sharing a finding usually raises a new question.</p>`, interactive:"lifecycle"},
    {id:"analytics", title:"Four types of analytics", html:`
     <p><b>Analytics</b> means using data to answer questions and support decisions. A widely used progression sorts it into four types:</p>
     <table class="t"><tr><th>Type</th><th>Question</th><th>Classroom example</th></tr>
     <tr><td>Descriptive</td><td>What happened?</td><td>The window side peaked at 33.1 \u00b0C at about 13:45.</td></tr>
     <tr><td>Diagnostic</td><td>Why did it happen?</td><td>Direct afternoon sun on the window side explains the difference.</td></tr>
     <tr><td>Predictive</td><td>What will happen?</td><td>Tomorrow the window side will likely pass 32 \u00b0C by 13:00.</td></tr>
     <tr><td>Prescriptive</td><td>What should we do?</td><td>Switch on the fan automatically at 31 \u00b0C.</td></tr></table>
     <p>Tip: <i>how many, what was</i> \u2192 descriptive; <i>why</i> \u2192 diagnostic; <i>will</i> \u2192 predictive; <i>should</i> \u2192 prescriptive.</p>`, interactive:"analytics"},
    {id:"question", title:"Writing a good data question", html:`
     <p>A strong data question is <b>specific</b> (what, where, when), <b>measurable</b> with your sensors, <b>comparative or time-based</b>, <b>useful</b> to someone, and <b>respectful</b> (no personal information).</p>
     <table class="t"><tr><th>Weak</th><th>Stronger</th></tr>
     <tr><td>"Is our room hot?"</td><td>"Is the window side warmer than the door side between 12:00 and 15:00?"</td></tr>
     <tr><td>"Do students like the room?"</td><td>"Is the back of the room darker than the front during morning classes?"</td></tr></table>
     <p><b>Team question card:</b> write your question, the sensors you need, where and when you will measure, the analytics type, and who could act on the answer. Upload a photo of it at the end of this module.</p>`},
    {id:"ai", title:"If AI can write the code, what is my job?", html:`
     <ul><li><b>AI can be confidently wrong or unsafe.</b> In one study, about 40% of programs GitHub Copilot generated for security-relevant scenarios contained vulnerabilities.</li>
     <li><b>Leaning on AI can weaken learning.</b> In a field experiment with nearly 1,000 high school students, unrestricted GPT-4 access lowered later exam scores by 17% once the AI was removed.</li>
     <li><b>Humans remain accountable.</b> UNESCO's AI competency framework for students puts a human-centred mindset first.</li></ul>
     <p>In this course, AI is your partner, but <b>you</b> specify the problem, check the answer, connect the parts, make the decision, and take responsibility.</p>
     <div class="note"><b>Think, pair, share:</b> list three things a person must still do when AI writes the code. Agree on the most important one with a partner.</div>`}
   ],
   quiz:[
    {q:"Which of these is an actuator?", o:["DHT22","LDR","Buzzer","Google Sheet"], a:2, e:"A buzzer turns a signal into action. The DHT22 and LDR are sensors; a Sheet is software."},
    {q:"A team removes duplicate rows from its Sheet. Which lifecycle stage is this?", o:["Ask","Collect","Clean","Share"], a:2, e:"Fixing data problems happens in the Clean stage."},
    {q:"\"Will the room pass 32 \u00b0C by 2:00 PM?\" is which type of analytics?", o:["Descriptive","Diagnostic","Predictive","Prescriptive"], a:2, e:"The key word is will: it asks about the future."},
    {q:"\"Why was the window side warmer?\" is which type of analytics?", o:["Descriptive","Diagnostic","Predictive","Prescriptive"], a:1, e:"The key word is why: it asks for a cause."},
    {q:"Which question can our kit answer?", o:["Do students like this room?","Is the window side warmer than the door side between 12:00 and 15:00?","Is our school the best?","Which subject is most fun?"], a:1, e:"It is specific, measurable with our sensors, comparative, and useful."}
   ],
   rating:["I can name the lifecycle stages only when I look at the diagram.","I can explain most stages and analytics types with some help.","I can explain all six stages and classify questions by analytics type on my own.","I can do level 3 and help a classmate write a strong data question."],
   checkpoint:{code:"U1-O1", task:"Label the 6 lifecycle stages and classify 4 questions by analytics type.", met:"6 of 6 stages and 4 of 4 questions correct.", upload:"Upload a photo of your team question card."}
  },
  {id:"1.2", title:"Board setup and programming basics", minutes:120,
   objectives:["Describe what a microcontroller is and compare the four course boards.",
     "Set up the tools and upload a program to your board (U1-O2).",
     "Identify the structure of an Arduino sketch and a MicroPython script (U1-O2).",
     "Use variables, data types, operators, conditionals, loops, and functions (U1-O2).",
     "Classify and fix syntax, runtime, and logic errors."],
   sections:[
    {id:"mcu", title:"What is a microcontroller?", html:`
     <p>A <b>microcontroller</b> is a complete small computer on one chip or module: a <b>processor</b> that carries out instructions, <b>memory</b> that stores your program, and <b>input/output pins</b> that connect to sensors and devices. It runs one program, starts instantly, uses little energy, and reacts to the physical world in real time.</p>
     <table class="t"><tr><th>Board</th><th>Processor</th><th>Language here</th></tr>
     <tr><td>Arduino Uno R4 WiFi</td><td>Renesas RA4M1 (Arm Cortex-M4, 48 MHz) + ESP32-S3 for Wi-Fi</td><td>Arduino C++</td></tr>
     <tr><td>ESP32 DevKit</td><td>Dual-core Xtensa up to 240 MHz, built-in Wi-Fi</td><td>Arduino C++</td></tr>
     <tr><td>ESP8266 NodeMCU</td><td>Tensilica L106 at 80/160 MHz, built-in Wi-Fi</td><td>Arduino C++</td></tr>
     <tr><td>Raspberry Pi Pico W</td><td>RP2040, dual Cortex-M0+ up to 133 MHz, CYW43439 Wi-Fi</td><td>MicroPython</td></tr></table>`},
    {id:"setup", title:"Setting up your tools", html:`
     <p><b>Arduino IDE 2</b> (Uno R4 WiFi, ESP32, ESP8266): install the board package from Boards Manager, select the board and port, and open the Serial Monitor at <b>115200 baud</b>. ESP boards need these Boards Manager URLs:</p>
     <pre class="code">https://espressif.github.io/arduino-esp32/package_esp32_index.json
https://arduino.esp8266.com/stable/package_esp8266com_index.json</pre>
     <p><b>Thonny</b> (Pico W): hold BOOTSEL while plugging in, install the MicroPython firmware for the Pico W, then type <code>print("hello")</code> in the Shell.</p>
     <div class="note">On an iPad or without hardware, use the Wokwi online simulator for ESP32 and Pico W projects.</div>`},
    {id:"structure", title:"Program structure and your first program", html:`
     <p>In Arduino C++, <code>setup()</code> runs <b>once</b> after power-up or reset, and <code>loop()</code> runs <b>forever</b>. MicroPython runs top to bottom, so setup lines go first and <code>while True:</code> does the job of <code>loop()</code>. Step through P1 below to see exactly which line runs when.</p>`, interactive:"tracer"},
    {id:"blocks", title:"Programming building blocks", html:`
     <table class="t"><tr><th>Stores</th><th>C++</th><th>Python</th></tr>
     <tr><td>Whole number</td><td>int</td><td>int</td></tr><tr><td>Decimal</td><td>float</td><td>float</td></tr>
     <tr><td>True/false</td><td>bool</td><td>bool</td></tr><tr><td>Text</td><td>String</td><td>str</td></tr></table>
     <div class="note warm"><b>Integer division trap:</b> in C++, <code>7 / 2</code> gives <b>3</b> because both are integers. In Python, <code>7 / 2</code> gives 3.5 and <code>7 // 2</code> gives 3.</div>
     <p><b>Decisions</b> use <code>if / else</code>; <b>repetition</b> uses <code>for</code> loops with a start, a condition, and a step; <b>functions</b> package a job with <b>parameters</b> and can <b>return</b> a value.</p>`, interactive:"primm"},
    {id:"errors", title:"Three kinds of errors", html:`
     <table class="t"><tr><th>Kind</th><th>What happens</th><th>Example</th></tr>
     <tr><td>Syntax</td><td>Will not upload or run</td><td>Missing semicolon; <code>serial</code> instead of <code>Serial</code>; wrong indentation in Python</td></tr>
     <tr><td>Runtime</td><td>Uploads, then crashes</td><td>Dividing by zero; using a variable before creating it</td></tr>
     <tr><td>Logic</td><td>Runs, but does the wrong thing</td><td>LED never turns off because both lines use HIGH</td></tr></table>
     <p><b>Core challenge:</b> blink 3 times quickly (0.15 s on/off), then pause 2 s, forever, using a <code>for</code> loop. <b>Extension:</b> write <code>blinkTimes(n, ms)</code> and blink SOS.</p>`}
   ],
   quiz:[
    {q:"Which function runs only once when the board starts?", o:["loop()","setup()","delay()","Serial.print()"], a:1, e:"setup() runs once after power-up or reset."},
    {q:"What does 115200 in Serial.begin(115200) set?", o:["The pin number","The baud rate, which must match the Serial Monitor","The delay in ms","The LED brightness"], a:1, e:"It is the serial speed in bits per second."},
    {q:"int x = 9; int y = 4; Serial.println(x / y); prints:", o:["2.25","2","3","2.0"], a:1, e:"Integer division drops the decimal part."},
    {q:"In MicroPython, what shows which lines are inside a loop?", o:["Curly braces","Semicolons","Indentation","Comments"], a:2, e:"Python uses indentation (4 spaces) to define blocks."},
    {q:"A program runs, but the LED never turns off. What kind of error is this?", o:["Syntax","Runtime","Logic","Network"], a:2, e:"It runs without a message but does the wrong thing."}
   ],
   rating:["I can upload P1, but I need help to change it.","I can change values in P1 and explain most lines with some help.","I can complete the Core challenge alone and explain setup, loop, variables, and loops.","I can complete the Extension and help a classmate fix an error."],
   checkpoint:{code:"U1-O2", task:"Complete the Core challenge and explain the code.", met:"Pattern repeats 5+ times; you point to setup, loop, a variable, and the loop structure.", upload:"Upload your code file (.ino or .py) and a short video or photo of the blinking pattern."}
  },
  {id:"1.3", title:"Reading sensors", minutes:150,
   objectives:["Distinguish analog and digital signals and explain the voltage divider.",
     "Explain how an ADC turns voltage into numbers and calculate readings for your board.",
     "Wire an LDR and a DHT22 and convert raw readings to calibrated units (U1-O3).",
     "Implement non-blocking timing and justify it over delay() (U1-O4).",
     "Use a structured AI prompt and verify each claim against documentation (U1-O7)."],
   sections:[
    {id:"signals", title:"Analog and digital signals", html:`
     <p>An <b>analog</b> signal can take any value in a range, like a dimmer. A <b>digital</b> signal has only two levels, HIGH and LOW. Our LDR gives an analog voltage. The DHT22 contains its own chip and sends its results as coded digital pulses.</p>`},
    {id:"divider", title:"From light to voltage: the voltage divider", html:`
     <p>An <b>LDR</b> has high resistance in the dark and low resistance in bright light. Wired in series with a fixed 10 k\u03a9 resistor, it forms a <b>voltage divider</b>:</p>
     <div class="formula">V out = V in \u00d7 R fixed \u00f7 (R LDR + R fixed)</div>
     <p>Drag the light slider to see how light becomes a voltage, then a number on your board.</p>`, interactive:"divider"},
    {id:"adc", title:"From voltage to numbers: the ADC", html:`
     <p>The <b>analog-to-digital converter</b> turns voltage into a whole number. An <i>n</i>-bit ADC has 2<sup>n</sup> levels: more bits mean smaller steps.</p>
     <table class="t"><tr><th>Board</th><th>Default range</th><th>Note</th></tr>
     <tr><td>Uno R4 WiFi</td><td>0\u20131023 (10-bit; up to 14-bit)</td><td>5 V reference, so a 3.3 V sensor tops out near 675</td></tr>
     <tr><td>ESP32</td><td>0\u20134095 (12-bit)</td><td>Use ADC1 pins such as GPIO 34; ADC2 cannot be read while Wi-Fi runs</td></tr>
     <tr><td>ESP8266</td><td>0\u20131023</td><td>One analog pin (A0)</td></tr>
     <tr><td>Pico W</td><td>read_u16(): 0\u201365535</td><td>12-bit hardware scaled to 16-bit</td></tr></table>`, interactive:"adc"},
    {id:"dht", title:"The DHT22 and calibration", html:`
     <p>The <b>DHT22</b> is accurate to about \u00b10.5 \u00b0C and 2\u20135% humidity and gives a new reading <b>at most once every 2 seconds</b>. A <b>library</b> handles its timed pulses for you. Failed reads return <b>NaN</b>, which good code skips instead of logging as 0.</p>
     <div class="formula">light % = (raw \u2212 dark raw) \u00f7 (bright raw \u2212 dark raw) \u00d7 100, clamped to 0\u2013100</div>
     <p>Example: dark 40, bright 620, raw 330 \u2192 290 \u00f7 580 \u00d7 100 = <b>50%</b>.</p>`},
    {id:"timing", title:"Timing: why delay() is a trap", html:`
     <p><code>delay()</code> freezes the board. Professional code uses <b>non-blocking timing</b>: check the clock every loop and act only when enough time has passed.</p>
     <pre class="code">if (now - lastRead >= INTERVAL_MS) {   // has enough time passed?
  lastRead = now;
  // ...read the sensors...
}</pre>
     <p>Try it: press the button during the simulation and see which board notices.</p>`, interactive:"timing"},
    {id:"aiverify", title:"AI activity: AI explains, you verify", html:`
     <p>AI can produce fluent explanations that are wrong. Use a <b>PARTS</b> prompt (Persona, Act, Recipient, Theme, Structure) with a <b>Chain-of-Thought</b> instruction, then check at least 5 claims against the walkthrough or official documentation.</p>
     <div class="note"><b>Sample prompt:</b> You are an embedded systems instructor who teaches beginners (P). Explain, line by line, what the P2 sketch does (A) for a learner who knows loops but not millis() (R), about reading a DHT22 and an LDR every 2 seconds without delay() (T). Use a table: line, code, meaning, then 3 quiz questions (S). Think step by step and explain why the timer works before the table.</div>
     <p>Record each claim as verified, wrong, or partly right, with the source you used, and add a row to your AI use log.</p>`}
   ],
   quiz:[
    {q:"Which sensor gives an analog signal?", o:["DHT22","LDR in a voltage divider","Both","Neither"], a:1, e:"The LDR divider gives a varying voltage; the DHT22 sends digital pulses."},
    {q:"In our wiring, brighter light makes V out\u2026", o:["Lower","Higher","Unchanged","Negative"], a:1, e:"LDR resistance falls, so more of the 3.3 V appears across the fixed resistor."},
    {q:"How many values can a 12-bit ADC produce?", o:["1024","2048","4096","65536"], a:2, e:"2^12 = 4096 values (0 to 4095)."},
    {q:"Dark raw 100, bright raw 900, raw 500. Calibrated light %?", o:["25%","50%","55.6%","62.5%"], a:1, e:"(500 \u2212 100) \u00f7 (900 \u2212 100) \u00d7 100 = 50%."},
    {q:"Why does P2 use if (now - lastRead >= INTERVAL_MS) instead of delay(2000)?", o:["It is shorter","The board stays free to do other tasks","delay() does not exist on ESP32","It makes readings more accurate"], a:1, e:"Non-blocking timing keeps the board responsive."}
   ],
   rating:["I can upload P2 and see readings, but cannot yet explain them.","I can explain the divider or the ADC and do the Core challenge with help.","I can explain light \u2192 % fully, do the Core alone, and justify millis().","I can complete the Boss Challenge and help a classmate debug."],
   checkpoint:{code:"U1-O3, U1-O4, U1-O7", task:"Show calibrated P2 output, complete the Boss Challenge (LED below 30% without delay()), and complete the AI verification table.", met:"5+ valid CSV rows; no delay() over 1 s; 5 AI claims checked with sources.", upload:"Upload a screenshot of your Serial Monitor output, your code, and your AI verification table."}
  },
  {id:"1.4", title:"Your first dataset in Google Sheets", minutes:120,
   objectives:["Describe a dataset using observation, variable, and value.",
     "Classify variables by level of measurement (U1-O5).",
     "Identify sources of measurement error and distinguish accuracy from precision (U1-O5).",
     "Import sensor data into Google Sheets and summarize it with formulas and a chart.",
     "Calculate the data volume of a sampling plan (U1-O6)."],
   sections:[
    {id:"anatomy", title:"The anatomy of a dataset", html:`
     <p>P2 prints <b>CSV</b> (comma-separated values). In a <b>tidy</b> dataset, each variable is a column, each observation is a row, and each value has its own cell. Units in column names (<code>temp_C</code>, <code>hum_pct</code>) prevent costly mistakes.</p>`},
    {id:"levels", title:"Levels of measurement", html:`
     <p>The level of measurement decides which statistics make sense. <b>Nominal</b>: labels (device ID). <b>Ordinal</b>: ordered categories (Dark &lt; Dim &lt; Bright). <b>Interval</b>: equal gaps, no true zero (\u00b0C, so 30 \u00b0C is not \"twice as hot\" as 15 \u00b0C). <b>Ratio</b>: true zero (seconds, humidity %).</p>`, interactive:"levels"},
    {id:"error", title:"Accuracy, precision, and error", html:`
     <p><b>Systematic error (bias)</b> pushes readings one way, such as a sensor in sunlight reading high. <b>Random error</b> scatters readings, such as electrical noise. <b>Accuracy</b> is closeness to the true value; <b>precision</b> is closeness of repeated readings to each other.</p>
     <div class="note"><b>Side-by-side test:</b> place your DHT22 next to another team's for 5 minutes, away from sun and boards. If averages differ by more than 1 \u00b0C, record the offset.</div>`},
    {id:"volume", title:"How much data? Sampling and volume", html:`
     <div class="formula">Rows per day = readings per send \u00d7 (86,400 \u00f7 interval in seconds)</div>
     <p>A Google Sheet holds up to 10 million cells. Use the calculator to see how long your plan would take to fill one.</p>`, interactive:"volume"},
    {id:"sheets", title:"Guided build: from Serial Monitor to Sheets", html:`
     <ol><li>Log P2 for 10 minutes with three events: cover the LDR, shine a flashlight, breathe on the DHT22.</li>
     <li>Paste into a new Sheet, then <b>Data \u2192 Split text to columns</b>. Delete rows starting with <code>#</code>.</li>
     <li>Add <code>time_s</code> with <code>=A2/1000</code>.</li>
     <li>Summarize: <code>=COUNT(B2:B)</code>, <code>=MAX(B2:B)</code>, <code>=MIN(B2:B)</code>, <code>=AVERAGE(B2:B)</code>, <code>=IF(D2>50,"Bright","Dark")</code>, <code>=COUNTIF(F2:F,"Bright")</code>.</li>
     <li>Insert a labeled line chart and write two sentences that mention a number.</li></ol>
     <p>Check your formula results against this sample dataset:</p>`, interactive:"sample"}
   ],
   quiz:[
    {q:"In a tidy dataset, a row is one\u2026", o:["Variable","Observation","Unit","Formula"], a:1, e:"Each row is one observation; each column is a variable."},
    {q:"Temperature in \u00b0C is which level of measurement?", o:["Nominal","Ordinal","Interval","Ratio"], a:2, e:"Equal gaps but no true zero."},
    {q:"A sensor next to a warm board always reads 1.2 \u00b0C high. This is\u2026", o:["Random error affecting precision","Systematic error affecting accuracy","No error","A logic error"], a:1, e:"Consistent one-direction error is bias; it hurts accuracy."},
    {q:"3 readings every 10 seconds produce how many rows per day?", o:["8,640","25,920","86,400","259,200"], a:1, e:"3 \u00d7 (86,400 \u00f7 10) = 25,920."},
    {q:"Which formula counts cells in F2:F that say Bright?", o:["=COUNT(F2:F)","=SUM(F2:F,\"Bright\")","=COUNTIF(F2:F,\"Bright\")","=IF(F2:F=\"Bright\")"], a:2, e:"COUNTIF counts cells matching a condition."}
   ],
   rating:["I can paste data into Sheets but need help with formulas and charts.","I can calculate MAX, MIN, AVERAGE and make a chart with help.","I can build the summary and a labeled chart alone and classify variables.","I can complete the Extension, explain error sources, and help others check formulas."],
   checkpoint:{code:"U1-O5, U1-O6", task:"Classify 4 variables, list error sources for your setup, and calculate rows per day for your plan.", met:"4 of 4 levels correct, 2+ error sources with fixes, correct rows per day.", upload:"Upload a screenshot (or exported file) of your Sheet showing formulas and a labeled chart."}
  }
 ]},

<script>
/* ============ INTERACTIVES ============ */
const INTERACTIVES = {
 iotflow(el){
  el.innerHTML = bench("See a reading travel through the system", `
   <svg viewBox="0 0 720 210" role="img" aria-label="IoT data flow diagram">
    ${[["Sensors","#2A9D8F"],["Board","#1F3A5F"],["Wi-Fi","#5B6B7F"],["Apps Script","#E76F51"],["Sheets","#C9A227"]].map((b,i)=>`
     <rect x="${10+i*142}" y="40" width="128" height="70" rx="10" fill="${b[1]}"/>
     <text x="${74+i*142}" y="80" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">${b[0]}</text>`).join("")}
    <circle id="pkt" cx="74" cy="140" r="9" fill="#E9C46A" opacity="0"/>
    <circle id="cmd" cx="642" cy="170" r="9" fill="#E76F51" opacity="0"/>
    <circle id="ledI" cx="216" cy="22" r="10" fill="#55606E"/><text x="236" y="27" font-size="13" fill="currentColor">LED</text>
   </svg>
   <div class="controls"><button class="btn primary" data-a="send">Send a reading</button><button class="btn" data-a="cmd">Send a command back</button></div>
   <div class="panel" aria-live="polite" id="flowMsg">Press "Send a reading" to follow one temperature value.</div>`);
  const steps = ["The DHT22 measures 29.4 \u00b0C (sensing layer).","The board reads the sensor and turns it into a number (edge device).","Wi-Fi carries an HTTPS request to the internet (network layer).","Apps Script checks and stores the reading (cloud processing).","The Sheet and dashboard show it to people (application layer)."];
  const pkt = $("#pkt",el), cmd = $("#cmd",el), msg = $("#flowMsg",el), led = $("#ledI",el);
  function move(dot, xs, y, texts, done){
   dot.setAttribute("opacity","1"); let i = 0;
   const go = () => { if (i >= xs.length){ done && done(); return; } dot.setAttribute("cx", xs[i]); dot.setAttribute("cy", y); msg.textContent = texts[i]; i++; setTimeout(go, reduceMotion()? 50 : 900); };
   go();
  }
  el.querySelector('[data-a="send"]').onclick = () => move(pkt,[74,216,358,500,642],140,steps);
  el.querySelector('[data-a="cmd"]').onclick = () => move(cmd,[642,500,358,216],170,["You tick \"LED on\" in the Sheet.","Apps Script prepares the command.","The command travels back over the network.","The board receives it and turns on the LED (actuator)."],() => { led.setAttribute("fill","#E9C46A"); setTimeout(()=>led.setAttribute("fill","#55606E"),2500); });
 },
 lifecycle(el){
  const S = [["Ask","What do we want to know, and why?","\"Is the window side warmer after lunch?\""],["Collect","How will we measure it?","Two sensors log every 30 s from 12:00 to 15:00."],["Clean","Can we trust the data?","Remove a duplicate row; flag a spike from a hand."],["Analyze","What patterns do we see?","The window side averaged 1.0 \u00b0C warmer."],["Act","What should happen because of it?","Switch on a fan above 32 \u00b0C."],["Share","How do we communicate it honestly?","A one-page data story with a chart and a limitation."]];
  const cols = ["#1F3A5F","#2A9D8F","#3D8361","#E76F51","#C2410C","#7C3AED"];
  el.innerHTML = bench("Tap each stage of the lifecycle", `
   <svg viewBox="0 0 360 300" style="max-width:380px;display:block;margin:auto" role="group" aria-label="Lifecycle stages">
    ${S.map((s,i)=>{const a=-Math.PI/2+i*Math.PI/3,x=180+110*Math.cos(a),y=150+110*Math.sin(a);return `<g tabindex="0" role="button" data-i="${i}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="38" fill="${cols[i]}"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="#fff" font-weight="700" font-size="15">${s[0]}</text></g>`}).join("")}
    <text x="180" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">IoT data lifecycle</text>
   </svg><div class="panel" id="lcMsg" aria-live="polite">Choose a stage to see its key question and an example.</div>`);
  el.querySelectorAll("g[data-i]").forEach(g => { const f = () => { const s = S[g.dataset.i]; $("#lcMsg",el).innerHTML = `<b>${s[0]}:</b> ${s[1]}<br><i>Example:</i> ${s[2]}`; }; g.onclick = f; g.onkeydown = e => { if (e.key==="Enter"||e.key===" ") f(); }; });
 },
 analytics(el){
  const Q = [["How many minutes was the room above 30 \u00b0C today?",0],["Did the temperature rise because the aircon was switched off?",1],["What will the temperature be at 2:00 PM?",2],["At what temperature should the fan turn on automatically?",3],["What was the brightest moment this morning?",0],["Will the back of the room be too dark for afternoon class?",2]];
  const T = ["Descriptive","Diagnostic","Predictive","Prescriptive"]; let i = 0, score = 0;
  el.innerHTML = bench("Classify the question", `<div class="panel"><p id="aq" style="font-weight:700"></p><div class="controls" id="ab"></div><div class="feedback" id="af"></div><div class="controls"><button class="btn small" id="an">Next question</button><span id="as" class="explain"></span></div></div>`);
  const show = () => { $("#aq",el).textContent = Q[i][0]; $("#af",el).textContent=""; $("#af",el).className="feedback"; $("#ab",el).innerHTML = T.map((t,k)=>`<button class="chip" data-k="${k}">${t}</button>`).join("");
   $("#ab",el).querySelectorAll("button").forEach(b => b.onclick = () => { const ok = +b.dataset.k === Q[i][1]; if (ok) score++; b.classList.add(ok?"ok":"no"); $("#af",el).textContent = ok ? "Correct." : "Not quite: this is " + T[Q[i][1]] + "."; $("#af",el).className = "feedback " + (ok?"ok":"no"); $("#ab",el).querySelectorAll("button").forEach(x=>x.disabled=true); $("#as",el).textContent = `Score: ${score}`; }); };
  $("#an",el).onclick = () => { i = (i+1) % Q.length; show(); }; show();
 },
 tracer(el){
  const code = ["int count = 0;","","void setup() {","  Serial.begin(115200);","  pinMode(LED_PIN, OUTPUT);","  Serial.println(\"Hello from my board!\");","}","","void loop() {","  digitalWrite(LED_PIN, HIGH);","  delay(500);","  digitalWrite(LED_PIN, LOW);","  delay(500);","  count = count + 1;","  Serial.print(\"Blink #\");","  Serial.println(count);","}"];
  const setupSeq = [3,4,5], loopSeq = [9,10,11,12,13,14,15];
  const explain = {3:"Opens serial at 115200 baud.",4:"Makes the LED pin an output.",5:"Prints the greeting once.",9:"LED on.",10:"Wait 0.5 s: nothing else can happen.",11:"LED off.",12:"Wait another 0.5 s.",13:"Add 1 to count.",14:"Print the label without a new line.",15:"Print count and start a new line."};
  el.innerHTML = bench("Step through P1 line by line", `<div class="tracer"><div class="panel lines" id="tl">${code.map((l,i)=>`<div data-l="${i}">${esc(l)||" "}</div>`).join("")}</div>
   <div class="panel"><div class="kv"><span>LED</span><span><span class="led" id="tled"></span></span><span>count</span><b id="tc">0</b><span>Time</span><b id="tt">0.0 s</b><span>Phase</span><b id="tp">not started</b></div>
   <p class="explain" id="tx">Press Step to run the next line.</p><div class="serial" id="ts" aria-label="Serial Monitor"></div></div></div>
   <div class="controls"><button class="btn primary" id="tstep">Step</button><button class="btn" id="tauto">Auto run</button><button class="btn" id="treset">Reset</button></div>`);
  let pos = -1, phase = "setup", count = 0, time = 0, timer = null;
  const serial = $("#ts",el);
  const out = s => { serial.textContent += s; serial.scrollTop = serial.scrollHeight; };
  function step(){
   let line;
   if (phase === "setup"){ pos++; if (pos >= setupSeq.length){ phase = "loop"; pos = 0; line = loopSeq[0]; } else line = setupSeq[pos]; }
   else { pos = (pos+1) % loopSeq.length; line = loopSeq[pos]; }
   el.querySelectorAll("#tl div").forEach(d => d.classList.toggle("hl", +d.dataset.l === line));
   if (line===5) out("Hello from my board!\n"); if (line===9) $("#tled",el).classList.add("on"); if (line===11) $("#tled",el).classList.remove("on");
   if (line===10||line===12) time += 0.5; if (line===13) count++; if (line===14) out("Blink #"); if (line===15) out(count+"\n");
   $("#tc",el).textContent = count; $("#tt",el).textContent = time.toFixed(1)+" s"; $("#tp",el).textContent = phase === "setup" ? "setup() runs once" : "loop() repeats"; $("#tx",el).textContent = explain[line];
  }
  $("#tstep",el).onclick = step;
  $("#tauto",el).onclick = () => { if (timer){ clearInterval(timer); timer=null; $("#tauto",el).textContent="Auto run"; } else { timer = setInterval(step, reduceMotion()?400:650); $("#tauto",el).textContent="Pause"; } };

<script>/* ============ v2 MOTION LAYER ============ */
const M = window.Motion || null;
const canAnim = () => !!(M && M.animate) && !reduceMotion();
const SPRING = {type:"spring", stiffness:320, damping:30};
function A(el, kf, opt){ if (!el || !canAnim()) return null; try { return M.animate(el, kf, opt || {duration:.45, ease:[.22,1,.36,1]}); } catch(e){ return null; } }
function stag(t, from){ return (M && M.stagger) ? M.stagger(t, from ? {startDelay:from} : undefined) : 0; }
function tween(from, to, ms, cb){
  if (reduceMotion()) { cb(to); return; }
  const t0 = performance.now();
  const step = now => { const p = Math.min(1, (now - t0) / ms), e = 1 - Math.pow(1 - p, 3); cb(from + (to - from) * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function tick(el, to, decimals, suffix){ tween(0, to, 1200, v => el.textContent = v.toFixed(decimals || 0) + (suffix || "")); }

/* toast stack */
window.toastStack = function(msg, kind){
  let box = $("#toasts"); if (!box){ box = document.createElement("div"); box.id = "toasts"; box.setAttribute("aria-live","polite"); document.body.appendChild(box); }
  const t = document.createElement("div"); t.className = "t-item " + (kind || "ok"); t.textContent = msg; box.appendChild(t);
  A(t, {opacity:[0,1], y:[24,0], scale:[.96,1]}, SPRING);
  setTimeout(() => { const a = A(t, {opacity:0, x:40}, {duration:.3}); setTimeout(() => t.remove(), a ? 320 : 0); }, 3000);
};

/* confetti burst */
function confetti(){
  if (reduceMotion()) return;
  let cv = $("#confetti"); if (!cv){ cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv); }
  const g = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#2A9D8F","#E9C46A","#E76F51","#1F3A5F","#9CC3E8"];
  const P = Array.from({length:140}, () => ({x:innerWidth/2, y:innerHeight*0.35, vx:(Math.random()-0.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+3, c:cols[Math.random()*5|0], a:Math.random()*6, va:(Math.random()-0.5)*0.3}));
  const t0 = performance.now();
  (function f(now){ const dt = (now - t0)/1000; g.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.vy += 0.35; p.x += p.vx; p.y += p.vy; p.a += p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle = p.c; g.globalAlpha = Math.max(0, 1 - dt/2.2); g.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6); g.restore(); });
    if (dt < 2.2) requestAnimationFrame(f); else g.clearRect(0,0,cv.width,cv.height); })(t0);
}

/* spotlight + tilt cards */
function spotify(root){
  root.querySelectorAll(".spot").forEach(el => {
    el.addEventListener("pointermove", e => {
      const r = el.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      el.style.setProperty("--mx", x + "px"); el.style.setProperty("--my", y + "px");
      if (e.pointerType === "mouse" && !reduceMotion()){ el.style.transition = "transform .08s"; el.style.transform = `perspective(900px) rotateX(${(0.5 - y/r.height)*5}deg) rotateY(${(x/r.width - 0.5)*6}deg)`; }
    });
    el.addEventListener("pointerleave", () => { el.style.transition = "transform .5s cubic-bezier(.22,1,.36,1)"; el.style.transform = ""; });
  });
}

/* reveal on scroll */
function reveal(nodes, opts){
  const list = [...nodes]; if (!canAnim() || !("IntersectionObserver" in window)) return;
  list.forEach(n => { n.style.opacity = 0; n.style.transform = "translateY(24px)"; });
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (!en.isIntersecting) return; io.unobserve(en.target);
    const a = A(en.target, {opacity:1, y:[24,0]}, Object.assign({duration:.6, ease:[.22,1,.36,1]}, opts||{}));
    if (!a){ en.target.style.opacity = ""; en.target.style.transform = ""; } }), {threshold:0.08});
  list.forEach(n => io.observe(n));
}

/* scroll progress bar */
addEventListener("scroll", () => { const b = $("#scrollbar"); if (!b) return; const h = document.documentElement; const p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight); b.style.transform = `scaleX(${p})`; }, {passive:true});

/* ============ RENDERING ============ */
function ring(pct, size){ size = size || 24; const r = size*0.375, c = 2*Math.PI*r, sw = size/8;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/><circle class="ring-fg" data-c="${c}" data-p="${pct}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--teal)" stroke-width="${sw}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="round"/></svg>`; }
function animateRings(root){ root.querySelectorAll(".ring-fg").forEach(c => { const C = +c.dataset.c, p = +c.dataset.p; if (!p) return; A(c, {strokeDashoffset:[C, C*(1-p)]}, {duration:1.1, ease:[.22,1,.36,1]}); }); }
function modulePct(m){ if (!m.sections) return 0; const total = m.sections.length + 1; let d = m.sections.filter(s => prog.done[m.id+":"+s.id]).length; if (prog.rating[m.id]) d++; return d/total; }

let pillTop = null;

    ${u.modules.map(m => u.locked ? `<span class="mod-link locked">${ring(0)}${esc(m.id)} ${esc(m.title)}</span>` :
      `<a class="mod-link ${cur===m.id?"active":""}" href="#/m/${m.id}">${ring(modulePct(m))}<span>${esc(m.id)} ${esc(m.title)}</span></a>`).join("")}</div>`).join("") +
    `<div class="map-foot"><a class="mod-link ${location.hash==="#/progress"?"active":""}" href="#/progress">My progress</a><a class="mod-link ${(!cur && location.hash!=="#/progress")?"active":""}" href="#/home">Course home</a></div>`;
  const act = $("#map .mod-link.active"), pill = $("#pill");
  if (act && pill){ const top = act.offsetTop, h = act.offsetHeight; pill.style.height = h + "px";
    if (pillTop != null && canAnim()) A(pill, {top:[pillTop + "px", top + "px"]}, SPRING); pill.style.top = top + "px"; pillTop = top; }
}
function renderWho(){ $("#who").textContent = user ? `${user.givenName || user.name} \u2022 ${user.role}` : ""; }

function startScope(){
  const cv = $("#scope"); if (!cv) return; const g = cv.getContext("2d"); const W = cv.width, H = cv.height;
  const pts = Array.from({length:180}, () => 52 + (Math.random()-0.5)*1.6); let shadow = 0, target = 0;
  const setT = ev => { const r = cv.getBoundingClientRect(); const cx = (ev.clientX - r.left)/r.width; target = cx > 0 && cx < 1 ? 1 : 0; };
  cv.addEventListener("pointermove", setT); cv.addEventListener("pointerdown", setT); cv.addEventListener("pointerleave", () => target = 0);
  function frame(){ if (!document.body.contains(cv)) return; shadow += (target - shadow) * 0.12;
   const v = 52 - 40*shadow + (Math.random()-0.5)*1.6; pts.push(v); if (pts.length > 180) pts.shift();
   g.clearRect(0,0,W,H); g.strokeStyle = "rgba(143,179,214,.16)"; g.lineWidth = 1; for (let k=1;k<4;k++){ g.beginPath(); g.moveTo(0,H*k/4); g.lineTo(W,H*k/4); g.stroke(); }
   const grad = g.createLinearGradient(0,0,W,0); grad.addColorStop(0,"rgba(233,196,106,.15)"); grad.addColorStop(1,"#E9C46A");
   g.strokeStyle = grad; g.lineWidth = 3; g.beginPath(); pts.forEach((p,i) => { const x = W - (pts.length-1-i)*(W/179), y = H - p/100*H; i ? g.lineTo(x,y) : g.moveTo(x,y); }); g.stroke();
   const lx = W, ly = H - pts[pts.length-1]/100*H; g.fillStyle = "#E9C46A"; g.beginPath(); g.arc(lx-4, ly, 6, 0, Math.PI*2); g.fill();
   const lab = $("#scopeVal"); if (lab) lab.textContent = v.toFixed(1)+" %";
   reduceMotion() ? setTimeout(() => requestAnimationFrame(frame), 250) : requestAnimationFrame(frame); }
  frame();
}

   <h2>Unit 1 modules</h2><div class="bento">
    ${mods.map(m => `<a class="spot mod-card span3" href="#/m/${m.id}"><span class="num">Module ${m.id} \u2022 ${m.minutes} min</span><h3>${esc(m.title)}</h3>

let pendingAnchor = null, currentSection = "";
function viewModule(id){

let device = "laptop";
function detectDevice(){
  const w = innerWidth, ua = navigator.userAgent, coarse = matchMedia("(pointer: coarse)").matches;
  const iPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const androidTablet = /Android/.test(ua) && !/Mobile/.test(ua);
  if (w < 600) return "phone";
  if (iPad || androidTablet) return "tablet";
  if (/iPhone|iPod|Android.+Mobile/.test(ua) && w < 950) return "phone";
  if (coarse && w <= 1366) return "tablet";
  return w < 1440 ? "laptop" : "desktop";
}
function applyDevice(){
  const d = detectDevice(), root = document.documentElement;
  root.dataset.orient = innerWidth > innerHeight ? "landscape" : "portrait";
  if (d === device && root.dataset.device) return;
  device = d; root.dataset.device = d;
  if (d !== "desktop") document.body.classList.remove("ai-docked");
  else if (aiOpen) document.body.classList.add("ai-docked");
}
addEventListener("resize", () => { clearTimeout(applyDevice.t); applyDevice.t = setTimeout(applyDevice, 150); });
