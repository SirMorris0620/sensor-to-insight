<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From Sensor to Insight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/motion@13/dist/motion.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --navy:#1F3A5F; --teal:#2A9D8F; --signal:#E76F51; --amber:#E9C46A;
  --bg:#F6F8FA; --surface:#FFFFFF; --line:#D7DEE6; --muted:#5B6B7F; --dot:#C9D3DE;
  --ok:#2A9D8F; --bad:#C2410C; --fs:1.0625rem;
  font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --ink:#E6EDF5; --navy:#9CC3E8; --bg:#0F1B2D; --surface:#16263D; --line:#2A3D57; --muted:#9FB0C4; --dot:#2A3D57;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--ink:#E6EDF5; --navy:#9CC3E8; --bg:#0F1B2D; --surface:#16263D; --line:#2A3D57; --muted:#9FB0C4; --dot:#2A3D57;}
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.6;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:var(--teal)}
button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-size:.88em}
h1,h2,h3{line-height:1.25;color:var(--ink)}
h1{font-size:2rem;margin:.2em 0 .4em}
h2{font-size:1.4rem;margin:1.8em 0 .5em}
h3{font-size:1.12rem;margin:1.4em 0 .4em}
p,li{max-width:72ch}

/* layout */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;
  padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.05rem;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.topbar .spacer{flex:1}
.who{color:var(--muted);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw}
.shell{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 58px)}
#map{border-right:1px solid var(--line);background:var(--surface);padding:16px 14px;overflow:auto}
#view{padding:28px clamp(16px,4vw,56px) 80px;min-width:0}
.btn.menu-btn{display:none}
.shell.noside{grid-template-columns:1fr}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  #map{position:fixed;inset:58px 0 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s}
  #map.open{transform:none}
  .btn.menu-btn{display:inline-flex}
  body.guest .btn.menu-btn{display:none}
  .who{display:none}
}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F1B2D}
.btn.small{padding:5px 10px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* course map */
.unit{margin-bottom:14px}
.unit-title{font-weight:700;font-size:.95rem;margin:10px 4px 6px;color:var(--ink)}
.unit-sub{font-size:.82rem;color:var(--muted);margin:-4px 4px 6px}
.mod-link{display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
.mod-link:hover{background:var(--bg)}
.mod-link.active{background:var(--bg);box-shadow:inset 3px 0 0 var(--teal)}
.mod-link.locked{color:var(--muted);pointer-events:none}
.ring{flex:none}
.map-foot{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:6px}

/* hero / welcome */
.welcome{display:grid;grid-template-columns:1.1fr 1fr;gap:36px;align-items:start;max-width:1150px}
@media (max-width:980px){.welcome{grid-template-columns:1fr}}
.welcome>*{min-width:0}
.scope{background:#0F1B2D;border-radius:14px;padding:18px 18px 12px;color:#CFE3F7;position:relative;overflow:hidden}
.scope canvas{width:100%;height:220px;display:block;touch-action:none;cursor:crosshair}
.scope .readout{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;font-size:.85rem;color:#8FB3D6;margin-top:6px}
.scope .hint{font-size:.9rem;color:#9FB0C4;margin:8px 0 0}
.hero-title{font-size:clamp(2.2rem,5vw,3.4rem);line-height:1.05;margin:18px 0 10px;letter-spacing:-.01em}
.hero-lede{font-size:1.15rem;color:var(--muted);max-width:52ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:700;font-size:.95rem}
.field input,.field select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row2>*{min-width:0}
.field input,.field select{width:100%;min-width:0}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.consent{font-size:.9rem;color:var(--muted);display:flex;gap:10px;align-items:flex-start;margin:6px 0 16px}
.consent input{margin-top:5px}
.err{color:var(--bad);font-size:.92rem;min-height:1.2em}

/* module */
.crumb{color:var(--muted);font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem;margin-bottom:10px}
.objectives{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 20px;margin:14px 0}
.objectives li{margin:4px 0}
.section{border-top:1px solid var(--line);padding-top:6px;margin-top:26px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{margin:.9em 0 .4em;flex:1;min-width:60%}
.sec-actions{display:flex;gap:8px}
.done-mark{color:var(--ok);font-weight:700;font-size:.92rem}
.note{border-left:4px solid var(--teal);background:var(--surface);padding:10px 16px;border-radius:0 8px 8px 0;margin:14px 0}
.note.warm{border-color:var(--signal)}
.formula{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;margin:12px 0;font-weight:700}
table.t{border-collapse:collapse;width:100%;margin:12px 0;font-size:.95rem;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--navy);color:#fff}
:root[data-theme="dark"] table.t th{color:#0F1B2D}
pre.code{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:12px 14px;overflow-x:auto;line-height:1.45}

/* bench = interactive panel with breadboard dot grid */
.bench{margin:18px 0;border:1px solid var(--line);border-radius:12px;padding:16px;
  background-color:var(--surface);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);background-size:18px 18px}
.bench-title{font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.bench-title svg{flex:none}
.bench .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.bench svg{max-width:100%;height:auto}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}
.controls label{font-size:.95rem}
input[type=range]{accent-color:var(--teal);flex:1 1 160px;max-width:320px;min-width:0}
.controls select{max-width:100%}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink)}
.chip.sel{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.no{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.4em;font-weight:700;margin-top:8px}
.feedback.ok{color:var(--ok)} .feedback.no{color:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.95rem}
.kv b{font-family:"JetBrains Mono",monospace}
.tracer{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media (max-width:760px){.tracer{grid-template-columns:1fr}}
.tracer .lines div{font-family:"JetBrains Mono",monospace;font-size:.82rem;padding:1px 8px;border-radius:4px;white-space:pre}
.tracer .lines div.hl{background:var(--amber);color:#14213D}
.led{width:28px;height:28px;border-radius:50%;background:#55606E;display:inline-block;vertical-align:middle;transition:background .1s}
.led.on{background:var(--amber);box-shadow:0 0 14px var(--amber)}
.serial{font-family:"JetBrains Mono",monospace;font-size:.82rem;background:#0F1B2D;color:#BFE3D9;border-radius:6px;padding:8px;height:120px;overflow:auto}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);width:0}

/* quiz, rating, upload */
.q{margin:14px 0 18px}
.q .opts{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.explain{font-size:.95rem;color:var(--muted);margin-top:6px}
.rating{display:flex;flex-direction:column;gap:8px}
.rating label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--teal)}
.drop input[type=file]{max-width:100%}
.uplist{font-size:.92rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:10px 18px;border-radius:8px;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:16px 0}
.stat{font-size:2rem;font-weight:700;color:var(--navy)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:420px;width:92vw}
dialog::backdrop{background:rgba(15,27,45,.5)}
.banner{background:var(--amber);color:#14213D;padding:8px 18px;font-size:.92rem}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
:root[data-motion="reduce"] *{transition:none!important;animation:none!important}
/* ===== v2: motion & component layer ===== */
.scrollbar{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--amber),var(--signal));transform-origin:0 50%;transform:scaleX(0);z-index:60}
.topbar{backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--surface) 82%,transparent)}
.kbd{font-family:"JetBrains Mono",monospace;font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
.search-btn{color:var(--muted);min-width:200px;justify-content:space-between}
@media (max-width:860px){.search-btn{min-width:0}.search-btn .lbl,.search-btn .kbd{display:none}}
@media (max-width:520px){.brand{font-size:.95rem;gap:6px}.brand svg{width:26px}.topbar{gap:8px;padding:10px 12px}body:not(.guest) .brand span{display:none}}

/* hero band */
.hero{position:relative;margin:-28px calc(-1*clamp(16px,4vw,56px)) 0;padding:56px clamp(16px,4vw,56px) 64px;
  background:#0E1A2B;color:#E6EDF5;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(156,195,232,.22) 1.2px,transparent 1.3px);background-size:22px 22px;z-index:-2;
  mask-image:radial-gradient(ellipse 80% 70% at 60% 40%,#000 40%,transparent 100%)}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;max-width:1240px;margin:0 auto}
@media (max-width:980px){.hero-grid{grid-template-columns:1fr}}
.hero-grid>*{min-width:0}
.beams{position:absolute;inset:0;z-index:-1;width:100%;height:100%;pointer-events:none}
.beams path{fill:none;stroke:rgba(156,195,232,.16);stroke-width:1.5}
.beams .pulse{stroke:url(#beamGrad);stroke-width:2.5;stroke-dasharray:60 900;animation:beam 5.5s linear infinite}
.beams .pulse:nth-of-type(2n){animation-duration:7s;animation-delay:-2s}
.beams .pulse:nth-of-type(3n){animation-duration:6.2s;animation-delay:-4s}
@keyframes beam{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
.hero h1{color:#fff;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.02;letter-spacing:-.02em;margin:0 0 18px}
.hero h1 .w{display:inline-block;will-change:transform}
.hero .lede{color:#B9CADD;font-size:1.18rem;max-width:50ch;margin:0 0 26px}
.tickers{display:flex;flex-wrap:wrap;gap:12px 30px;margin:0 0 30px}
.ticker b{display:block;font-size:2.1rem;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums}
.ticker span{color:#9FB0C4;font-size:.92rem}
.board-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.board-chip{border:1px solid rgba(156,195,232,.3);color:#CFE3F7;border-radius:999px;padding:5px 12px;font-size:.88rem;background:rgba(255,255,255,.03)}
.hero .scope{background:#08121F;border:1px solid rgba(156,195,232,.18);box-shadow:0 30px 80px -30px rgba(42,157,143,.45)}

/* shimmer button */
.shimmer{position:relative;isolation:isolate;overflow:hidden;border:0!important;background:var(--teal)!important;color:#08121F!important;font-weight:700;
  padding:12px 22px!important;border-radius:999px!important}
.shimmer::before{content:"";position:absolute;inset:-2px;z-index:-1;background:conic-gradient(from var(--a,0deg),transparent 0 70%,rgba(255,255,255,.85) 80%,transparent 90%);animation:spin 3s linear infinite}
.shimmer::after{content:"";position:absolute;inset:2px;border-radius:999px;background:var(--teal);z-index:-1}
@property --a{syntax:"<angle>";initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}

/* registration section */
.reg-wrap{max-width:1240px;margin:36px auto 0;display:grid;grid-template-columns:1fr 1.1fr;gap:36px;align-items:start}
@media (max-width:980px){.reg-wrap{grid-template-columns:1fr}}
.reg-wrap>*{min-width:0}
.how{display:flex;flex-direction:column;gap:14px}
.how-step{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.how-step i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-style:normal;font-weight:700;color:var(--teal)}

/* spotlight + tilt cards (bento) */
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin:18px 0 8px}
.bento .span2{grid-column:span 2}.bento .span3{grid-column:span 3}.bento .span4{grid-column:span 4}.bento .span6{grid-column:span 6}
@media (max-width:900px){.bento{grid-template-columns:repeat(2,1fr)}.bento>*{grid-column:span 2!important}}
.spot{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;transform-style:preserve-3d;will-change:transform}
.spot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--teal) 16%,transparent),transparent 45%)}
.spot:hover::before{opacity:1}
.spot .big{font-size:2.4rem;font-weight:700;line-height:1.05;color:var(--navy);font-variant-numeric:tabular-nums}
.spot .lbl{color:var(--muted)}
a.spot{display:block;color:inherit;text-decoration:none}
.mod-card h3{margin:.3em 0 .2em}
.mod-card .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.mod-card .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--amber))}
.mod-card .num{font-family:"JetBrains Mono",monospace;color:var(--muted);font-size:.85rem}
.continue{background:var(--navy);color:#fff;border-color:var(--navy)}
.continue .lbl,.continue h3{color:#fff}
:root[data-theme="dark"] .continue{background:#1D3A5C}

/* course map active pill */
@media (min-width:861px){#map{position:sticky;top:58px;height:calc(100vh - 58px);align-self:start}}
.pill{position:absolute;left:14px;right:14px;height:0;border-radius:8px;background:var(--bg);box-shadow:inset 3px 0 0 var(--teal);z-index:0;pointer-events:none}
.mod-link{position:relative;z-index:1}
.mod-link.active{background:transparent;box-shadow:none}

/* module layout with toc */
.mod-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:40px}
.mod-layout>*{min-width:0}
.tracer>*{min-width:0}
.tracer .lines{overflow-x:auto}
@media (max-width:1240px){.mod-layout{grid-template-columns:1fr}.toc{display:none}}
.toc{position:sticky;top:84px;align-self:start;font-size:.9rem;border-left:1px solid var(--line);padding-left:14px}
.toc b{display:block;margin-bottom:6px}
.toc a{display:block;color:var(--muted);text-decoration:none;padding:4px 0;transition:color .2s}
.toc a.on{color:var(--teal);font-weight:700}
.mod-hero{position:relative;padding:22px 24px;border-radius:16px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-bottom:8px}
.mod-hero h1{margin:.1em 0 .2em}
.mod-hero .ring-big{position:absolute;right:20px;top:20px}
@media (max-width:600px){.mod-hero .ring-big{display:none}}
.section{will-change:transform}
.done-btn.done{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok);font-weight:700}

/* quiz feedback motion hooks */
.opt{transition:border-color .2s,background .2s}

/* rating cards */
.rating label{transition:border-color .2s,transform .2s}
.rating label:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}

/* upload */
.drop{position:relative;overflow:hidden}
.drop .prog{position:absolute;left:0;bottom:0;height:4px;width:100%;background:linear-gradient(90deg,transparent,var(--teal),transparent);background-size:50% 100%;background-repeat:no-repeat;opacity:0}
.drop.busy .prog{opacity:1;animation:slide 1.1s linear infinite}
@keyframes slide{from{background-position:-50% 0}to{background-position:150% 0}}

/* toast stack */
#toasts{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;gap:8px;z-index:70;max-width:min(380px,calc(100vw - 36px))}
.t-item{background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 12px 30px -12px rgba(0,0,0,.45);display:flex;gap:10px;align-items:center}
:root[data-theme="dark"] .t-item{background:#24476E}
.t-item.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.t-item.warn{background:var(--signal)}

/* command palette */
#palette{padding:0;max-width:560px;top:12vh;margin:0 auto;position:fixed}
#palette input{width:100%;border:0;border-bottom:1px solid var(--line);padding:16px 18px;font-size:1.05rem;background:transparent;color:var(--ink);outline:none}
#palList{max-height:50vh;overflow:auto;padding:6px}
#palList a{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:8px;color:var(--ink);text-decoration:none}
#palList a.sel{background:var(--bg);box-shadow:inset 3px 0 0 var(--teal)}
#palList small{color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:80}
/* ===== v3: sign-up, devices, AI assistant ===== */
[hidden]{display:none!important}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px}
.seg button,.seg label{flex:1;text-align:center;border:0;background:transparent;color:var(--muted);padding:9px 10px;border-radius:7px;cursor:pointer;font-weight:700}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg-sm{margin:4px 0 0}

#aiChips{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 0;scrollbar-width:none}

.sort-item .grip{color:var(--muted);margin-left:auto;order:2}

.dots{display:flex;gap:6px;justify-content:center;margin-bottom:10px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}
.deck{display:flex;justify-content:center;min-height:120px}
.qcard{max-width:460px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;font-size:1.1rem;font-weight:700;text-align:center;
  box-shadow:0 14px 30px -18px rgba(0,0,0,.35);cursor:grab;touch-action:none;user-select:none}
.qcard mark{background:var(--amber);color:#14213D;border-radius:4px;padding:0 3px}
.dragging{cursor:grabbing!important;z-index:20;position:relative}
.buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}

.bucket{position:relative;display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;border:2px dashed var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px;cursor:pointer;min-height:84px;transition:border-color .2s,background .2s}

.bucket.hover,.lvl.hover{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--surface))}

.tracer .lines{position:relative}

.boardviz{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.strip{display:flex;gap:2px;height:16px;margin:8px 0;overflow:hidden}
.strip i{flex:0 0 10px;background:#55606E;border-radius:2px;transform-origin:bottom}.strip i.on{background:#E9C46A}
.predict label{display:flex;align-items:center;gap:6px}
.mark{display:inline-block;width:18px;font-weight:700}.mark.ok{color:var(--ok)}.mark.no{color:var(--bad)}
.circuit{max-width:300px;display:block;margin:auto}

.kv.big b{font-size:1.25rem}

.adcv{height:260px;cursor:ew-resize}.race{height:170px}.samplec{height:240px;cursor:crosshair}
.pressbtn{font-size:1.05rem;padding:12px 22px;border-radius:999px;border-width:2px}

.dragchip{touch-action:none;user-select:none;cursor:grab}
.lvl-buckets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}

#sser .chip.sel{box-shadow:0 0 0 2px var(--c) inset;border-color:var(--c)}

.gs-c.sel{outline:2px solid #1A73E8;outline-offset:-2px;background:#E8F0FE}

.gs .illus{padding:0 10px 6px;background:#F8F9FA;margin:0;color:#5F6368}
.csvflow{display:grid;grid-template-columns:1fr auto 1.4fr;gap:12px;align-items:center}
.csvflow>*{min-width:0}.arrowbig{font-size:2rem;color:var(--teal)}
@media (max-width:760px){.csvflow{grid-template-columns:1fr}.arrowbig{transform:rotate(90deg);text-align:center}}
.fanat{display:flex;justify-content:center;gap:2px;font-family:"JetBrains Mono",monospace;font-size:1.5rem;margin:12px 0;flex-wrap:wrap}
.fanat span{padding:4px 8px;border-radius:6px}.f-eq{background:#FDE68A;color:#14213D}.f-fn{background:#BFDBFE;color:#14213D}.f-rg{background:#BBF7D0;color:#14213D}.f-p{color:var(--muted)}
.targets circle{transition:transform .3s}
.qexp{margin-top:8px;padding:10px 12px;border-radius:8px;font-size:.95rem;display:none}
.qexp.ok,.qexp.no{display:block}.qexp.ok{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border:1px solid var(--ok)}
.qexp.no{background:color-mix(in srgb,var(--bad) 7%,var(--surface));border:1px solid var(--bad)}
.qexp .why{display:inline}
.refs{font-size:.9rem;padding-left:1.4em}.refs li{margin:6px 0;max-width:none;overflow-wrap:anywhere}.refs a{color:var(--teal)}
.afb.ok{border-color:var(--ok)}.afb.no{border-color:var(--bad)}
/* sandbox */
.sb-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.sb-tabs{margin:0;flex:1;min-width:0}

a.btn{text-decoration:none}
.sb-task{margin-bottom:10px}.sb-task p{margin:.3em 0}
.sb-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
@media (max-width:980px){.sb-main{grid-template-columns:1fr}}
:root[data-device="phone"] .sb-main,:root[data-device="tablet"][data-orient="portrait"] .sb-main{grid-template-columns:1fr}
.sb-edhead{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);padding:0 2px 4px}
.sb-code{width:100%;min-height:300px;font-family:"JetBrains Mono",monospace;font-size:.85rem;line-height:1.5;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0F1B2D;color:#E2E8F0;resize:vertical;tab-size:4}
.sb-msg{min-height:1.4em;font-size:.95rem;margin-top:6px}.sb-msg.ok{color:var(--ok);font-weight:700}.sb-msg.no{color:var(--bad)}
.sb-msg ul{margin:.3em 0;padding-left:1.2em;color:var(--ink)}
.sb-board-viz{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px}
.sbviz{width:100%;height:auto;display:block}.sbb{fill:#1F3A5F}
.sbled{fill:#55606E;transition:fill .08s}.sbled.on{fill:#E9C46A;filter:drop-shadow(0 0 10px #E9C46A)}
.sbldr{transition:fill .2s;stroke:#7C2D12;stroke-width:2}
.sb-timeline{width:100%;height:90px;display:block;margin:8px 0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.sb-serial{height:140px}
.sb-results{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:6px}
.sb-results li{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);max-width:none}
.sb-results li.ok{border-color:var(--ok)}.sb-results li.ok b{color:var(--ok)}.sb-results li.no{border-color:var(--bad)}.sb-results li.no b{color:var(--bad)}
/* wiring */
.wiring{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.wiring .bb{fill:#F1F5F9;stroke:#CBD5E1}.wiring .bbgap{fill:#E2E8F0}
:root[data-theme="dark"] .wiring .bb{fill:#E5E9EF}
.wiring .w{fill:none;stroke-width:4.5;stroke-linecap:round}
.wiring .w.new{filter:drop-shadow(0 0 4px rgba(233,196,106,.9))}
.wiring .part{opacity:0;transition:opacity .3s}.wiring .part.on{opacity:1}
.wiring .wpin circle{fill:#E9C46A;stroke:#14213D;stroke-width:1.5}
.wiring .wpin.pulse circle{animation:pinpulse 1s ease-in-out infinite}
@keyframes pinpulse{50%{r:11px;fill:#F97316}}
.wled.lit{fill:#F87171;filter:drop-shadow(0 0 10px #EF4444)}
.wstep p{margin:.3em 0 0}
/* ai verify */
.aiv{display:grid;gap:8px}.aiv-row{display:grid;grid-template-columns:28px 2fr 1fr 1.6fr;gap:8px;align-items:center}
.aiv-row input,.aiv-row select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.aiv-n{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.85rem}
@media (max-width:760px){.aiv-row{grid-template-columns:28px 1fr}.aiv-row select,.aiv-row .aivR{grid-column:2}}
/* badges */
.badge-svg.earned{filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}.badge-svg.locked{opacity:.75}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin:16px 0}
.badge-card{display:flex;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.badge-card.earned{border-color:#E9C46A;background:linear-gradient(135deg,color-mix(in srgb,#E9C46A 14%,var(--surface)),var(--surface))}
.badge-card h3{margin:.1em 0}.badge-card p{margin:.2em 0 0}
#badgeDlg{max-width:440px;text-align:center}.badge-pop h2{margin:.2em 0}.badge-big{display:flex;justify-content:center;margin:6px 0}
.mini-badges{display:flex;gap:2px;margin-top:8px;flex-wrap:wrap}.mini-row{display:flex;gap:8px;flex-wrap:wrap}
.mapicon{width:24px;text-align:center;color:var(--teal);flex:none}
/* survey */
.survey .lk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--surface)}
.survey legend{font-weight:700;padding:0 4px}
.lk-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:6px}
.lk-opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer;font-size:.9rem}
.lk-opts label:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 12%,var(--surface));font-weight:700}
.survey textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
/* overview */
.ov-hero{padding:24px;border-radius:16px;background:linear-gradient(135deg,#0E1A2B,#1F3A5F);color:#E6EDF5;margin-bottom:10px}
.ov-hero h1{color:#fff;font-size:clamp(2rem,4.5vw,3rem);margin:.1em 0}.ov-hero .crumb{color:#9FB0C4}.lede2{color:#E9C46A;font-weight:700;margin:0 0 10px}
.ov-hero p{color:#C9D6E6}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:14px 0}
@media (max-width:900px){.journey{grid-template-columns:repeat(2,1fr)}}
.jstep{border-top:6px solid var(--c);background:var(--surface);border-radius:10px;padding:10px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.jday{font-size:.8rem;color:var(--muted)}.jstep span:last-child{font-size:.88rem}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.comp{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}.comp p{margin:.3em 0 0}
.ccode{display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:1px 8px;font-size:.8rem;font-weight:700;margin-right:6px}
.kolb{max-width:320px;width:100%}.kspin{transform-origin:160px 150px;animation:spin360 30s linear infinite}
.lc-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0}
.lc-chip{background:var(--teal);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700}.lc-arr{color:var(--muted)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.rule{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface)}
.rule b{width:28px;height:28px;border-radius:50%;background:var(--amber);color:#14213D;display:grid;place-items:center;flex:none}
/* collapsible sidebar */
.btn.side-btn{display:inline-flex}
@media (min-width:861px){body.side-collapsed .shell{grid-template-columns:0 1fr}body.side-collapsed #map{visibility:hidden;padding:0;overflow:hidden;border:0}}
@media (max-width:860px){.btn.side-btn{display:none}}
.shell{transition:grid-template-columns .3s ease}
:root[data-device="phone"] .btn.side-btn{display:none}
/* v6: test styles + fixes */
.test-rules{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.test-rules div{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);text-align:center}
.test-rules b{display:block;font-size:1.6rem;color:var(--navy)}.test-rules span{color:var(--muted);font-size:.9rem}
.test-bar{position:sticky;top:58px;z-index:12;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:10px 14px;margin:-8px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 18px -14px rgba(0,0,0,.4)}
.test-bar .t-timer{margin-left:auto;font-family:"JetBrains Mono",monospace;font-weight:700}.t-timer.low{color:var(--bad)}
.t-count{color:var(--muted)}
.t-nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.t-nav a{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;font-size:.8rem;color:var(--ink);text-decoration:none;background:var(--surface)}
.t-nav a.done{background:var(--teal);color:#fff;border-color:var(--teal)}
.t-part{margin-top:1.4em}
.t-q{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px;background:var(--surface);scroll-margin-top:140px}
.t-q legend{font-weight:700;padding:0 4px;max-width:72ch}
.t-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-size:.8rem;margin-right:6px}
.t-q label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.t-q label:hover{background:var(--bg)}.t-q label:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 10%,var(--surface))}
.t-l{font-weight:700;color:var(--muted);width:16px}
.mod-link.gated{opacity:.6}
/* v7: long question text inside boxes (pre/post test, survey) */
.t-q legend,.survey .lk legend{float:left;width:100%;padding:0;margin:0 0 10px;line-height:1.45;overflow-wrap:anywhere}
.t-q legend+*,.survey .lk legend+*{clear:both}
.t-q label{clear:both}
.t-q legend code{white-space:normal;overflow-wrap:anywhere}
/* DHT22 explorer */
.photo2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo2 img{width:100%;height:auto;border-radius:10px;display:block;background:#fff}
@media (max-width:600px){.photo2{grid-template-columns:1fr}}
.dhtmode{margin-bottom:10px}
.dhtmode button{white-space:normal}
.dhtsvg{width:100%;max-width:320px;display:block;margin:auto}
.dpin{cursor:pointer;transform-box:fill-box;transform-origin:center}.dpin.on circle{stroke:#F97316;stroke-width:4}
.cap{width:100%;display:block;margin:6px 0}
.frame{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:10px 0;min-height:10px}
@media (max-width:600px){.frame{grid-template-columns:repeat(10,1fr)}}
.bit{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:.8rem;text-align:center;border-radius:4px;padding:3px 0;color:#14213D}
.bh{background:#BFDBFE}.bt{background:#FECACA}.bc{background:#BBF7D0}
.lg{display:inline-block;border-radius:4px;padding:0 6px;color:#14213D;font-size:.85rem;margin-right:4px}
/* breadboard explorer */
.bbsvg{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.bbsvg .hole{fill:#9CA3AF;cursor:pointer;transition:fill .15s}
.bbsvg .hole:hover{fill:#64748B}
.bbsvg .hole.lit{fill:#2A9D8F}.bbsvg .hole.sel{fill:#E76F51}
.bbsvg .hole.ask{fill:#F59E0B;stroke:#B45309;stroke-width:1.5}
.bbsvg .clip{fill:#E9C46A;opacity:.55}
.chk input[type=checkbox]+span{display:inline-block}
/* v8: sandbox attempts, choice, walkthrough, plan */
.sb-plan{margin-top:8px}.sb-plan summary{cursor:pointer;font-weight:700;color:var(--teal)}.sb-plan ol{margin:.4em 0}
.sb-choice{margin-top:10px;padding:12px 14px;border-radius:12px;border:2px solid var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--surface))}
.sb-choice p{margin:.3em 0}
.sb-sertools{margin:6px 0 0}
.sb-walk{margin-top:16px;border:2px solid var(--teal);border-radius:14px;padding:14px 16px;background:var(--surface)}
.walk-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.walk-dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.walk-dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:700}
.walk-dots button.past{background:color-mix(in srgb,var(--teal) 25%,var(--surface))}.walk-dots button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.walk-body h3{margin:.2em 0 .4em}
.edp{width:100%;max-width:360px;display:block;margin:auto}.edp .orbit{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:4 6}
.edp .stage{cursor:pointer;transform-box:fill-box;transform-origin:center;transition:opacity .25s}.edp .stage.dim{opacity:.4}.edp .stage:focus{outline:none}
.dataflow{width:100%}
.checklist{list-style:none;padding-left:0}.checklist li{margin:4px 0}
/* v9: programming explainers and drills */
.vtmem{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.vbox{display:flex;flex-direction:column;align-items:center;min-width:76px;border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--bg)}
.vbox.const{border-style:dashed;border-color:var(--navy)}.vbox.chg{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 18%,var(--surface))}
.vname{font-size:.75rem;color:var(--muted);font-family:"JetBrains Mono",monospace}.vval{font-size:1.15rem;font-weight:700;font-family:"JetBrains Mono",monospace}
.vval.ledon{color:#B45309}.vval.ledoff{color:var(--muted)}
.hlbar.warn{background:#FCA5A5}
.dq{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;background:var(--surface)}
.dq pre.code{margin:8px 0}
.dinput{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:160px}
.parsons .sort-item{font-weight:400}.parsons .sort-item code{white-space:pre;font-size:.85rem}
.clcode{overflow-x:auto}
.clcode div{font-family:"JetBrains Mono",monospace;font-size:.85rem;padding:2px 8px;border-radius:4px;white-space:pre;transition:background .2s,opacity .2s}
.clcode div.act{background:color-mix(in srgb,var(--amber) 40%,transparent)}.clcode div.skip{opacity:.45}
.lmchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.lmbox{min-width:90px}
.plrow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:4px 0}.plrow select{padding:2px 4px}
.ldrart,.ldrin{width:100%;height:auto;display:block}
.ldrin .pl{animation:fall 1s linear infinite}@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(26px);opacity:0}}
.ldrin .el{animation:jig .9s ease-in-out infinite alternate}@keyframes jig{to{transform:translateX(8px)}}
.video2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:760px){.video2{grid-template-columns:1fr}}
.vtl,.cll{margin-bottom:8px}.vtl button,.cll button{white-space:normal}
</style>

<script>
/* ============ CONFIG ============ */
const CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbz2UHq4LJScfjOKPIyygvtdF4sgerboY5WfYtGFrx0DnP9JdaogMXwOysUoDO5ERtYp/exec",   // ends with /exec
  HEARTBEAT_SECONDS: 60,
  IDLE_MINUTES: 5,
  MAX_UPLOAD_MB: 10,
  AI_MIN_AGE: 0           // 0 = no age limit; keep the same as AI_MIN_AGE in Code.gs
};

/* ============ STORAGE (safe) ============ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let user = store.get("sti_user", null);
const pkey = () => "sti_prog_" + (user ? user.email : "guest");
let prog = store.get(pkey(), {done:{}, quiz:{}, rating:{}, uploads:[], minutes:0});
function saveProg(){ store.set(pkey(), prog); }
const sessionId = Math.random().toString(36).slice(2) + Date.now().toString(36);

/* ============ API with offline queue ============ */
const apiReady = () => /^https:\/\/script\.google\.com\//.test(CONFIG.API_URL);
async function api(action, data, queueIfFail = true){
  if (!user || !apiReady()) return {ok:false, offline:true};
  const body = JSON.stringify(Object.assign({action, email:user.email, sessionId}, data));
  try{
    const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body});
    return await r.json();
  }catch(e){
    if (queueIfFail && action !== "upload"){ const q = store.get("sti_queue", []); q.push(body); store.set("sti_queue", q.slice(-200)); }
    return {ok:false, error:"network"};
  }
}
async function flushQueue(){
  if (!apiReady()) return;
  const q = store.get("sti_queue", []); if (!q.length) return;
  store.set("sti_queue", []);
  for (const body of q){
    try{ await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body}); }
    catch(e){ const r = store.get("sti_queue", []); r.push(body); store.set("sti_queue", r); }
  }
}
let evBuffer = [];
function logEvent(moduleId, itemId, type, value){
  evBuffer.push({ts:Date.now(), moduleId, itemId, type, value});
  clearTimeout(logEvent.t); logEvent.t = setTimeout(sendEvents, 1500);
}
function sendEvents(){ if (!evBuffer.length) return; const events = evBuffer; evBuffer = []; api("event", {events}); }

/* ============ ACTIVE-TIME TRACKER ============ */
let lastActive = Date.now(), currentModule = "";
["pointerdown","keydown","scroll","touchstart"].forEach(ev => addEventListener(ev, () => lastActive = Date.now(), {passive:true}));
setInterval(() => {
  if (!user || document.visibilityState !== "visible") return;
  if (Date.now() - lastActive > CONFIG.IDLE_MINUTES * 60000) return;
  const m = CONFIG.HEARTBEAT_SECONDS / 60;
  prog.minutes = (prog.minutes || 0) + m; saveProg();
  api("heartbeat", {minutes:m, moduleId:currentModule});
}, CONFIG.HEARTBEAT_SECONDS * 1000);
setInterval(flushQueue, 120000);
addEventListener("online", flushQueue);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") sendEvents(); });

/* ============ HELPERS ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(msg, kind){ if (window.toastStack) return window.toastStack(msg, kind); }
function speak(text){
  if (!("speechSynthesis" in window)) { toast("Read-aloud is not supported on this browser."); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); u.rate = Number(store.get("sti_voice", 1)); u.lang = "en-US";
  speechSynthesis.speak(u);
}
const reduceMotion = () => store.get("sti_motion","full") === "reduce" || matchMedia("(prefers-reduced-motion: reduce)").matches;
const ICON = `<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="5" cy="5" r="1.6" fill="#2A9D8F"/><circle cx="13" cy="5" r="1.6" fill="#2A9D8F"/><circle cx="5" cy="13" r="1.6" fill="#2A9D8F"/><circle cx="13" cy="13" r="1.6" fill="#E76F51"/><path d="M5 5 H13 V13" stroke="#2A9D8F" stroke-width="1.4" fill="none"/></svg>`;
function bench(title, inner){ return `<div class="bench"><p class="bench-title">${ICON}${esc(title)}</p>${inner}</div>`; }
</script>

const ex = (t, h) => `<div class="callout ex"><b>Worked example: ${t}</b>${h}</div>`;
const mis = h => `<div class="callout mis"><b>Common mistake</b>${h}</div>`;
const tip = (t, h) => `<div class="callout tip"><b>${t}</b>${h}</div>`;
const tryit = h => `<div class="callout try"><b>Try it</b>${h}</div>`;

const fig = (inner, cap, credit) => `<figure class="fig">${inner}<figcaption>${cap}${credit ? ` <span class="credit">${credit}</span>` : ""}</figcaption></figure>`;
const code = (lang, src, title) => `<div class="codebox"><div class="codehead"><span>${title || lang}</span><button class="btn small copybtn" type="button">Copy</button></div><pre class="code"><code>${esc(src.replace(/^\n/, ""))}</code></pre></div>`;
/* annotated code: lines = [[code, note], ...]; note may be "" */
function anat(title, lines){
  let n = 0; const rows = lines.map(([c, note]) => { const k = note ? ++n : 0; return `<div class="aline${k ? " has" : ""}" ${k ? `data-n="${k}"` : ""}><span class="amark">${k || ""}</span><code>${esc(c) || " "}</code></div>`; }).join("");
  let m = 0; const notes = lines.filter(l => l[1]).map(l => `<li data-n="${++m}"><b>${m}.</b> ${l[1]}</li>`).join("");
  return `<div class="anat"><div class="anat-title">${title} <span class="explain">Tap a numbered line to see what it does.</span></div><div class="anat-code">${rows}</div><ol class="anat-notes">${notes}</ol></div>`;
}
/* Google Sheets mock-up */
function sheet(o){
  const cols = o.headers.length, letters = "ABCDEFGHIJ".slice(0, cols).split("");
  const cell = (r, c) => o.sel === (letters[c] + (r + 1)) ? " sel" : "";
  return `<div class="gs"><div class="gs-bar"><span class="gs-name">${o.cellname || o.sel || "A1"}</span><span class="gs-fx">fx</span><span class="gs-formula">${esc(o.formula || "")}</span></div>
   <div class="gs-grid" style="grid-template-columns:34px repeat(${cols},minmax(70px,1fr))"><div class="gs-h"></div>${letters.map(l => `<div class="gs-h">${l}</div>`).join("")}
   <div class="gs-r">1</div>${o.headers.map((h, c) => `<div class="gs-c head${cell(0, c)}">${esc(h)}</div>`).join("")}
   ${o.rows.map((row, r) => `<div class="gs-r">${r + 2}</div>${row.map((v, c) => `<div class="gs-c${cell(r + 1, c)}${typeof v === "number" ? " num" : ""}">${esc(v)}</div>`).join("")}`).join("")}</div>
   ${o.note ? `<p class="gs-note">${o.note}</p>` : ""}<p class="illus">Illustration of Google Sheets</p></div>`;
}

   <ol class="ide-key"><li><b>Verify (\u2713)</b> checks your code for syntax errors without uploading.</li><li><b>Upload (\u2192)</b> compiles the code and sends it to the board.</li><li><b>Board and port</b>: choose your exact board and its USB port before uploading.</li><li><b>Serial Monitor</b> opens the text window where Serial.print() appears. Set it to 115200 baud.</li><li>The <b>Output</b> panel shows errors (in orange) or "Done uploading."</li></ol><p class="illus">Illustration of Arduino IDE 2</p></div>`;
}

  return `<svg viewBox="0 0 ${w + 20} ${h + 30}" class="boardart" role="img" aria-label="${B[1]} illustration"><rect x="10" y="0" width="${w}" height="${h}" rx="8" fill="${B[0]}"/>${pins(kind === "uno" ? 14 : 15)}
   <rect x="${kind === "uno" ? 0 : 0}" y="${h / 2 - 10}" width="22" height="20" rx="3" fill="#B0B8C4"/><rect x="${w / 2 - 15}" y="${h / 2 - 15}" width="30" height="30" rx="3" fill="#0B1220"/>
   ${kind === "esp32" || kind === "esp8266" ? `<rect x="${w - 50}" y="${h / 2 - 16}" width="44" height="32" rx="2" fill="#9CA3AF"/>` : ""}${kind === "pico" ? `<rect x="${w - 46}" y="${h / 2 - 12}" width="30" height="24" rx="2" fill="#C0C7D0"/>` : ""}
   <circle cx="${w - 14}" cy="14" r="4" fill="#E9C46A"/><text x="${10 + w / 2}" y="${h + 22}" text-anchor="middle" font-size="12" fill="currentColor" font-weight="700">${B[1]}</text></svg>`;
}

const COURSE = [
 {id:"u1", title:"Unit 1: Sensors and programming foundations", sub:"Open now", modules:[
  {id:"1.1", title:"Launch and the IoT data lifecycle", minutes:90,
   objectives:["Define the Internet of Things and identify its layers in our course system.","Explain the six stages of the IoT data lifecycle using a classroom example (U1-O1).","Distinguish the four types of analytics and classify questions by type (U1-O1).","Write a data question your sensors can actually answer.","Describe the human role when AI can write code."],
   sections:[
    {id:"hook", title:"Which spot in this room is best for studying?", html:`
     <p>Look around the room. Where would you sit to study for two hours: near the window, near the door, or in the middle? Write your guess and <b>one reason</b> before reading on.</p>
     <p>Most people answer from feeling: "the window side feels hot," "the back is too dark." Feelings matter, but they are hard to compare and easy to argue about. Two classmates can feel the same room differently. In this course you will answer questions like this with <b>evidence</b>: measurements you collect, clean, analyze, and present yourself.</p>
     <h3>Why this matters: the April 2024 heat</h3>
     <p>In April 2024, extreme heat disrupted classes across the Philippines. On April 5, <b>5,288 public schools</b> suspended in-person classes, affecting about <b>3.6 million students</b>; by April 11 the number had risen to <b>5,844 of 47,678 public schools</b>. On April 29\u201330, DepEd moved <b>all public schools</b> nationwide to asynchronous or distance learning because of the heat index forecast and a transport strike.</p>
     <p>These decisions were based on <b>data</b>: PAGASA's heat index forecasts, which combine air temperature and humidity into one "feels like" number. Some local governments even set rules such as "suspend in-person classes automatically when the forecast heat index reaches 40 \u00b0C." That is exactly the kind of system you will learn to build: measure \u2192 decide \u2192 act.</p>
     <div class="newscard"><div><b>News report</b><p>Watch Bloomberg's video report on the April 2024 Philippine heat wave, or read the DepEd suspension report.</p></div><div class="controls"><a class="btn" href="${REF.bloomberg[1]}" target="_blank" rel="noopener">Watch the report</a><a class="btn" href="${REF.rappler[1]}" target="_blank" rel="noopener">Read the article</a></div></div>
     <div data-video></div>
     ${tryit(`<p>The heat index uses <b>two</b> measurements. Which two sensors in your kit could you use to estimate a heat index for your own classroom? (Answer: temperature and humidity, both measured by the DHT22.)</p>`)}
     ${srcs([["Philstar, Apr 12, 2024", REF.philstar[1]],["Rappler, Apr 28, 2024", REF.rappler[1]],["Inquirer, Apr 4, 2024", REF.inquirer[1]],["PAGASA heat index", REF.pagasa[1]]])}`},
    {id:"iot", title:"What is the Internet of Things?", html:`
     <p>The <b>Internet of Things (IoT)</b> is a network of physical objects that <b>sense</b> the world, <b>process</b> the measurements, and <b>exchange</b> data over the internet so that people or machines can act on it. In plain words: a <i>thing</i> measures something, sends the data somewhere useful, and something or someone responds.</p>
     <p>You already live with IoT: a smart electric meter that reports usage, a weather station that uploads readings every few minutes, a delivery app that tracks a rider's GPS, or a water-level sensor that warns a barangay when a river rises.</p>
     <h3>The layers of an IoT system</h3>
     <p>Engineers describe IoT systems in <b>layers</b>. Each layer has one job and passes its result to the next.</p>
     ${fig(`<svg class="layers" viewBox="0 0 640 300" role="img" aria-label="IoT layers diagram">${[["Application","Sheets, dashboards, alerts: people see and decide","#C9A227"],["Processing","Apps Script checks, stores, and summarizes","#E76F51"],["Network","Wi-Fi and the internet carry the data (HTTPS)","#5B6B7F"],["Edge device","The board reads sensors and runs your program","#1F3A5F"],["Sensing / actuating","Sensors measure; actuators (LED, fan) act","#2A9D8F"]].map((l,i)=>`<g class="layer" style="--d:${i}"><rect x="${20+i*8}" y="${14+i*56}" width="${600-i*16}" height="46" rx="10" fill="${l[2]}"/><text x="${36+i*8}" y="${42+i*56}" fill="#fff" font-weight="700" font-size="15">${l[0]}</text><text x="252" y="${42+i*56}" fill="#fff" font-size="13">${l[1]}</text></g>`).join("")}</svg>`, "Figure 1.1. The five layers of our course IoT system. Data flows up; commands flow down.", "Simplified from the layered IoT architectures reviewed by Al-Fuqaha et al. (2015).")}
     <p>Two words appear everywhere in this course. A <b>sensor</b> turns a physical quantity (temperature, light) into an electrical signal. An <b>actuator</b> does the opposite: it turns an electrical signal into action, such as lighting an LED, sounding a buzzer, or spinning a fan.</p>
     ${ex("tracing one reading", `<p>At 1:00 PM the DHT22 measures 31.6 \u00b0C (<i>sensing</i>). The ESP32 reads it and builds a message (<i>edge</i>). Wi-Fi sends it to Google (<i>network</i>). Apps Script checks it is a sensible number and stores it with a timestamp (<i>processing</i>). Your Sheet shows it on a chart, and a teacher decides to open the windows (<i>application</i>). If the system also switches on a fan automatically, the fan is an <i>actuator</i>.</p>`)}
     <p>Use the explorer below: send a reading, then turn on the live stream and raise the temperature above 31 \u00b0C.</p>`, interactive:"iotflow"},
    {id:"lifecycle", title:"The IoT data lifecycle", html:`
     <p>Collecting numbers is only the beginning. Data becomes useful when it moves through a full cycle, from a question to an action. This course uses six stages:</p>
     <table class="t"><tr><th>Stage</th><th>Key question</th><th>What you do in this course</th></tr>
     <tr><td>1. Ask</td><td>What do we want to know, and why?</td><td>Write a specific, measurable question (later in this module)</td></tr>
     <tr><td>2. Collect</td><td>How will we measure it?</td><td>Wire sensors and program the board (Modules 1.2\u20131.3, Unit 2)</td></tr>
     <tr><td>3. Clean</td><td>Can we trust the data?</td><td>Remove duplicates, fix units, flag spikes (Unit 3)</td></tr>
     <tr><td>4. Analyze</td><td>What patterns do we see?</td><td>Summaries, charts, comparisons, models (Units 3\u20134, Python labs)</td></tr>
     <tr><td>5. Act</td><td>What should happen because of it?</td><td>Alerts, automatic control, recommendations (Unit 4)</td></tr>
     <tr><td>6. Share</td><td>How do we communicate it honestly?</td><td>A data story with a chart, a number, and a limitation (Unit 5)</td></tr></table>
     <p>The cycle <b>loops</b>: sharing a finding usually raises a new question. "The window side is 1.0 \u00b0C warmer" leads to "Does closing the curtains reduce the difference?"</p>
     ${mis(`<p>Skipping <b>Clean</b>. A hand touching the sensor, a duplicate row, or a reading in Fahrenheit can make an analysis completely wrong, even when the chart looks convincing.</p>`)}`, interactive:"lifecycle"},
    {id:"analytics", title:"Four types of analytics", html:`
     <p><b>Analytics</b> means using data to answer questions and support decisions. A widely used progression, often called Gartner\u2019s analytic ascendancy model, sorts analytics into four types. Each type answers a different question, and each needs more data, more thinking, and more care than the one before it.</p>
     ${fig(`<svg class="stairs" viewBox="0 0 640 260" role="img" aria-label="Analytics staircase">${[["Descriptive","What happened?","#2A9D8F"],["Diagnostic","Why did it happen?","#1F3A5F"],["Predictive","What will happen?","#E76F51"],["Prescriptive","What should we do?","#C9A227"]].map((s,i)=>`<g class="step" style="--d:${i}"><rect x="${20+i*150}" y="${190-i*50}" width="150" height="${50+i*50}" fill="${s[2]}" rx="6"/><text x="${95+i*150}" y="${214-i*50}" text-anchor="middle" fill="#fff" font-weight="700" font-size="14">${s[0]}</text><text x="${95+i*150}" y="${232-i*50}" text-anchor="middle" fill="#fff" font-size="11">${s[1]}</text></g>`).join("")}<text x="20" y="20" font-size="12" fill="currentColor">more value and more difficulty \u2192</text></svg>`, "Figure 1.2. The analytics staircase: each step builds on the one below.", "Four types following Gartner\u2019s analytic ascendancy model, as described by Petropoulos et al. (2023); see also Davenport & Harris (2007).")}
     <h3>Descriptive: what happened?</h3><p>Summarizes the past with counts, averages, highs, lows, and charts. <i>Example:</i> "The window side peaked at 33.1 \u00b0C at about 1:45 PM." Most of your first analyses will be descriptive, and that is fine: you cannot explain or predict what you have not described.</p>
     <h3>Diagnostic: why did it happen?</h3><p>Looks for causes by comparing groups, times, or conditions. <i>Example:</i> "The window side was warmer only when direct afternoon sun hit it, so sunlight explains most of the difference." Careful: two things changing together does not prove one causes the other.</p>
     <h3>Predictive: what will happen?</h3><p>Uses patterns in past data to estimate the future, usually with some uncertainty. <i>Example:</i> "Tomorrow the window side will likely pass 32 \u00b0C by 1:00 PM." In Python Lab C you will build simple prediction models.</p>
     <h3>Prescriptive: what should we do?</h3><p>Recommends or automatically takes an action. <i>Example:</i> "Switch the fan on automatically when the temperature passes 31 \u00b0C." In Unit 4 your system will act on its own.</p>
     ${tip("Clue words", `<p><i>how many, what was, highest, average</i> \u2192 descriptive \u2022 <i>why, because, caused</i> \u2192 diagnostic \u2022 <i>will, predict, forecast</i> \u2192 predictive \u2022 <i>should, best, recommend, automatically</i> \u2192 prescriptive. Clue words help, but always ask: is the question about the past, a cause, the future, or a decision?</p>`)}`, interactive:"analytics"},
    {id:"question", title:"Writing a good data question", html:`
     <p>A project is only as good as its question. A strong data question is:</p>
     <table class="t"><tr><th>Quality</th><th>Meaning</th><th>Test it by asking\u2026</th></tr>
     <tr><td>Specific</td><td>Says what, where, and when</td><td>Could two teams measure it the same way?</td></tr>
     <tr><td>Measurable</td><td>Our sensors can measure it</td><td>Which sensor and unit?</td></tr>
     <tr><td>Comparative or time-based</td><td>Compares places, times, or conditions</td><td>Compared with what?</td></tr>
     <tr><td>Useful</td><td>Someone could act on the answer</td><td>Who would change something?</td></tr>
     <tr><td>Respectful</td><td>Collects no personal information</td><td>Does it record people instead of places?</td></tr></table>
     ${ex("improving a question", `<p><b>Weak:</b> "Is our room hot?" (hot compared with what? where? when?)</p><p><b>Better:</b> "Is the room hot in the afternoon?" (adds time, but still no comparison or place)</p><p><b>Strong:</b> "Is the window side warmer than the door side between 12:00 and 15:00 on school days, and by how much?" (specific place and time, measurable with two DHT22s, comparative, and useful for deciding where to sit or when to open windows)</p>`)}
     <h3>Team question card</h3><p>Write: (1) your question, (2) the sensors and units, (3) where and when you will measure, (4) the analytics type, and (5) who could act on the answer. Upload a photo of the card at the end of this module.</p>`},
    {id:"ai", title:"If AI can write the code, what is my job?", html:`
     <p>AI tools can now write code, explain errors, and draft reports. So why learn any of this? Because someone still has to decide whether the AI's answer is <b>right, safe, and useful</b>, and that person needs to understand the system.</p>
     <ul><li><b>AI can be confidently wrong or unsafe.</b> In one study, about 40% of programs GitHub Copilot generated for security-relevant scenarios contained vulnerabilities.</li>
     <li><b>Leaning on AI can weaken learning.</b> In a field experiment with nearly 1,000 high school students, unrestricted GPT-4 access improved practice scores but lowered later exam scores by 17% once the AI was removed. A tutor version designed with learning safeguards largely avoided that harm.</li>
     <li><b>Humans remain accountable.</b> UNESCO's AI competency framework for students puts a human-centred mindset, including human agency and accountability, first.</li></ul>
     <h3>The six human-in-the-loop rules used all course</h3>
     <ol><li><b>Attempt first</b>, then ask AI.</li><li><b>Prompt with a framework</b> (you will learn PARTS in Module 1.3).</li><li><b>Verify</b> by testing and checking official documentation.</li><li><b>Protect</b>: never paste passwords, keys, or personal data.</li><li><b>Disclose</b> meaningful AI use in your AI use log.</li><li><b>Decide</b>: you make the final call and own it.</li></ol>
     <div class="callout try"><b>Think, pair, share</b><p>List three things a person must still do when AI writes the code. Agree with a partner on the most important one.</p></div>
     ${srcs([["Pearce et al., 2022", REF.pearce[1]],["Bastani et al., 2025", REF.bastani[1]],["UNESCO, 2024", REF.unesco[1]]])}`}
   ],
   quiz:[
    {q:"Which of these is an actuator?", o:["DHT22","LDR","Buzzer","Google Sheet"], a:2, e:"A buzzer turns an electrical signal into action (sound).", w:["The DHT22 is a sensor: it measures temperature and humidity.","The LDR is a sensor: it measures light.","","A Google Sheet is software in the application layer; it stores and shows data but does not act in the physical world."]},
    {q:"A team removes duplicate rows from its Sheet. Which lifecycle stage is this?", o:["Ask","Collect","Clean","Share"], a:2, e:"Fixing problems in the data so it can be trusted is the Clean stage.", w:["Ask is about forming the question, before any data exists.","Collect is measuring and recording; removing rows happens after collection.","","Share is communicating results to others."]},
    {q:"\u201cWill the room pass 32 \u00b0C by 2:00 PM?\u201d is which type of analytics?", o:["Descriptive","Diagnostic","Predictive","Prescriptive"], a:2, e:"It asks about the future (\u201cwill\u201d), so it is predictive.", w:["Descriptive summarizes what already happened; this question is about a time that has not happened yet.","Diagnostic asks why something happened; this question does not ask for a cause.","","Prescriptive recommends an action; this question only asks what will happen, not what to do."]},
    {q:"\u201cWhy was the window side warmer?\u201d is which type of analytics?", o:["Descriptive","Diagnostic","Predictive","Prescriptive"], a:1, e:"It asks for a cause (\u201cwhy\u201d), so it is diagnostic.", w:["Descriptive would only state that it was warmer and by how much, not why.","","Predictive is about the future; this question is about something that already happened.","Prescriptive would recommend what to do about it."]},
    {q:"Which question can our kit answer?", o:["Do students like this room?","Is the window side warmer than the door side between 12:00 and 15:00?","Is our school the best?","Which subject is most fun?"], a:1, e:"It is specific, measurable with temperature sensors, comparative, and useful.", w:["Liking is an opinion; no sensor in our kit measures it, and it would involve people's personal views.","","\u201cBest\u201d is not defined or measurable with sensors.","\u201cFun\u201d is an opinion that sensors cannot measure."]}
   ],
   rating:["I can name the lifecycle stages only when I look at the diagram.","I can explain most stages and analytics types with some help.","I can explain all six stages and classify questions by analytics type on my own.","I can do level 3 and help a classmate write a strong data question."],
