/* ============ SENSI: AI LEARNING ASSISTANT ============ */
let aiOpen = false, aiHistory = [], aiBusy = false;
function mdLite(text){
  const blocks = String(text).split(/```/); let html = "";
  blocks.forEach((b, i) => {
    if (i % 2 === 1){ const code = b.replace(/^[a-zA-Z0-9+#-]*\n/, ""); html += `<pre class="code">${esc(code.replace(/\n$/,""))}</pre>`; return; }
    const lines = esc(b).split("\n"); let list = null;
    const flush = () => { if (list){ html += `</${list}>`; list = null; } };
    lines.forEach(l => {
      const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      let m;
      if ((m = l.match(/^\s*[-*]\s+(.*)/))){ if (list !== "ul"){ flush(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if (list !== "ol"){ flush(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else if (!l.trim()){ flush(); }
      else if ((m = l.match(/^#{1,4}\s+(.*)/))){ flush(); html += `<p><b>${inline(m[1])}</b></p>`; }
      else { flush(); html += `<p>${inline(l)}</p>`; }
    });
    flush();
  });
  return html;
}
function aiContext(){
  const mm = location.hash.match(/^#\/m\/([^?]+)/); if (!mm || !MODULES[mm[1]]) return {};
  const m = MODULES[mm[1]], sec = document.getElementById(currentSection) || document.querySelector(".section[id]");
  const body = sec ? (sec.querySelector(".sec-body") || sec) : null;
  return {moduleId:m.id, moduleTitle:m.title, objectives:m.objectives, sectionTitle: sec ? (sec.querySelector("h2") || {}).innerText || "" : "", sectionText: body ? body.innerText.slice(0, 3500) : ""};
}
function aiAdd(role, html, extra){
  const box = $("#aiMsgs"), d = document.createElement("div"); d.className = "msg " + role; d.innerHTML = html; if (extra) d.appendChild(extra); box.appendChild(d);
  A(d, {opacity:[0,1], y:[10,0]}, {duration:.3}); box.scrollTop = box.scrollHeight; return d;
}
function aiIntroHtml(){ return `<b>Hi${user ? ", " + esc(user.givenName || "") : ""}! I'm Sensi, an AI learning assistant.</b> I'm an AI, not a person, and I can make mistakes.
  <ul><li>Try the problem first, then ask me for a hint.</li><li>Check my answers against the module, your teacher, or official documentation.</li><li>Never share personal details, passwords, or API keys with me.</li></ul>Your questions and my answers are saved for your teacher to review.`; }
function openAI(){
  if (!user || testActive) return; aiOpen = true; const p = $("#ai"); p.hidden = false; document.body.classList.toggle("ai-docked", device === "desktop");
  A(p, device === "phone" ? {y:["100%","0%"]} : {opacity:[0,1], x:[30,0]}, SPRING);
  const box = $("#aiMsgs");
  if (!box.childElementCount){
    if (!user.aiAllowed) aiAdd("sys", `Sensi is available to learners aged ${CONFIG.AI_MIN_AGE} and above (with parent or guardian consent if below 18). Your teacher is ready to help you with your questions.`);
    else if (!apiReady()) aiAdd("sys", "Sensi needs the course server to answer questions. Ask your teacher to connect the app (preview mode is on).");
    else aiAdd("bot", aiIntroHtml());
  }
  renderChips(); setTimeout(() => { const t = $("#aiInput"); if (t && device !== "phone") t.focus(); }, 200);
}
function closeAI(){ aiOpen = false; const p = $("#ai"); document.body.classList.remove("ai-docked"); const a = A(p, device === "phone" ? {y:["0%","100%"]} : {opacity:[1,0], x:[0,30]}, {duration:.22}); setTimeout(() => p.hidden = true, a ? 230 : 0); }
function renderChips(){
  const inModule = /^#\/m\//.test(location.hash);
  const chips = inModule ? ["Explain this section simply","Give me a hint for the challenge","Quiz me on this section","What are common mistakes here?"] : ["What will I learn in Unit 1?","How do I set up my board?","What is the IoT data lifecycle?"];
  $("#aiChips").innerHTML = chips.map(c => `<button class="chip" type="button">${c}</button>`).join("");
  $("#aiChips").querySelectorAll(".chip").forEach(b => b.onclick = () => askAI(b.textContent));
}
async function askAI(q){
  q = String(q || "").trim(); if (!q || aiBusy) return;
  if (!user.aiAllowed || !apiReady()) return openAI();
  aiBusy = true; $("#aiSend").disabled = true; $("#aiInput").value = "";
  aiAdd("user", esc(q)); const typing = aiAdd("bot typing", `<span class="dots"><i></i><i></i><i></i></span>`);
  const r = await api("ask", {question:q, history:aiHistory.slice(-8), context:aiContext()}, false);
  typing.remove(); aiBusy = false; $("#aiSend").disabled = false;
  if (r.ok){
    aiHistory.push({role:"user", content:q}, {role:"assistant", content:r.answer});
    const rep = document.createElement("div"); rep.className = "msg-tools";
    rep.innerHTML = `<button type="button" class="linkbtn">Report this answer</button>${r.remaining != null ? `<span>${r.remaining} questions left today</span>` : ""}`;
    rep.querySelector("button").onclick = () => reportAI(q, r.answer, rep);
    aiAdd("bot", mdLite(r.answer), rep);
  } else {
    aiAdd("sys", ({ai_disabled:"Sensi is not switched on yet. Ask your teacher.", ai_age_restricted:`Sensi is available to learners aged ${CONFIG.AI_MIN_AGE} and above.`, guardian_consent_required:"Sensi needs parent or guardian consent for learners below 18.", ai_daily_limit:"You've reached today's question limit. Try again tomorrow, or ask your teacher.", not_registered:"Your profile isn't on the course server yet. Reconnect to the internet and reload the app.", network:"Sensi couldn't be reached. Check your connection and try again."})[r.error] || ("Sensi couldn't answer right now (" + (r.detail || r.error || "unknown error") + ")."));
  }
}
function reportAI(q, a, el){
  el.innerHTML = `<span>Why?</span>${["Wrong or misleading","Inappropriate","Not helpful","Other"].map(x => `<button type="button" class="chip small">${x}</button>`).join("")}`;

   {t:"Create job 3: read the sensors", h:`<p>Inside the timer block, read the DHT22 (it allows one reading every 2 s, which our timer respects) and the LDR. Then convert light: <b>raw \u00f7 maximum \u00d7 100</b>. Example on an ESP32: 2252 \u00f7 4095 \u00d7 100 \u2248 55 %.</p>`, code:{cpp:b=>`    float t = dht.readTemperature();\n    float h = dht.readHumidity();\n    float light = analogRead(LDR_PIN) / ADC_MAX * 100.0;`, py:b=>`        sensor.measure()\n        t = sensor.temperature()\n        h = sensor.humidity()\n        light = ldr.read_u16() / 65535 * 100`}},
   {t:"Create job 4: print one CSV row", h:`<p>Print each value followed by a comma, and end with <code>println</code> on the last value so the row finishes with a new line. The <code>1</code> means one decimal place. In Python, <code>format</code> fills each <code>{}</code> in order; <code>{:.1f}</code> means one decimal.</p>`, code:{cpp:b=>`    Serial.print(now);    Serial.print(',');\n    Serial.print(t, 1);   Serial.print(',');\n    Serial.print(h, 1);   Serial.print(',');\n    Serial.println(light, 1);       // println ends the row`, py:b=>`        print("{},{:.1f},{:.1f},{:.1f}".format(now, t, h, light))`}},
   {t:"Test and improve", h:`<p>Run it and read the Serial Monitor panel. Each row should arrive 2 s after the previous one, and the light value should drop to about 8 % while the \u201chand\u201d covers the sensor (4\u20137 s).</p><table class="t"><tr><th>What you see</th><th>Cause</th><th>Fix</th></tr><tr><td>Header printed many times</td><td>Header is inside loop()</td><td>Move it to setup() / before the loop</td></tr><tr><td>All values on one long line</td><td>Last value used print, not println</td><td>End each row with println</td></tr><tr><td>Rows every few milliseconds</td><td>lastRead is never updated</td><td>Add <code>lastRead = now;</code> inside the if</td></tr><tr><td>Light like 2252 instead of 55</td><td>Forgot to convert</td><td>Divide by ADC_MAX, multiply by 100</td></tr><tr><td>Light always 0 (C++)</td><td>Integer division: dividing two whole numbers drops the decimals</td><td>Use a decimal in ADC_MAX, e.g. 4095.0</td></tr></table>`}
  ]},
 sb_alarm: {
  plan:["What decides whether the LED should be on?","How do you calculate light % from the raw reading?","How often must the program check the light?","What must happen when it is NOT dark?"],
  steps:[
   {t:"Ask: understand the problem", h:`<p>This is a <b>decision</b> problem: <i>\u201cIf it is dark (below 30 %), turn the LED on; otherwise, turn it off.\u201d</i> The sandbox covers the sensor from 4 to 7 s (dark) and shines a flashlight from 11 to 13 s (very bright). The LED must react within 0.3 s, and long delays are not allowed.</p>`},
   {t:"Imagine: why not use delay()?", h:`<p>Suppose you checked the light, then waited 2 seconds. If the hand arrived just after a check, the LED would stay off for up to 2 seconds: too slow. The fastest, most responsive solution is to check the light on <b>every</b> pass through the loop. The board does this thousands of times per second, so the LED reacts almost instantly. This is the same idea as the millis() race in the Timing section.</p>`},
   {t:"Plan: an if/else inside the loop", h:`<pre class="code">repeat forever:
    light = raw reading \u00f7 maximum \u00d7 100
    if light < 30:
        LED on
    else:
        LED off</pre><p>The <b>else</b> is essential: without it, the LED would turn on in the dark and never turn off again.</p>`},
   {t:"Create: read and convert", h:`<p>Calculate light % at the start of every loop. Use a decimal number type (float) so you keep the decimals.</p>`, code:{cpp:b=>`  float light = analogRead(LDR_PIN) / ADC_MAX * 100.0;`, py:b=>`    light = ldr.read_u16() / 65535 * 100`}},
   {t:"Create: decide with if / else", h:`<p>The condition <code>light &lt; 30</code> is either true or false. When true, the first block runs; when false, the <code>else</code> block runs. Exactly one of them runs on every pass.</p>`, code:{cpp:b=>`  if (light < 30) {\n    digitalWrite(LED_PIN, HIGH);   // dark: LED on\n  } else {\n    digitalWrite(LED_PIN, LOW);    // bright enough: LED off\n  }`, py:b=>`    if light < 30:\n        led.on()          # dark: LED on\n    else:\n        led.off()         # bright enough: LED off\n    time.sleep_ms(10)     # tiny rest (10 ms), far below the 1 s limit`}},
   {t:"Test and improve", h:`<p>On the timeline, the LED block should start right where the light line drops (4 s) and end where it rises (7 s), and stay off during the flashlight (11\u201313 s).</p><table class="t"><tr><th>What you see</th><th>Cause</th><th>Fix</th></tr><tr><td>LED on when bright, off when dark</td><td>Comparison reversed (<code>&gt;</code>)</td><td>Use <code>light &lt; 30</code></td></tr><tr><td>LED never turns off</td><td>No else branch</td><td>Add the else that turns it off</td></tr><tr><td>LED reacts late</td><td>A long delay in loop()</td><td>Remove it; check the light every pass</td></tr><tr><td>LED always on (Uno R4)</td><td>Light never reaches 30 % because of a calculation error</td><td>Check the formula and ADC_MAX = 1023.0</td></tr></table><p><b>Real-world link:</b> this is a <i>prescriptive</i> system (Module 1.1): it decides and acts by itself, like automatic street lights.</p>`}
  ]}
};

  const end = saved.start + TEST_CFG.MINUTES * 60000;

    const t = $("#tTimer"); t.textContent = `${mm}:${String(ss).padStart(2, "0")} left`; t.classList.toggle("low", left < 5 * 60000);
    if (left <= 0){ clearInterval(tick); submit(true); } }, 1000);

/* ---------- Analytics sorter v5 (fixes off-area cards, explains wrong answers) ---------- */
INTERACTIVES.analytics = function(el){
  const T = [["Descriptive","What happened?","It summarizes something that already happened (counts, highs, lows, averages)."],["Diagnostic","Why did it happen?","It looks for the cause of something that already happened."],["Predictive","What will happen?","It estimates something in the future."],["Prescriptive","What should we do?","It recommends or automatically takes an action."]];

  let i = 0, score = 0, streak = 0, locked = false;

   <div class="deck"><div class="qcard" tabindex="0"></div></div>
   <div class="buckets">${T.map((t, k) => `<button class="bucket" data-k="${k}" type="button"><b>${t[0]}</b><span>${t[1]}</span><em>0</em></button>`).join("")}</div>

  const render = () => { resetCard(); locked = false;
    if (i >= Q.length){ card.innerHTML = `<b>Done!</b> You scored ${score} of ${Q.length}.<br><button class="btn small again" type="button">Play again</button>`; card.dataset.locked = 1;
      $(".again", el).onclick = () => { i = 0; score = 0; streak = 0; el.querySelectorAll(".bucket em").forEach(e => e.textContent = 0); el.querySelectorAll(".adots i").forEach(d => d.className = ""); delete card.dataset.locked; fb.className = "panel afb"; fb.textContent = "Drag the card onto a bucket, or tap a bucket."; render(); };
      logEvent(currentModule, "analytics_sort", "activity", score + "/" + Q.length); return; }
    card.innerHTML = Q[i][0]; anim(card, {opacity:[0, 1], y:[24, 0], scale:[.94, 1], x:0, rotate:0}, {type:"spring", stiffness:300, damping:24}); };
  const answer = (k, d) => { if (i >= Q.length || locked) return; locked = true; const q = Q[i], right = q[1] === k, bucket = el.querySelector(`.bucket[data-k="${k}"]`), dot = el.querySelectorAll(".adots i")[i];
    if (right){ score++; streak++; dot.className = "ok"; const br = bucket.getBoundingClientRect(), cr = card.getBoundingClientRect(), sx = d ? d.dx : 0, sy = d ? d.dy : 0;
      card.style.transform = ""; const a = anim(card, {x:[sx, sx + br.left + br.width / 2 - (cr.left + cr.width / 2)], y:[sy, sy + br.top + br.height / 2 - (cr.top + cr.height / 2)], scale:[1, .2], opacity:[1, 0]}, {duration:.45, ease:EASE});
      const c = bucket.querySelector("em"); c.textContent = +c.textContent + 1; pop(bucket, 1.08);
      fb.className = "panel afb ok"; fb.innerHTML = `<b>Correct${streak >= 3 ? `, ${streak} in a row` : ""}!</b> It is <b>${T[k][0]}</b> because it ${q[3]}. Clue: \u201c${q[2]}\u201d.`;
      i++; setTimeout(render, a ? 480 : 0);
    } else { streak = 0; dot.className = "no"; if (d) snapBack(card, d.dx, d.dy); else shake(card); bucket.classList.add("wrong"); setTimeout(() => bucket.classList.remove("wrong"), 700);
      card.innerHTML = q[0].replace(q[2], `<mark>${q[2]}</mark>`);
      fb.className = "panel afb no"; fb.innerHTML = `<b>Not quite.</b> You chose <b>${T[k][0]}</b>: ${T[k][2]} This question ${q[3]}, so it is <b>${T[q[1]][0]}</b> (${T[q[1]][1]}). Look at the highlighted clue: \u201c${q[2]}\u201d.<div class="controls"><button class="btn small primary anext" type="button">Next question</button></div>`;
      $(".anext", el).onclick = () => { i++; render(); }; }
    $(".ascore", el).textContent = `Score ${score} \u2022 Streak ${streak}`; };
  draggable(card, ".bucket", (zone, d) => { if (d.tap) return; if (zone) answer(+zone.dataset.k, d); else snapBack(card, d.dx, d.dy); });

/* ---------- Unit survey ---------- */
const SURVEY = {u1:{title:"Unit 1 survey", likert:[["s1","The explanations were clear."],["s2","The examples helped me understand."],["s3","The interactive activities helped me learn."],["s4","The code explanations helped me understand programming."],["s5","The coding sandbox helped me practice."],["s6","Sensi, the AI assistant, was helpful.", true],["s7","I feel confident I can wire and program a sensor project."],["s8","The pace of Unit 1 was right for me."]],
  open:[["o1","What helped you learn the most in Unit 1?"],["o2","What was confusing, or what should we improve?"],["o3","Any other comments? (optional)"]]}};
function viewSurvey(unit){
  const S = SURVEY[unit]; if (!S){ location.hash = "#/home"; return; }
  const done = prog.survey && prog.survey[unit], scale = ["Strongly disagree","Disagree","Neutral","Agree","Strongly agree"];
  $("#view").innerHTML = `<p class="crumb">Feedback</p><h1>${S.title}</h1>${done ? `<div class="callout tip"><b>Thank you!</b><p>You answered this survey on ${new Date(done).toLocaleDateString()}. You can submit again if your views have changed.</p></div>` : ""}
   <p>Your answers help improve the course. There are no right or wrong answers; be honest. It takes about 3 minutes.</p>
   <form id="survey" class="survey">${S.likert.map(([k, q, na]) => `<fieldset class="lk"><legend>${q}</legend><div class="lk-opts">${scale.map((s, i) => `<label><input type="radio" name="${k}" value="${i + 1}"><span>${s}</span></label>`).join("")}${na ? `<label><input type="radio" name="${k}" value="NA"><span>Did not use</span></label>` : ""}</div></fieldset>`).join("")}
    ${S.open.map(([k, q]) => `<div class="field"><label for="sv-${k}">${q}</label><textarea id="sv-${k}" name="${k}" rows="3"></textarea></div>`).join("")}
    <div class="err" id="svErr" role="alert"></div><button class="btn primary big" type="submit">Submit survey</button></form>`;
  reveal(document.querySelectorAll(".lk"));
  $("#survey").onsubmit = async e => { e.preventDefault(); const f = e.target, ans = {};
    for (const [k] of S.likert){ const c = f.querySelector(`input[name="${k}"]:checked`); if (!c){ $("#svErr").textContent = "Please answer every statement (you can choose Neutral)."; f.querySelector(`input[name="${k}"]`).closest("fieldset").scrollIntoView({behavior:"smooth", block:"center"}); return; } ans[k] = c.value; }
    S.open.forEach(([k]) => ans[k] = f.querySelector(`[name="${k}"]`).value.trim().slice(0, 1000));
    if (!ans.o1 || !ans.o2){ $("#svErr").textContent = "Please answer the first two written questions."; return; }
    const r = await api("survey", {unit, answers:ans, device}, false);
    prog.survey = prog.survey || {}; prog.survey[unit] = Date.now(); saveProg(); logEvent("u1", "survey_" + unit, "survey_done", "1");
    toast(r.ok ? "Thank you! Your survey was submitted." : "Saved on this device; it will be sent when you are online.");
    if (!r.ok && !r.offline) store.set("sti_pending_survey", {unit, answers:ans});
    checkBadges(); viewSurvey(unit); scrollTo({top:0}); };
}

/* ---------- Course overview ---------- */
function viewOverview(){
  const comps = [["C1","Physical computing","Wire sensors and program boards in C++ and MicroPython."],["C2","IoT connectivity","Send data over Wi-Fi and HTTP to the cloud."],["C3","Data engineering","Design data flows, formats, and pipelines."],["C4","Data cleaning","Find and fix errors, gaps, and outliers honestly."],["C5","Analysis and communication","Summarize, chart, and tell a data story."],["C6","Data science","Build and test simple prediction and anomaly models."],["C7","Automation and control","Make systems act on data automatically."],["C8","Human-centered AI","Use AI as a partner you direct, verify, and are accountable for."]];
  const units = [["Unit 1","Sensors and programming foundations","open","#2A9D8F"],["Unit 2","Connecting to the cloud","soon","#1F3A5F"],["Lab A","Python and Google Colab","soon","#7C3AED"],["Unit 3","Making sense of the data","soon","#E76F51"],["Unit 4","Acting on data and data science","soon","#C9A227"],["Unit 5","Capstone","soon","#15803D"]];
  $("#view").innerHTML = `<section class="ov-hero"><p class="crumb">Course overview</p><h1>From Sensor to Insight</h1><p class="lede2">IoT Data Analytics, Engineering, and Science with Human-Centered AI</p>
    <p>Across five units you will build a real Internet of Things system: sensors on a microcontroller send live data to Google Sheets, you clean and analyze it in Sheets and Python, your system acts on it automatically, and you present a data story. Along the way you learn to use AI as a partner you direct and check, not a shortcut you trust blindly.</p>
    <div class="controls">${preGate() ? `<a class="btn shimmer" href="#/test/pre">Take the pre-test</a>` : `<a class="btn shimmer" href="#/m/1.1">Start Unit 1</a>`}<a class="btn" href="#ov-assess">How you are assessed</a></div></section>
   <h2>What this course offers</h2><div class="bento ov-offers">${[["Real hardware","Arduino Uno R4 WiFi, ESP32, ESP8266, or Raspberry Pi Pico W with temperature, humidity, and light sensors."],["Your own data","You collect it yourself, from a question you care about, instead of using someone else's dataset."],["The full data lifecycle","Ask, collect, clean, analyze, act, and share, the way professionals do."],["Industry tools","Arduino IDE, MicroPython, Google Sheets, Apps Script, and Python in Google Colab."],["AI literacy","Prompting frameworks (PARTS, Chain-of-Thought, Tree-of-Thought) and verification habits."],["Practice that checks itself","Interactive explainers, a coding sandbox, quizzes with explanations, and badges."]].map(o => `<div class="spot span2"><h3>${o[0]}</h3><p class="lbl">${o[1]}</p></div>`).join("")}</div>
   <h2>The course journey</h2>
   <p>The course is released one unit at a time, with a new unit each week. Each unit builds on the one before, so complete them in order.</p>
   <div class="journey">${units.map(u => `<div class="jstep" style="--c:${u[3]}"><span class="jday">${u[2] === "open" ? "Open now" : "Coming soon"}</span><b>${u[0]}</b><span>${u[1]}</span></div>`).join("")}</div>
   <h3>Suggested plan for Unit 1 (about 11 hours)</h3>
   <table class="t"><tr><th>Session</th><th>What you do</th><th>About</th></tr>
   <tr><td><b>Session 1</b></td><td>Pre-test \u2192 Module 1.1 Launch and the IoT data lifecycle \u2192 Module 1.2 Board setup and programming basics</td><td>5 h 15 min</td></tr>
   <tr><td><b>Session 2</b></td><td>Module 1.3 Reading sensors (including your 10-minute data recording) \u2192 Module 1.4 Your first dataset in Google Sheets \u2192 Unit 1 survey</td><td>6 h</td></tr></table>
   <p class="explain">Record your sensor data early in Session 2 so you can analyze it in Module 1.4 the same day. Learning at your own pace? Split the sessions into shorter blocks; your progress is saved.</p>
   <h2>What you will learn: 8 competencies</h2><div class="comp-grid">${comps.map(c => `<div class="comp"><span class="ccode">${c[0]}</span><b>${c[1]}</b><p class="explain">${c[2]}</p></div>`).join("")}</div>
   <h2>The frameworks behind the course</h2>
   <h3>1. How you learn: the experiential learning cycle</h3>
   <div class="two"><svg class="kolb" viewBox="0 0 320 300" role="img" aria-label="Experiential learning cycle">${[["Experience","build and try",160,40,"#2A9D8F"],["Reflect","what happened?",280,150,"#1F3A5F"],["Understand","learn the concept",160,260,"#E76F51"],["Experiment","apply and improve",40,150,"#C9A227"]].map(k => `<g><circle cx="${k[2]}" cy="${k[3]}" r="38" fill="${k[4]}"/><text x="${k[2]}" y="${k[3]}" text-anchor="middle" fill="#fff" font-weight="700" font-size="12">${k[0]}</text><text x="${k[2]}" y="${k[3] + 14}" text-anchor="middle" fill="#fff" font-size="9">${k[1]}</text></g>`).join("")}<circle cx="160" cy="150" r="88" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 8" class="kspin"/></svg>
    <div><p>Every module follows a cycle based on Kolb's experiential learning: you <b>experience</b> something (a hook or a build), <b>reflect</b> on what happened, <b>understand</b> the concept behind it, and <b>experiment</b> by applying it to a challenge.</p><p>Each module has the same rhythm: <b>Hook \u2192 interactive explainer \u2192 concept notes with worked examples \u2192 guided build \u2192 challenges \u2192 quiz, self-rating, and checkpoint</b>. Support is strongest at the start and fades as you gain confidence.</p></div></div>
   <h3>2. How data becomes insight: the IoT data lifecycle</h3>
   <div class="lc-row">${["Ask","Collect","Clean","Analyze","Act","Share"].map((s, i) => `<span class="lc-chip" style="--d:${i}">${s}</span>`).join('<span class="lc-arr">\u2192</span>')}</div>
   <p>Every unit moves your project through these stages. The four types of analytics (descriptive, diagnostic, predictive, prescriptive) grow in difficulty as the course progresses.</p>
   <h3>3. How you use AI: human in the loop</h3>
   <div class="rules">${["Attempt first","Prompt with a framework","Verify","Protect secrets","Disclose","Decide"].map((r, i) => `<div class="rule"><b>${i + 1}</b><span>${r}</span></div>`).join("")}</div>
   <p>AI is built into every unit as a partner you direct, check, and take responsibility for, following UNESCO's emphasis on human agency and accountability.</p>
   <h3>4. How you solve problems: the engineering design process</h3>
   <div class="lc-row">${["Ask","Imagine","Plan","Create","Test","Improve","Share"].map((s, i) => `<span class="lc-chip" style="--d:${i};background:#1F3A5F">${s}</span>`).join('<span class="lc-arr">\u2192</span>')}</div>
   <p>Every challenge, from your first blinking LED to the capstone, follows NASA's engineering design process. You learn it in Module 1.2 and use it in every sandbox challenge, where the explained solutions walk through the same steps.</p>
   <h2 id="ov-assess">How you are assessed</h2>
   <table class="t"><tr><th>Assessment</th><th>When</th><th>What it shows</th></tr><tr><td>Pre-test and post-test (40 items, 45 minutes, no AI)</td><td>Before Unit 1, and after the capstone</td><td>Your growth in each of the 8 competencies</td></tr><tr><td>Quizzes with explanations</td><td>Every module</td><td>Whether you understood the key ideas</td></tr><tr><td>Self-ratings</td><td>Every module</td><td>How confident you feel (compared with your results)</td></tr><tr><td>Competency checkpoints and uploads</td><td>Every module</td><td>Evidence your teacher reviews: Met or Not yet</td></tr><tr><td>Badges</td><td>When you meet a competency</td><td>A visible record of what you can do</td></tr><tr><td>Capstone rubric (7 criteria, 28 points)</td><td>Unit 5</td><td>Hardware, logging, pipeline, analysis, automation, AI literacy, and data story</td></tr></table>
   <h2>What you need</h2><p>One board per team with a USB data cable, a breadboard, jumper wires, a DHT22 sensor, an LDR with a 10 k\u03a9 resistor, an LED with a 220 \u03a9 resistor, a laptop with Arduino IDE 2 or Thonny, and a Google account. iPad users can practice in the coding sandbox and the Wokwi simulator.</p>
   <div class="controls">${preGate() ? `<a class="btn primary big" href="#/test/pre" style="max-width:320px">Take the pre-test</a>` : `<a class="btn primary big" href="#/m/1.1" style="max-width:320px">Start Module 1.1</a>`}</div>
   <h2>References</h2><ol class="refs"><li>Kolb, D. A. (1984). Experiential learning: Experience as the source of learning and development. Prentice Hall.</li><li>${esc(REF.unesco[0])} <a href="${REF.unesco[1]}" target="_blank" rel="noopener">${REF.unesco[1]}</a></li><li>${esc(REF.longmagerko[0])} <a href="${REF.longmagerko[1]}" target="_blank" rel="noopener">${REF.longmagerko[1]}</a></li><li>${esc(REF.davenport[0])}</li></ol>`;
  reveal(document.querySelectorAll("#view h2, .spot, .comp, .jstep, .rule")); spotify($("#view"));
  A(document.querySelectorAll(".lc-chip"), {opacity:[0, 1], y:[10, 0]}, {delay:stag(0.1, .2), duration:.4});
}

/* ---------- Router (override) ---------- */
function route(){
  applyDevice(); applySide();
  $("#map").classList.remove("open"); if ("speechSynthesis" in window) speechSynthesis.cancel(); sendEvents();
  const guest = !user;
  $("#map").style.display = guest ? "none" : ""; $(".shell").classList.toggle("noside", guest); document.body.classList.toggle("guest", guest);
  $("#searchBtn").style.display = guest ? "none" : ""; $("#aiFab").hidden = guest; $("#bottomNav").hidden = guest; const sb = $("#sideBtn"); if (sb) sb.style.display = guest ? "none" : "";
  if (guest){ if (aiOpen) closeAI(); viewWelcome(location.hash === "#/back" ? "back" : "new"); return; }
  renderWho();
  const h = location.hash, mm = h.match(/^#\/m\/([^?]+)(?:\?s=(.+))?/), sv = h.match(/^#\/survey\/(\w+)/), tm = h.match(/^#\/test\/(pre|post)/);
  if (!tm) testActive = false; $("#aiFab").hidden = guest || testActive;
  if (tm) viewTest(tm[1]);
  else if (mm && preGate()) viewPreGate();
  else if (mm){ pendingAnchor = mm[2] || null; viewModule(mm[1]); }
  else if (h === "#/progress") viewProgress(); else if (h === "#/overview") viewOverview(); else if (h === "#/badges") viewBadges(); else if (sv) viewSurvey(sv[1]); else viewHome();
  renderMap(); if (aiOpen) renderChips();
  document.querySelectorAll("#bottomNav [data-nav]").forEach(b => b.classList.toggle("on", (b.dataset.nav === "home" && !mm && h !== "#/progress") || (b.dataset.nav === "progress" && h === "#/progress") || (b.dataset.nav === "modules" && !!mm)));
  if (!mm || !mm[2]){ scrollTo({top:0}); A("#view", {opacity:[0, 1], y:[10, 0]}, {duration:.35, ease:[.22,1,.36,1]}); }
}
function buildIndex(){ const out = [{t:"Course overview", sub:"Page", h:"#/overview"}];
  Object.values(MODULES).forEach(m => { out.push({t:`Module ${m.id}: ${m.title}`, sub:"Module", h:`#/m/${m.id}`}); m.sections.forEach(s => out.push({t:s.title, sub:`Module ${m.id}`, h:`#/m/${m.id}?s=${s.id}`})); });
  out.push({t:"Coding sandbox (Module 1.2)", sub:"Practice", h:"#/m/1.2?s=errors"}, {t:"Coding sandbox (Module 1.3)", sub:"Practice", h:"#/m/1.3?s=p2"}, {t:"Wiring guide", sub:"Module 1.3", h:"#/m/1.3?s=wiring"}, {t:"Pre-test", sub:"Assessment", h:"#/test/pre"}, {t:"Post-test", sub:"Assessment", h:"#/test/post"}, {t:"My badges", sub:"Page", h:"#/badges"}, {t:"Unit 1 survey", sub:"Page", h:"#/survey/u1"}, {t:"My progress", sub:"Page", h:"#/progress"}, {t:"Course home", sub:"Page", h:"#/home"}, {t:"Settings", sub:"Page", h:"settings"});
