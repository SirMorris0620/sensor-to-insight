    let found = null, serverProg = null;
    if (apiReady()){
      try { const r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({action:"lookup", email})}).then(x => x.json());
        if (r.ok && r.found){ const p = r.profile; found = {email, givenName:p.givenName, lastName:(local && local.lastName) || "", name:p.givenName, role:p.role, gradeLevels:p.gradeLevels, minor:p.minor, aiAllowed:p.aiAllowed}; serverProg = r.progress; }
        else if (r.ok && !r.found && !local){ $("#bGo").disabled = false; $("#bGo").textContent = "Continue"; return fail("We couldn't find that email. Check the spelling, or choose \u201cI'm new here\u201d to sign up."); }
      } catch(e){ /* fall back to this device */ }
    }
    if (!found && local) found = local;
    if (!found){ $("#bGo").disabled = false; $("#bGo").textContent = "Continue"; return fail(apiReady() ? "We couldn't reach the course server. Check your connection and try again." : "This device has no profile for that email. Choose \u201cI'm new here\u201d to sign up."); }
    user = found; rememberUser();
    prog = store.get(pkey(), {done:{}, quiz:{}, rating:{}, uploads:[], minutes:0});
    if (serverProg){ prog.done = Object.assign({}, serverProg.done, prog.done); prog.quiz = Object.assign({}, serverProg.quiz, prog.quiz); prog.rating = Object.assign({}, serverProg.rating, prog.rating); saveProg(); }
    api("access", {device, userAgent:navigator.userAgent.slice(0,140), page:"return"});
    toast(`Welcome back, ${user.givenName || user.name}!`); location.hash = "#/home"; route();
  };
}
function rememberUser(){ store.set("sti_user", user); const all = store.get("sti_profiles", {}); all[user.email] = user; store.set("sti_profiles", all); }

/* ============ SENSI: AI LEARNING ASSISTANT ============ */
let aiOpen = false, aiHistory = [], aiBusy = false;
function mdLite(text){
  const blocks = String(text).split(/```/); let html = "";
  blocks.forEach((b, i) => {
    if (i % 2 === 1){ const code = b.replace(/^[a-zA-Z0-9+#-]*\n/, ""); html += `<pre class="code">${esc(code.replace(/\n$/,""))}</pre>`; return; }
    const lines = esc(b).split("\n"); let list = null;
    const flush = () => { if (list){ html += `</${list}>`; list = null; } };
    lines.forEach(l => {
      const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
      let m;
      if ((m = l.match(/^\s*[-*]\s+(.*)/))){ if (list !== "ul"){ flush(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if (list !== "ol"){ flush(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; }
      else if (!l.trim()){ flush(); }
      else if ((m = l.match(/^#{1,4}\s+(.*)/))){ flush(); html += `<p><b>${inline(m[1])}</b></p>`; }
      else { flush(); html += `<p>${inline(l)}</p>`; }
    });
    flush();
  });
  return html;
}
function aiContext(){
  const mm = location.hash.match(/^#\/m\/([^?]+)/); if (!mm || !MODULES[mm[1]]) return {};
  const m = MODULES[mm[1]], sec = document.getElementById(currentSection) || document.querySelector(".section[id]");
  const body = sec ? (sec.querySelector(".sec-body") || sec) : null;
  return {moduleId:m.id, moduleTitle:m.title, objectives:m.objectives, sectionTitle: sec ? (sec.querySelector("h2") || {}).innerText || "" : "", sectionText: body ? body.innerText.slice(0, 3500) : ""};
}
function aiAdd(role, html, extra){
  const box = $("#aiMsgs"), d = document.createElement("div"); d.className = "msg " + role; d.innerHTML = html; if (extra) d.appendChild(extra); box.appendChild(d);
  A(d, {opacity:[0,1], y:[10,0]}, {duration:.3}); box.scrollTop = box.scrollHeight; return d;
}
function aiIntroHtml(){ return `<b>Hi${user ? ", " + esc(user.givenName || "") : ""}! I'm Sensi, an AI learning assistant.</b> I'm an AI, not a person, and I can make mistakes.
  <ul><li>Try the problem first, then ask me for a hint.</li><li>Check my answers against the module, your teacher, or official documentation.</li><li>Never share personal details, passwords, or API keys with me.</li></ul>Your questions and my answers are saved for your teacher to review.`; }
function openAI(){
  if (!user) return; aiOpen = true; const p = $("#ai"); p.hidden = false; document.body.classList.toggle("ai-docked", device === "desktop");
  A(p, device === "phone" ? {y:["100%","0%"]} : {opacity:[0,1], x:[30,0]}, SPRING);
  const box = $("#aiMsgs");
  if (!box.childElementCount){
    if (!user.aiAllowed) aiAdd("sys", `Sensi is available to learners aged ${CONFIG.AI_MIN_AGE} and above (with parent or guardian consent if below 18). Your teacher is ready to help you with your questions.`);
    else if (!apiReady()) aiAdd("sys", "Sensi needs the course server to answer questions. Ask your teacher to connect the app (preview mode is on).");
    else aiAdd("bot", aiIntroHtml());
  }
  renderChips(); setTimeout(() => { const t = $("#aiInput"); if (t && device !== "phone") t.focus(); }, 200);
}
function closeAI(){ aiOpen = false; const p = $("#ai"); document.body.classList.remove("ai-docked"); const a = A(p, device === "phone" ? {y:["0%","100%"]} : {opacity:[1,0], x:[0,30]}, {duration:.22}); setTimeout(() => p.hidden = true, a ? 230 : 0); }
function renderChips(){
  const inModule = /^#\/m\//.test(location.hash);
  const chips = inModule ? ["Explain this section simply","Give me a hint for the challenge","Quiz me on this section","What are common mistakes here?"] : ["What will I learn in Unit 1?","How do I set up my board?","What is the IoT data lifecycle?"];
  $("#aiChips").innerHTML = chips.map(c => `<button class="chip" type="button">${c}</button>`).join("");
  $("#aiChips").querySelectorAll(".chip").forEach(b => b.onclick = () => askAI(b.textContent));
}
async function askAI(q){
  q = String(q || "").trim(); if (!q || aiBusy) return;
  if (!user.aiAllowed || !apiReady()) return openAI();
  aiBusy = true; $("#aiSend").disabled = true; $("#aiInput").value = "";
  aiAdd("user", esc(q)); const typing = aiAdd("bot typing", `<span class="dots"><i></i><i></i><i></i></span>`);
  const r = await api("ask", {question:q, history:aiHistory.slice(-8), context:aiContext()}, false);
  typing.remove(); aiBusy = false; $("#aiSend").disabled = false;
  if (r.ok){
    aiHistory.push({role:"user", content:q}, {role:"assistant", content:r.answer});
    const rep = document.createElement("div"); rep.className = "msg-tools";
    rep.innerHTML = `<button type="button" class="linkbtn">Report this answer</button>${r.remaining != null ? `<span>${r.remaining} questions left today</span>` : ""}`;
    rep.querySelector("button").onclick = () => reportAI(q, r.answer, rep);
    aiAdd("bot", mdLite(r.answer), rep);
  } else {
    aiAdd("sys", ({ai_disabled:"Sensi is not switched on yet. Ask your teacher.", ai_age_restricted:`Sensi is available to learners aged ${CONFIG.AI_MIN_AGE} and above.`, guardian_consent_required:"Sensi needs parent or guardian consent for learners below 18.", ai_daily_limit:"You've reached today's question limit. Try again tomorrow, or ask your teacher.", not_registered:"Your profile isn't on the course server yet. Reconnect to the internet and reload the app.", network:"Sensi couldn't be reached. Check your connection and try again."})[r.error] || ("Sensi couldn't answer right now (" + (r.detail || r.error || "unknown error") + ")."));
  }
}
function reportAI(q, a, el){
  el.innerHTML = `<span>Why?</span>${["Wrong or misleading","Inappropriate","Not helpful","Other"].map(x => `<button type="button" class="chip small">${x}</button>`).join("")}`;
  el.querySelectorAll(".chip").forEach(b => b.onclick = () => { api("report", {moduleId:currentModule, reason:b.textContent, question:q, answer:a}, false); el.innerHTML = "<span>Thanks. Your teacher will review this answer.</span>"; });
}

/* ============ ROUTER, NAV, AND SETTINGS ============ */
function route(){
  applyDevice();
  $("#map").classList.remove("open"); if ("speechSynthesis" in window) speechSynthesis.cancel(); sendEvents();
  const guest = !user;
  $("#map").style.display = guest ? "none" : ""; $(".shell").classList.toggle("noside", guest); document.body.classList.toggle("guest", guest);
  $("#searchBtn").style.display = guest ? "none" : ""; $("#aiFab").hidden = guest; $("#bottomNav").hidden = guest;
  if (guest){ if (aiOpen) closeAI(); viewWelcome(location.hash === "#/back" ? "back" : "new"); return; }
  renderWho();
  const h = location.hash, mm = h.match(/^#\/m\/([^?]+)(?:\?s=(.+))?/);
  if (mm){ pendingAnchor = mm[2] || null; viewModule(mm[1]); } else if (h === "#/progress") viewProgress(); else viewHome();
  renderMap(); if (aiOpen) renderChips();
  document.querySelectorAll("#bottomNav [data-nav]").forEach(b => b.classList.toggle("on", (b.dataset.nav === "home" && !mm && h !== "#/progress") || (b.dataset.nav === "progress" && h === "#/progress") || (b.dataset.nav === "modules" && !!mm)));
  if (!mm || !mm[2]) { scrollTo({top:0}); A("#view", {opacity:[0,1], y:[10,0]}, {duration:.35, ease:[.22,1,.36,1]}); }
}
let lastRouteKey = "";
addEventListener("hashchange", () => { const key = location.hash.split("?")[0]; const m = location.hash.match(/^#\/m\/([^?]+)\?s=(.+)/);
  if (key === lastRouteKey && m){ const t = document.getElementById("s-" + m[2]); if (t){ t.scrollIntoView({behavior:"smooth"}); return; } }
  lastRouteKey = key; route(); });
function applySettings(){
  const th = store.get("sti_theme","auto"); if (th==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.dataset.theme = th;
  document.documentElement.style.setProperty("--fs", (1.0625*Number(store.get("sti_size",1)))+"rem");
  document.documentElement.dataset.motion = store.get("sti_motion","full");
  $("#setTheme").value = th; $("#setSize").value = String(store.get("sti_size",1)); $("#setMotion").value = store.get("sti_motion","full"); $("#setVoice").value = String(store.get("sti_voice",1));
}
$("#settingsBtn").onclick = () => { $("#settings").showModal(); A("#settings", {opacity:[0,1], scale:[.97,1]}, SPRING); };
$("#searchBtn").onclick = openPalette;
$("#closeSettings").onclick = () => $("#settings").close();
$("#setTheme").onchange = e => { store.set("sti_theme", e.target.value); applySettings(); };
$("#setSize").onchange = e => { store.set("sti_size", +e.target.value); applySettings(); };
$("#setMotion").onchange = e => { store.set("sti_motion", e.target.value); applySettings(); };
$("#setVoice").onchange = e => store.set("sti_voice", +e.target.value);
$("#switchUser").onclick = () => { sendEvents(); store.del("sti_user"); user = null; aiHistory = []; $("#aiMsgs").innerHTML = ""; prog = {done:{},quiz:{},rating:{},uploads:[],minutes:0}; $("#settings").close(); renderWho(); location.hash = "#/back"; route(); };
$("#menuBtn").onclick = () => $("#map").classList.toggle("open");
$("#aiFab").onclick = () => aiOpen ? closeAI() : openAI();
$("#aiClose").onclick = closeAI;
$("#aiForm").onsubmit = e => { e.preventDefault(); askAI($("#aiInput").value); };
$("#aiInput").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && device !== "phone"){ e.preventDefault(); askAI($("#aiInput").value); } };
document.querySelectorAll("#bottomNav [data-nav]").forEach(b => b.onclick = () => {
  const n = b.dataset.nav;
  if (n === "home") location.hash = "#/home"; else if (n === "progress") location.hash = "#/progress";
  else if (n === "modules") $("#map").classList.toggle("open"); else if (n === "search") openPalette(); else if (n === "ask") aiOpen ? closeAI() : openAI();
});
if (!apiReady()) $("#banner").innerHTML = `<div class="banner">Preview mode: progress is saved on this device only. Add the Apps Script web app URL in CONFIG.API_URL to enable tracking, uploads, and Sensi.</div>`;
applyDevice(); applySettings();
if (user) api("access", {device, userAgent:navigator.userAgent.slice(0,140), page:"open"});
lastRouteKey = location.hash.split("?")[0];
flushQueue(); route();
</script>
